<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Comparativos con «than»',en:'Comparatives with «than»'}, reportId:'sum-comparatives' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Para comparar dos cosas el español usa <b>más … que</b> o <b>menos … que</b>: «la moto es <b>más rápida que</b> el bus».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">más rápido que</div><div class="role">ventaja</div><div class="desc">«La moto es más rápida que el bus.»</div></div><div class="art-box"><div class="word">menos que</div><div class="role">desventaja</div><div class="desc">«Los niños pagan menos que los adultos.»</div></div><div class="art-box"><div class="word">mejor que</div><div class="role">irregular</div><div class="desc">«Caminar es mejor que esperar.»</div></div></div>
        ${ii('⚖️','Siempre hay DOS partes: lo que comparas (A) y con qué lo comparas (B).')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «Mi cuarto es más tranquilo que el de la avenida». Primero A, luego «que», luego B.</div>`,
      en:`<div class="gdesc">To compare two things Spanish uses <b>más … que</b> or <b>menos … que</b>: «la moto es <b>más rápida que</b> el bus».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">más rápido que</div><div class="role">advantage</div><div class="desc">«La moto es más rápida que el bus.»</div></div><div class="art-box"><div class="word">menos que</div><div class="role">disadvantage</div><div class="desc">«Los niños pagan menos que los adultos.»</div></div><div class="art-box"><div class="word">mejor que</div><div class="role">irregular</div><div class="desc">«Caminar es mejor que esperar.»</div></div></div>
        ${ii('⚖️','There are always TWO parts: what you compare (A) and what you compare it with (B).')}
        <div class="gnote life">🌎 <b>From your life:</b> «Mi cuarto es más tranquilo que el de la avenida». First A, then «que», then B.</div>`
    },
    checks:[
      { q:{es:'«Más rápida que» compara:',en:'«Más rápida que» compares:'}, opts:{es:['Dos cosas','Tres o más cosas'],en:['Two things','Three or more things']}, correct:0, fb:{ why:{es:'Un comparativo compara dos elementos.',en:'A comparative compares two items.'}, tip:{es:'A … que … B',en:'A … than … B'}} },
      { q:{es:'En «el bus es más lento que la moto», ¿qué es más rápido?',en:'In «el bus es más lento que la moto», which is faster?'}, opts:{es:['La moto','El bus'],en:['The moto','The bus']}, correct:0, fb:{ why:{es:'Si el bus es más lento, la moto es más rápida.',en:'If the bus is slower, the moto is faster.'}, tip:{es:'lee la comparación al revés',en:'read the comparison backwards'}} },
      { q:{es:'«Los niños pagan menos que los adultos» significa:',en:'«Los niños pagan menos que los adultos» means:'}, opts:{es:['Los adultos pagan más','Todos pagan igual'],en:['Adults pay more','Everybody pays the same']}, correct:0, fb:{ why:{es:'«Menos que» pone a los niños abajo en el precio.',en:'«Menos que» puts children lower in price.'}, tip:{es:'menos = less',en:'menos = less'}} },
      { q:{es:'«Mejor» es la forma comparativa de:',en:'«Mejor» is the comparative of:'}, opts:{es:['bueno','malo'],en:['bueno','malo']}, correct:0, fb:{ why:{es:'bueno → mejor.',en:'bueno → mejor.'}, tip:{es:'good → better',en:'good → better'}} },
      { q:{es:'¿Qué palabra une las dos partes de la comparación?',en:'Which word joins the two parts?'}, opts:{es:['que','y'],en:['que','y']}, correct:0, fb:{ why:{es:'«Que» conecta A con B.',en:'«Que» connects A with B.'}, tip:{es:'que = than',en:'que = than'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés compara igual: primero A, luego el comparativo, luego <b>than</b> y B.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🏍️</span><span class="lbl">faster than</span><span class="es">más rápido que</span></div><div class="viz-item"><span class="ico">🐢</span><span class="lbl">slower than</span><span class="es">más lento que</span></div><div class="viz-item"><span class="ico">🤫</span><span class="lbl">quieter than</span><span class="es">más tranquilo que</span></div><div class="viz-item"><span class="ico">💰</span><span class="lbl">less than</span><span class="es">menos que</span></div><div class="viz-item"><span class="ico">👍</span><span class="lbl">better than</span><span class="es">mejor que</span></div><div class="viz-item"><span class="ico">🎉</span><span class="lbl">more exciting than</span><span class="es">más emocionante que</span></div></div>
        ${eg('A moto passes even <span class="tag s">faster than</span> a bus.','Una moto pasa aún más rápido que un bus.','ok')}
        ${eg('Children pay <span class="tag s">less than</span> adults.','Los niños pagan menos que los adultos.','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>El orden es el mismo: A + comparación + <b>than</b> + B.</li><li><b>than</b> = «que» en las comparaciones.</li><li>Se puede reforzar: <b>much</b> quieter = mucho más tranquilo.</li></ul>
        <div class="gnote">👍 faster · slower · bigger · quieter · cheaper · better · worse · more expensive · more exciting.</div>`,
      en:`<div class="gdesc">English compares the same way: first A, then the comparative, then <b>than</b> and B.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🏍️</span><span class="lbl">faster than</span><span class="es">más rápido que</span></div><div class="viz-item"><span class="ico">🐢</span><span class="lbl">slower than</span><span class="es">más lento que</span></div><div class="viz-item"><span class="ico">🤫</span><span class="lbl">quieter than</span><span class="es">más tranquilo que</span></div><div class="viz-item"><span class="ico">💰</span><span class="lbl">less than</span><span class="es">menos que</span></div><div class="viz-item"><span class="ico">👍</span><span class="lbl">better than</span><span class="es">mejor que</span></div><div class="viz-item"><span class="ico">🎉</span><span class="lbl">more exciting than</span><span class="es">más emocionante que</span></div></div>
        ${eg('A moto passes even <span class="tag s">faster than</span> a bus.','A moto passes even faster than a bus.','ok')}
        ${eg('Children pay <span class="tag s">less than</span> adults.','Children pay less than adults.','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>The order is the same: A + comparison + <b>than</b> + B.</li><li><b>than</b> = «que» in comparisons.</li><li>You can strengthen it: <b>much</b> quieter.</li></ul>
        <div class="gnote">👍 faster · slower · bigger · quieter · cheaper · better · worse · more expensive · more exciting.</div>`
    },
    checks:[
      { q:{es:'«más rápido que» = ',en:'«más rápido que» = '}, opts:{es:['faster than','more fast that'],en:['faster than','more fast that']}, correct:0, fb:{ why:{es:'Adjetivo corto + -er + than.',en:'Short adjective + -er + than.'}, ex:{es:'A moto passes even faster than a bus.',en:'A moto passes even faster than a bus.'}} },
      { q:{es:'«menos que» = ',en:'«menos que» = '}, opts:{es:['less than','less that'],en:['less than','less that']}, correct:0, fb:{ why:{es:'La palabra de comparación es «than».',en:'The comparison word is «than».'}, tip:{es:'than ≠ that',en:'than ≠ that'}} },
      { q:{es:'«mejor que» = ',en:'«mejor que» = '}, opts:{es:['better than','gooder than'],en:['better than','gooder than']}, correct:0, fb:{ why:{es:'good es irregular: better.',en:'good is irregular: better.'}, tip:{es:'good → better',en:'good → better'}} },
      { q:{es:'«más emocionante que» = ',en:'«más emocionante que» = '}, opts:{es:['more exciting than','excitinger than'],en:['more exciting than','excitinger than']}, correct:0, fb:{ why:{es:'Adjetivos largos usan «more».',en:'Long adjectives use «more».'}, ex:{es:'This is more exciting than television.',en:'This is more exciting than television.'}} },
      { q:{es:'«mucho más tranquilo» = ',en:'«mucho más tranquilo» = '}, opts:{es:['much quieter','very quieter'],en:['much quieter','very quieter']}, correct:0, fb:{ why:{es:'Se refuerza con «much», no con «very».',en:'You strengthen it with «much», not «very».'}, ex:{es:'Much quieter. Only the birds and the dog.',en:'Much quieter. Only the birds and the dog.'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">La gran diferencia: el inglés NO siempre usa «more». Los adjetivos cortos cambian de forma con <b>-er</b>.</div>
        <table class="dtab"><tr><th>Adjetivo</th><th>Regla</th><th>Comparativo</th></tr>
          <tr><td>fast · slow · cheap</td><td class="en">+ er</td><td>faster · slower · cheaper</td></tr>
          <tr><td>big</td><td class="en">doble consonante + er</td><td>bigger</td></tr>
          <tr><td>noisy · easy</td><td class="en">y → i + er</td><td>noisier · easier</td></tr>
          <tr><td>nice · large</td><td class="en">quita la e + er</td><td>nicer · larger</td></tr>
          <tr><td>expensive · exciting</td><td class="en">more + adjetivo</td><td>more expensive · more exciting</td></tr>
          <tr><td>good · bad · far</td><td class="en">irregulares</td><td>better · worse · farther</td></tr>
        </table>
        <div class="sec-label">⚠️ Nunca los dos juntos</div>
        ${ii('🚫','No se dice «<b>more faster</b>» ni «<b>more better</b>»: o usas <b>-er</b> o usas <b>more</b>, nunca los dos.')}
        ${eg('This room is <span class="tag s">warmer than</span> my old one.','Este cuarto es más cálido que el mío viejo.','ok')}
        ${eg('That is <span class="tag s">quieter than</span> the main avenue.','Eso es más tranquilo que la avenida principal.','ok')}
        ${eg('The moto is more faster than the bus.','Solo una marca: <b>faster than</b>.','bad')}
        ${eg('Walking is better that the bus.','La palabra de comparación es <b>than</b>, no «that».','bad')}
        <div class="gnote">📍 1 sílaba → -er · 2 sílabas con -y → -ier · 2 sílabas o más → more.</div>`,
      en:`<div class="gdesc">The big difference: English does NOT always use «more». Short adjectives change with <b>-er</b>.</div>
        <table class="dtab"><tr><th>Adjective</th><th>Rule</th><th>Comparative</th></tr>
          <tr><td>fast · slow · cheap</td><td class="en">+ er</td><td>faster · slower · cheaper</td></tr>
          <tr><td>big</td><td class="en">double consonant + er</td><td>bigger</td></tr>
          <tr><td>noisy · easy</td><td class="en">y → i + er</td><td>noisier · easier</td></tr>
          <tr><td>nice · large</td><td class="en">drop the e + er</td><td>nicer · larger</td></tr>
          <tr><td>expensive · exciting</td><td class="en">more + adjective</td><td>more expensive · more exciting</td></tr>
          <tr><td>good · bad · far</td><td class="en">irregular</td><td>better · worse · farther</td></tr>
        </table>
        <div class="sec-label">⚠️ Never both together</div>
        ${ii('🚫','You never say «<b>more faster</b>» or «<b>more better</b>»: use <b>-er</b> OR <b>more</b>, never both.')}
        ${eg('This room is <span class="tag s">warmer than</span> my old one.','This room is warmer than my old one.','ok')}
        ${eg('That is <span class="tag s">quieter than</span> the main avenue.','That is quieter than the main avenue.','ok')}
        ${eg('The moto is more faster than the bus.','Only one marker: <b>faster than</b>.','bad')}
        ${eg('Walking is better that the bus.','The comparison word is <b>than</b>, not «that».','bad')}
        <div class="gnote">📍 1 syllable → -er · 2 syllables with -y → -ier · 2+ syllables → more.</div>`
    },
    checks:[
      { q:{es:'«big» en comparativo:',en:'«big» in the comparative:'}, opts:{es:['bigger','biger'],en:['bigger','biger']}, correct:0, fb:{ why:{es:'Se dobla la consonante: bigger.',en:'The consonant doubles: bigger.'}, tip:{es:'big → bigger',en:'big → bigger'}} },
      { q:{es:'«noisy» en comparativo:',en:'«noisy» in the comparative:'}, opts:{es:['noisier','more noisy'],en:['noisier','more noisy']}, correct:0, fb:{ why:{es:'Con -y final: y → i + er.',en:'With final -y: y → i + er.'}, tip:{es:'noisy → noisier',en:'noisy → noisier'}} },
      { q:{es:'«expensive» en comparativo:',en:'«expensive» in the comparative:'}, opts:{es:['more expensive','expensiver'],en:['more expensive','expensiver']}, correct:0, fb:{ why:{es:'Adjetivo largo → more.',en:'Long adjective → more.'}, tip:{es:'more + largo',en:'more + long adj'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:['faster than the bus','more faster than the bus'],en:['faster than the bus','more faster than the bus']}, correct:0, fb:{ why:{es:'Una sola marca de comparación.',en:'Only one comparison marker.'}, ex:{es:'The moto is faster than the bus, but it costs more.',en:'The moto is faster than the bus, but it costs more.'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:['better than the bus','better that the bus'],en:['better than the bus','better that the bus']}, correct:0, fb:{ why:{es:'«Than» compara; «that» no.',en:'«Than» compares; «that» does not.'}, ex:{es:'Is walking better than the bus?',en:'Is walking better than the bus?'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">La fórmula de la comparación y cómo reforzarla:</div>
        <div class="fbox"><div class="frm"><span class="pill s">A</span><span class="plus">+</span><span class="pill v">be / verbo</span><span class="plus">+</span><span class="pill o">comparativo + than + B</span></div><div class="fex"><span class="en">The moto is faster than the bus.</span><span class="es">La moto es más rápida que el bus.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">much / a lot</span><span class="plus">+</span><span class="pill v">comparativo</span><span class="plus">+</span><span class="pill o">than + B</span></div><div class="fex"><span class="en">This room is much quieter than that one.</span><span class="es">Este cuarto es mucho más tranquilo que ese.</span></div></div>
        ${ii('🧠','<b>Tip 1 — cuenta sílabas:</b> corta → <b>-er</b> (cheaper) · larga → <b>more</b> (more expensive).')}
        ${ii('💥','<b>Tip 2 — los 3 irregulares del día:</b> good → <b>better</b> · bad → <b>worse</b> · far → <b>farther</b>.')}
        ${ii('📢','<b>Tip 3 — refuerzo:</b> <b>much</b> / <b>a lot</b> + comparativo («much better»), nunca «very better».')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «This room is more warmer than my old one» → ✅ «This room is <b>warmer than</b> my old one».</p></div>
        ${ii('⚡','Con verbos también se compara: «Children pay <b>less than</b> adults» · «It costs <b>more than</b> six soles».')}`,
      en:`<div class="gdesc">The comparison formula and how to strengthen it:</div>
        <div class="fbox"><div class="frm"><span class="pill s">A</span><span class="plus">+</span><span class="pill v">be / verb</span><span class="plus">+</span><span class="pill o">comparative + than + B</span></div><div class="fex"><span class="en">The moto is faster than the bus.</span><span class="es">The moto is faster than the bus.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">much / a lot</span><span class="plus">+</span><span class="pill v">comparative</span><span class="plus">+</span><span class="pill o">than + B</span></div><div class="fex"><span class="en">This room is much quieter than that one.</span><span class="es">This room is much quieter than that one.</span></div></div>
        ${ii('🧠','<b>Tip 1 — count syllables:</b> short → <b>-er</b> (cheaper) · long → <b>more</b> (more expensive).')}
        ${ii('💥','<b>Tip 2 — three irregulars:</b> good → <b>better</b> · bad → <b>worse</b> · far → <b>farther</b>.')}
        ${ii('📢','<b>Tip 3 — strengthening:</b> <b>much</b> / <b>a lot</b> + comparative («much better»), never «very better».')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «This room is more warmer than my old one» → ✅ «This room is <b>warmer than</b> my old one».</p></div>
        ${ii('⚡','You can also compare with verbs: «Children pay <b>less than</b> adults» · «It costs <b>more than</b> six soles».')}`
    },
    checks:[
