he hour."},{"w":"evidence","es":"prueba / comprobante","ex":"The ticket is your evidence of payment."},{"w":"digit","es":"dígito / cifra","ex":"Every bus number has three digits."},{"w":"meter · measure","es":"metro · medir","ex":"They measure the sides in meters."},{"w":"consist (of)","es":"consistir (en)","ex":"The trip consists of one bus and a short walk."},{"w":"divide","es":"dividir / repartir","ex":"Miss Rosa divides the class into four groups."},{"w":"provide","es":"proveer / dar","ex":"The house provides water, light and internet."},{"w":"method","es":"método","ex":"Then the bus is the best method."},{"w":"occur","es":"ocurrir / suceder","ex":"Delays occur when it rains."},{"w":"discuss · disagree","es":"conversar sobre · no estar de acuerdo","ex":"They discuss the route, but they disagree."},{"w":"evaluate · interpret","es":"evaluar · interpretar","ex":"Ravi interprets the graph for his classmates."},{"w":"graph · equation","es":"gráfico · ecuación","ex":"Miss Rosa writes an equation on the board."},{"w":"figure (out)","es":"entender / descifrar","ex":"I cannot figure out this map."},{"w":"guess","es":"suponer / adivinar","ex":"I guess the clinic is on the other side."},{"w":"find · meet","es":"encontrar · encontrarse con","ex":"They meet at the bus stop at seven."},{"w":"hear · see · look · show · shown","es":"oír · ver · mirar · mostrar · mostrado","ex":"The way is shown with a thick blue line."},{"w":"sight","es":"vista / panorama","ex":"That is the best sight in our section."},{"w":"again","es":"otra vez","ex":"Can you say the three steps again?"},{"w":"another","es":"otro / otra","ex":"Do not take another bus."},{"w":"exactly","es":"exactamente","ex":"The bus stops exactly in front of them."},{"w":"normal","es":"normal","ex":"Fifty minutes, if the traffic is normal."},{"w":"rather (would rather)","es":"más bien / preferir","ex":"She would rather walk than wait."},{"w":"simply","es":"simplemente","ex":"Simply follow the main street."},{"w":"then · finally","es":"luego · finalmente","ex":"Then turn east. Finally, the clinic appears."},{"w":"entire · entered","es":"entero · entró / entraron","ex":"They entered by the front door. The entire trip took 22 minutes."},{"w":"heavy · thick · dry","es":"pesado · grueso · seco","ex":"A thick line on the map. The wind is dry."},{"w":"shape · design","es":"forma · diseño","ex":"The square has the shape of a letter L."},{"w":"grow · grew · grass · sand · sky","es":"crecer · creció · césped · arena · cielo","ex":"The line of cars grew longer. Grass grows near the wall."},{"w":"dissolve","es":"disolver(se)","ex":"Sugar dissolves in a cup of hot tea."},{"w":"members · men","es":"miembros · hombres","ex":"Members of the band play a melody. Two men carry a box."},{"w":"melody · film · event","es":"melodía · película · evento","ex":"A city event begins in the main street."},{"w":"march","es":"marchar / desfilar (y marzo)","ex":"The school band marches behind them."},{"w":"gun","es":"pistola (de salida)","ex":"A gun starts a small race."},{"w":"fight","es":"pelear","ex":"Kiko does not fight about it."},{"w":"exciting","es":"emocionante","ex":"This is more exciting than television."},{"w":"meat · fig","es":"carne · higo","ex":"A woman sells figs, bread and meat."},{"w":"dog · fingers · sat","es":"perro · dedos · se sentó","ex":"She counts the blocks on her fingers."},{"w":"goodbye","es":"adiós","ex":"Goodbye, big traveler!"},{"w":"England · English · Greek","es":"Inglaterra · inglés · griego","ex":"A family from England asks in English."},{"w":"-ment (movement · payment)","es":"sufijo que forma sustantivos","ex":"Slow, heavy movements. Your evidence of payment."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"The Long Way to the Clinic","sTitleEs":"El camino largo a la clínica","dTitle":"Which Way to the Clinic?","dTitleEs":"¿Por dónde está la clínica?","paras":[[["Nina is new in this city, and today she must go to the clinic.","Nina es nueva en esta ciudad y hoy tiene que ir a la clínica."],["Her appointment is at ten, so she leaves the house at nine.","Su cita es a las diez, así que sale de la casa a las nueve."],["Her aunt draws a small map on a piece of paper.","Su tía le dibuja un mapa pequeño en un papel."],["\"Simply follow the main street,\" her aunt says at the door.","«Simplemente sigue la calle principal», dice su tía en la puerta."],["Nina puts the map upon her bag and walks out.","Nina pone el mapa sobre su bolso y sale."]],[["The main street is wide, dry and very noisy.","La calle principal es ancha, seca y muy ruidosa."],["Buses pass fast, and a moto passes even faster than a bus.","Los buses pasan rápido, y una moto pasa aún más rápido que un bus."],["Nina walks two blocks and looks for a red sign.","Nina camina dos cuadras y busca un letrero rojo."],["She sees a bank, a bakery and a small Greek restaurant.","Ve un banco, una panadería y un pequeño restaurante griego."],["The clinic is not there, so she continues to the corner.","La clínica no está ahí, así que continúa hasta la esquina."]],[["At the corner, the street becomes narrow and quiet.","En la esquina, la calle se vuelve angosta y tranquila."],["A brown dog sleeps behind a green gate, in the sun.","Un perro marrón duerme detrás de una puerta verde, al sol."],["Nina hears the dog and stops for one second.","Nina escucha al perro y se detiene un segundo."],["She looks at the map again and turns it around.","Mira el mapa otra vez y le da la vuelta."],["\"I guess the clinic is on the other side,\" she says.","«Supongo que la clínica está al otro lado», dice."]],[["She crosses the street and walks on the other side.","Cruza la calle y camina por el otro lado."],["Here the houses are old, and green grass grows near a low wall.","Aquí las casas son viejas y crece césped verde junto a un muro bajo."],["A woman waters her plants and hums a soft melody.","Una señora riega sus plantas y canturrea una melodía suave."],["Nina walks slower now, because the map feels heavy in her hand.","Nina camina más despacio ahora, porque el mapa se siente pesado en su mano."],["She would rather walk than wait for another bus.","Prefiere caminar antes que esperar otro bus."]],[["After ten minutes, Nina knows she is lost.","Después de diez minutos, Nina sabe que está perdida."],["The sky is bright, and the air smells like bread and rain.","El cielo está brillante y el aire huele a pan y lluvia."],["She counts the blocks on her fingers: one, two, three, four.","Cuenta las cuadras con los dedos: una, dos, tres, cuatro."],["The map shows three blocks, not four.","El mapa muestra tres cuadras, no cuatro."],["\"I cannot figure out this map,\" she says out loud.","«No logro entender este mapa», dice en voz alta."]],[["A blue kiosk stands at the edge of the little park.","Un kiosco azul está en el borde del parquecito."],["Don Beto sells water, bread and newspapers there every day.","Don Beto vende agua, pan y periódicos ahí todos los días."],["Nina shows him the map and asks for help.","Nina le muestra el mapa y le pide ayuda."],["The way is shown with a thick blue line.","El camino está mostrado con una línea azul gruesa."],["Don Beto smiles and says, \"Your aunt drew the old street.\"","Don Beto sonríe y dice: «Tu tía dibujó la calle vieja»."]],[["\"Go back one block, then turn east,\" he says slowly.","«Regresa una cuadra, luego dobla al este», dice despacio."],["\"Continue to the church and pass behind it.\"","«Continúa hasta la iglesia y pasa por detrás de ella»."],["\"The clinic is across from a blue kiosk, next to a tree.\"","«La clínica está frente a un kiosco azul, junto a un árbol»."],["Nina repeats the three steps again, in Spanish and in English.","Nina repite los tres pasos otra vez, en español y en inglés."],["Don Beto nods and shows her the way with his hand.","Don Beto asiente y le muestra el camino con la mano."]],[["Nina walks back and finds the church very quickly.","Nina regresa y encuentra la iglesia muy rápido."],["Two men carry a heavy box out of a truck.","Dos hombres cargan una caja pesada fuera de un camión."],["Behind the church, the narrow street opens into a small square.","Detrás de la iglesia, la calle angosta se abre a una placita."],["A family from England asks the same question in English.","Una familia de Inglaterra hace la misma pregunta en inglés."],["Nina interprets the answer for them: \"Across the street, near the kiosk.\"","Nina les interpreta la respuesta: «Al otro lado de la calle, cerca del kiosco»."]],[["Finally, the white clinic appears on her right.","Finalmente, la clínica blanca aparece a su derecha."],["It is nine minutes before ten — exactly on time.","Faltan nueve minutos para las diez: exactamente a tiempo."],["Nina sat on a bench and drank cold water.","Nina se sentó en una banca y tomó agua fría."],["The lost half hour was not normal, but it was not bad either.","La media hora perdida no fue normal, pero tampoco fue mala."],["\"Next time I bring a better map,\" she thinks. \"Goodbye, old streets!\"","«La próxima vez traigo un mapa mejor», piensa. «¡Adiós, calles viejas!»"]]],"datos":["Preposiciones de lugar: <b>behind</b> (detrás) · <b>across from</b> (frente a) · <b>next to</b> (junto a) · <b>near / nearby</b> (cerca): <span class=\"frase\">The clinic is across from a blue kiosk.</span>","Imperativos para dar indicaciones: <span class=\"frase\">Go back one block, then turn east. Continue to the church and pass behind it.</span>","Comparación con <b>than</b>: <span class=\"frase\">A moto passes even faster than a bus.</span> · <b>would rather … than</b> = preferir.",null],"dlg":[["Nina","Excuse me, sir. Is the clinic near here?","Disculpe, señor. ¿La clínica está cerca de aquí?"],["Don Beto","Yes, it is nearby. Are you looking for the blue one?","Sí, está cerca. ¿Buscas la azul?"],["Nina","I think so. My aunt drew this map for me.","Creo que sí. Mi tía me dibujó este mapa."],["Don Beto","Let me see. Ah, this thick line is the old street.","Déjame ver. Ah, esta línea gruesa es la calle vieja."],["Nina","The old street? So my map is wrong?","¿La calle vieja? ¿Entonces mi mapa está mal?"],["Don Beto","Not wrong, simply old. The city changes every year.","No está mal, simplemente es viejo. La ciudad cambia cada año."],["Nina","How far is the clinic from here?","¿Qué tan lejos está la clínica de aquí?"],["Don Beto","About four hundred meters. Ten minutes on foot.","Unos cuatrocientos metros. Diez minutos a pie."],["Nina","Is walking better than the bus?","¿Caminar es mejor que el bus?"],["Don Beto","Much better. The bus goes south, not east.","Mucho mejor. El bus va al sur, no al este."],["Nina","Then which way do I take?","¿Entonces por dónde voy?"],["Don Beto","Go back one block and turn left at the church.","Regresa una cuadra y dobla a la izquierda en la iglesia."],["Nina","Behind the church or in front of it?","¿Detrás de la iglesia o delante de ella?"],["Don Beto","Pass behind it. Then continue along a narrow street.","Pasa por detrás. Luego continúa por una calle angosta."],["Nina","Is there a dog on that street? I hear one.","¿Hay un perro en esa calle? Escucho uno."],["Don Beto","Yes, but he sleeps behind a gate. He never leaves.","Sí, pero duerme detrás de una puerta. Nunca sale."],["Nina","Good. And after the narrow street?","Bien. ¿Y después de la calle angosta?"],["Don Beto","You come out at a small square with green grass.","Sales a una placita con césped verde."],["Nina","Is the clinic on that square?","¿La clínica está en esa placita?"],["Don Beto","It is across the street, next to a blue kiosk.","Está al otro lado de la calle, junto a un kiosco azul."],["Nina","Can you show me on the map, please?","¿Me lo puede mostrar en el mapa, por favor?"],["Don Beto","Of course. Here is the square, and here is the clinic.","Claro. Aquí está la placita y aquí está la clínica."],["Nina","Can you say the three steps again?","¿Puede decir los tres pasos otra vez?"],["Don Beto","Church, narrow street, blue kiosk. That is the best way.","Iglesia, calle angosta, kiosco azul. Ese es el mejor camino."],["Nina","Thank you very much! I have exactly nine minutes.","¡Muchas gracias! Tengo exactamente nueve minutos."],["Don Beto","Then walk fast, not slow. Goodbye, and good luck!","Entonces camina rápido, no despacio. ¡Adiós y buena suerte!"]]},"2":{"sTitle":"My First Bus","sTitleEs":"Mi primer bus","dTitle":"Bus, Moto, or Walk?","dTitleEs":"¿Bus, moto o a pie?","paras":[[["Tomás is twelve, and today is his first bus trip without his mother.","Tomás tiene doce años y hoy es su primer viaje en bus sin su mamá."],["Well, not alone: his cousin Kiko goes with him.","Bueno, no solo: su primo Kiko va con él."],["They walk to the corner where all the buses stop.","Caminan hasta la esquina donde paran todos los buses."],["The trip consists of one bus and a short walk.","El viaje consiste en un bus y una caminata corta."],["\"This is exciting,\" Tomás says, and Kiko laughs.","«Esto es emocionante», dice Tomás, y Kiko se ríe."]],[["Bus 301 arrives at eight in the morning.","El bus 301 llega a las ocho de la mañana."],["Kiko reads the three digits out loud: three, zero, one.","Kiko lee los tres dígitos en voz alta: tres, cero, uno."],["\"Always check the digits, because another bus goes south,\" he says.","«Siempre revisa los dígitos, porque otro bus va al sur», dice."],["The engine makes a deep, warm sound near the wall.","El motor hace un sonido profundo y cálido junto a la pared."],["The bus comes to a halt exactly in front of them.","El bus se detiene exactamente frente a ellos."]],[["They entered by the front door, one behind the other.","Entraron por la puerta delantera, uno detrás del otro."],["The driver takes the fare and gives them two small tickets.","El chofer recibe el pasaje y les da dos boletos pequeños."],["\"Keep it,\" Kiko says. \"The ticket is your evidence of payment.\"","«Guárdalo», dice Kiko. «El boleto es tu comprobante de pago»."],["Fares vary with age: children pay less than adults.","Las tarifas varían según la edad: los niños pagan menos que los adultos."],["Tomás puts his ticket in the pocket of his shirt.","Tomás pone su boleto en el bolsillo de su camisa."]],[["The bus is full, so they stand near the door.","El bus está lleno, así que se paran junto a la puerta."],["Then two seats open in the back section.","Luego se desocupan dos asientos en la sección de atrás."],["Tomás sat next to the window with his heavy bag on his knees.","Tomás se sentó junto a la ventana con su bolsa pesada en las rodillas."],["The window shows the entire street, from the market to the bridge.","La ventana muestra la calle entera, desde el mercado hasta el puente."],["He can smell meat, bread and coffee from the food stalls.","Puede oler carne, pan y café de los puestos de comida."]],[["A radio plays a slow melody at the front of the bus.","Una radio toca una melodía lenta en la parte delantera del bus."],["Kiko discusses the route with an old man in a blue hat.","Kiko conversa sobre la ruta con un señor de sombrero azul."],["They disagree about the fastest way to the clinic.","No están de acuerdo sobre el camino más rápido a la clínica."],["\"The main avenue is slower than the small streets,\" says the man.","«La avenida principal es más lenta que las calles pequeñas», dice el señor."],["Kiko is not sure, but he does not fight about it.","Kiko no está seguro, pero no pelea por eso."]],[["Traffic delays occur every morning near the school.","Los retrasos de tráfico ocurren cada mañana cerca de la escuela."],["Today the line of cars grew longer and longer.","Hoy la fila de carros se hizo más y más larga."],["The bus moves one meter, then stops again.","El bus avanza un metro, luego se detiene otra vez."],["Tomás looks at his watch and worries about the time.","Tomás mira su reloj y se preocupa por la hora."],["\"We have ten minutes. This is normal,\" Kiko says.","«Tenemos diez minutos. Esto es normal», dice Kiko."]],[["A woman with two bags asks for a seat.","Una señora con dos bolsas pide un asiento."],["Tomás stands up and provides his seat for her.","Tomás se levanta y le da su asiento."],["She thanks him and says he has a good heart.","Ella le agradece y dice que tiene buen corazón."],["Kiko divides his bread and gives half to his cousin.","Kiko divide su pan y le da la mitad a su primo."],["\"This is my method for long trips,\" he laughs.","«Este es mi método para viajes largos», ríe."]],[["The bus turns east, and the market disappears behind them.","El bus dobla al este y el mercado desaparece detrás de ellos."],["Far away, Tomás sees the port with one white ship.","A lo lejos, Tomás ve el puerto con un barco blanco."],["\"Is that a real ship?\" he asks, with his fingers on the glass.","«¿Ese es un barco de verdad?», pregunta, con los dedos en el vidrio."],["\"Yes, the sea is only twenty minutes from here,\" says Kiko.","«Sí, el mar está a solo veinte minutos de aquí», dice Kiko."],["The city looks like a scene from an old film.","La ciudad parece una escena de una película vieja."]],[["They get out at the third stop, near the clinic.","Se bajan en el tercer paradero, cerca de la clínica."],["The entire trip took exactly twenty-two minutes.","El viaje entero tomó exactamente veintidós minutos."],["Tomás keeps his ticket like a small prize.","Tomás guarda su boleto como un pequeño premio."],["\"Tomorrow I can do this alone,\" he says with a big smile.","«Mañana puedo hacer esto solo», dice con una gran sonrisa."],["Kiko waves and answers, \"Goodbye, big traveler!\"","Kiko se despide con la mano y responde: «¡Adiós, gran viajero!»"]]],"datos":["Comparación con <b>than</b>: <span class=\"frase\">Children pay less than adults.</span> · <span class=\"frase\">The main avenue is slower than the small streets.</span>","Movimiento: <b>get on / get out (of)</b> · <b>enter by</b> · <b>turn east</b> · <b>come to a halt</b>: <span class=\"frase\">They entered by the front door.</span>","Preguntas con <b>How</b>: <span class=\"frase\">How much is the fare? · How long is the trip?</span>",null],"dlg":[["Tomás","Kiko, how do we go to the stadium tomorrow?","Kiko, ¿cómo vamos al estadio mañana?"],["Kiko","We have three options: the bus, a moto, or our feet.","Tenemos tres opciones: el bus, una moto o nuestros pies."],["Tomás","Which one is the fastest?","¿Cuál es la más rápida?"],["Kiko","The moto is faster than the bus, but it costs more.","La moto es más rápida que el bus, pero cuesta más."],["Tomás","How much is a moto from here?","¿Cuánto cuesta una moto desde aquí?"],["Kiko","Six soles for two people. We can divide it.","Seis soles por dos personas. Podemos dividirlo."],["Tomás","And the bus?","¿Y el bus?"],["Kiko","One sol fifty. Children under seven pay less.","Un sol cincuenta. Los menores de siete años pagan menos."],["Tomás","Fares vary with age, right?","Las tarifas varían según la edad, ¿cierto?"],["Kiko","Exactly. And always keep your ticket as evidence.","Exactamente. Y siempre guarda tu boleto como comprobante."],["Tomás","My uncle drives a moto on Sundays.","Mi tío maneja una moto los domingos."],["Kiko","Then ask him! But he works in the south.","¡Entonces pregúntale! Pero él trabaja en el sur."],["Tomás","Walking is free. How far is the stadium?","Caminar es gratis. ¿Qué tan lejos está el estadio?"],["Kiko","Two kilometers. Thirty minutes, more or less.","Dos kilómetros. Treinta minutos, más o menos."],["Tomás","I disagree with the moto. Thirty minutes is nothing.","No estoy de acuerdo con la moto. Treinta minutos no es nada."],["Kiko","But we carry a heavy bag with the drums.","Pero llevamos una bolsa pesada con los tambores."],["Tomás","True. Then the bus is the best method.","Cierto. Entonces el bus es el mejor método."],["Kiko","Which bus? Remember the digits.","¿Qué bus? Recuerda los dígitos."],["Tomás","Bus 301 goes east, and 305 goes south.","El bus 301 va al este y el 305 va al sur."],["Kiko","Very good. Do not take another bus.","Muy bien. No tomes otro bus."],["Tomás","Where exactly do we get out?","¿Dónde nos bajamos exactamente?"],["Kiko","At the third stop, behind the market.","En el tercer paradero, detrás del mercado."],["Tomás","And where do we meet in the morning?","¿Y dónde nos encontramos en la mañana?"],["Kiko","At the kiosk on the corner, at seven.","En el kiosco de la esquina, a las siete."],["Tomás","Let us discuss the return trip tonight.","Hablemos del regreso esta noche."],["Kiko","Perfect. Sleep early. Goodbye, traveler!","Perfecto. Duerme temprano. ¡Adiós, viajero!"]]},"3":{"sTitle":"The Room on Narrow Street","sTitleEs":"El cuarto de la calle angosta","dTitle":"Can We See the Room?","dTitleEs":"¿Podemos ver el cuarto?","paras":[[["Sara and her mother need a room near the school.","Sara y su mamá necesitan un cuarto cerca de la escuela."],["A paper on a wall says: \"Room for rent — Narrow Street 45.\"","Un papel en una pared dice: «Cuarto en alquiler — Calle Angosta 45»."],["The street is really narrow: two people and one bicycle, no more.","La calle es realmente angosta: dos personas y una bicicleta, no más."],["They walk from the market and find the blue door.","Caminan desde el mercado y encuentran la puerta azul."],["Doña Elsa opens it and shows them the way in.","Doña Elsa la abre y les muestra el camino hacia dentro."]],[["The room is on the second floor, at the back of the house.","El cuarto está en el segundo piso, al fondo de la casa."],["It has one window that looks upon a small yard.","Tiene una ventana que da a un patio pequeño."],["Green grass and two orange trees grow there.","Ahí crecen césped verde y dos naranjos."],["\"The morning sun dries the clothes fast,\" says Doña Elsa.","«El sol de la mañana seca la ropa rápido», dice Doña Elsa."],["Sara likes the yard, and she likes the quiet.","A Sara le gusta el patio y le gusta la tranquilidad."]],[["Mother measures the room with her steps: four by five.","Mamá mide el cuarto con sus pasos: cuatro por cinco."],["The shape is almost square, with a soft yellow wall.","La forma es casi cuadrada, con una pared amarilla suave."],["The design is simple: one bed, one desk, one shelf, one lamp.","El diseño es simple: una cama, un escritorio, un estante, una lámpara."],["The floor is dry and clean, and the walls are thick.","El piso está seco y limpio, y las paredes son gruesas."],["\"This room is warmer than my old one,\" Sara thinks.","«Este cuarto es más cálido que el mío viejo», piensa Sara."]],[["Doña Elsa explains what the house provides: water, light and internet.","Doña Elsa explica lo que provee la casa: agua, luz e internet."],["The rent consists of two parts: the room and the services.","El alquiler consiste en dos partes: el cuarto y los servicios."],["Members of the family share the kitchen and the roof.","Los miembros de la familia comparten la cocina y la azotea."],["\"We are six members here, all quiet people,\" she says.","«Somos seis miembros aquí, todos gente tranquila», dice."],["Sara's mother asks about the rules of the house.","La mamá de Sara pregunta por las reglas de la casa."]],[["\"No loud music after nine,\" Doña Elsa says.","«Nada de música fuerte después de las nueve», dice Doña Elsa."],["\"And close the gate, please, because of the dog.\"","«Y cierren la puerta, por favor, por el perro»."],["A brown dog sleeps behind the gate, exactly like a guard.","Un perro marrón duerme detrás de la puerta, exactamente como un guardián."],["Sara laughs and asks the age of the dog.","Sara se ríe y pregunta la edad del perro."],["\"He is eleven — old, but very awake,\" says Doña Elsa.","«Tiene once: viejo, pero muy despierto», dice Doña Elsa."]],[["In the kitchen, sugar dissolves in a cup of hot tea.","En la cocina, el azúcar se disuelve en una taza de té caliente."],["They sit and discuss the day of the payment.","Se sientan y conversan sobre el día del pago."],["Mother and Doña Elsa disagree about the deposit, but only a little.","Mamá y Doña Elsa no están de acuerdo con el depósito, pero solo un poco."],["\"Half now, half in March,\" they finally agree.","«La mitad ahora, la mitad en marzo», acuerdan finalmente."],["Sara counts the money on her fingers, twice.","Sara cuenta el dinero con los dedos, dos veces."]],[["There is another room nearby, on the main avenue.","Hay otro cuarto cerca, en la avenida principal."],["That room is bigger, but the street is very loud.","Ese cuarto es más grande, pero la calle es muy ruidosa."],["Mother wants to evaluate both rooms before she decides.","Mamá quiere evaluar los dos cuartos antes de decidir."],["\"The best room is not always the biggest one,\" she says.","«El mejor cuarto no siempre es el más grande», dice."],["Sara agrees: a quiet yard is better than a big window.","Sara está de acuerdo: un patio tranquilo es mejor que una ventana grande."]],[["They walk back to see the second room at four.","Regresan a ver el segundo cuarto a las cuatro."],["Buses pass every minute, and the air is grey.","Los buses pasan cada minuto y el aire está gris."],["A film plays very loudly in the shop below the room.","Una película suena muy fuerte en la tienda debajo del cuarto."],["\"I cannot study here,\" Sara says, and her mother nods.","«No puedo estudiar aquí», dice Sara, y su mamá asiente."],["They return to Narrow Street before the sun goes down.","Regresan a la Calle Angosta antes de que se ponga el sol."]],[["Doña Elsa provides a small table for Sara's books.","Doña Elsa provee una mesa pequeña para los libros de Sara."],["Sara puts her map of the city upon the wall.","Sara pone su mapa de la ciudad sobre la pared."],["From the window she can see the church and the sky.","Desde la ventana puede ver la iglesia y el cielo."],["The room is small, but it is her own side of the world.","El cuarto es pequeño, pero es su propio lado del mundo."],["\"Home,\" she says simply, and turns on the lamp.","«Casa», dice simplemente, y enciende la lámpara."]]],"datos":["Superlativos: <b>the best · the biggest · the fastest</b>: <span class=\"frase\">The best room is not always the biggest one.</span>","Comparación con <b>than</b> (adjetivos cortos + <b>-er</b>): <span class=\"frase\">This room is warmer than my old one.</span>","Preposiciones de lugar: <b>at the back of</b> · <b>upon</b> · <b>behind</b> · <b>nearby</b>: <span class=\"frase\">The room is at the back of the house.</span>",null],"dlg":[["Mamá","Good afternoon. We saw your paper on the wall.","Buenas tardes. Vimos su aviso en la pared."],["Doña Elsa","Welcome! Do you want to see the room?","¡Bienvenidas! ¿Quieren ver el cuarto?"],["Mamá","Yes, please. Is it upstairs?","Sí, por favor. ¿Está arriba?"],["Doña Elsa","On the second floor, at the back of the house.","En el segundo piso, al fondo de la casa."],["Mamá","How big is the room?","¿Qué tan grande es el cuarto?"],["Doña Elsa","Four meters by five. Come in and measure it.","Cuatro metros por cinco. Entren y mídanlo."],["Mamá","The shape is nice, almost square.","La forma es bonita, casi cuadrada."],["Doña Elsa","And the window looks upon the yard, not the street.","Y la ventana da al patio, no a la calle."],["Mamá","That is quieter than the main avenue.","Eso es más tranquilo que la avenida principal."],["Doña Elsa","Much quieter. Only the birds and the dog.","Mucho más tranquilo. Solo los pájaros y el perro."],["Mamá","How much is the rent?","¿Cuánto es el alquiler?"],["Doña Elsa","Three hundred soles. Water and light are included.","Trescientos soles. Agua y luz están incluidos."],["Mamá","Does the house provide internet?","¿La casa provee internet?"],["Doña Elsa","Yes, and the signal is good in this section.","Sí, y la señal es buena en esta sección."],["Mamá","How many members live here?","¿Cuántos miembros viven aquí?"],["Doña Elsa","Six people, all quiet. We share the kitchen.","Seis personas, todas tranquilas. Compartimos la cocina."],["Mamá","Are there rules about visitors?","¿Hay reglas sobre las visitas?"],["Doña Elsa","Visitors until nine. And close the gate, please.","Visitas hasta las nueve. Y cierren la puerta, por favor."],["Mamá","Can we pay half now and half in March?","¿Podemos pagar la mitad ahora y la mitad en marzo?"],["Doña Elsa","We can discuss that. I think it is possible.","Podemos hablarlo. Creo que es posible."],["Mamá","Is the clinic far from here?","¿La clínica está lejos de aquí?"],["Doña Elsa","Two blocks away, behind the church.","A dos cuadras, detrás de la iglesia."],["Mamá","Perfect. My daughter walks to school in ten minutes.","Perfecto. Mi hija camina a la escuela en diez minutos."],["Doña Elsa","Then this is the best room for her. Goodbye!","Entonces este es el mejor cuarto para ella. ¡Adiós!"]]},"4":{"sTitle":"Four Sections of the City","sTitleEs":"Cuatro secciones de la ciudad","dTitle":"Two Tickets, Please","dTitleEs":"Dos boletos, por favor","paras":[[["Miss Rosa divides the class into four groups.","Miss Rosa divide la clase en cuatro grupos."],["Each group studies one section of the city: north, south, east and west.","Cada grupo estudia una sección de la ciudad: norte, sur, este y oeste."],["\"Your method is simple,\" she says. \"Look, measure and ask.\"","«Su método es simple», dice. «Miren, midan y pregunten»."],["Leo and Ravi get the south section, near the old port.","Leo y Ravi reciben la sección sur, cerca del puerto viejo."],["They must show their work to the class on Monday.","Deben mostrar su trabajo a la clase el lunes."]],[["On Saturday, they meet at the bus stop at seven.","El sábado se encuentran en el paradero a las siete."],["The city is quiet, and the sky is a soft grey.","La ciudad está tranquila y el cielo es de un gris suave."],["They carry a map, a notebook and a long meter tape.","Llevan un mapa, un cuaderno y una cinta métrica larga."],["\"First we measure the main square,\" says Ravi.","«Primero medimos la plaza principal», dice Ravi."],["Leo draws a thick line on the map for their route.","Leo dibuja una línea gruesa en el mapa para su ruta."]],[["The square has the shape of a big letter L.","La plaza tiene la forma de una letra L grande."],["They count the trees and measure the sides in meters.","Cuentan los árboles y miden los lados en metros."],["Two men clean the floor with slow, heavy movements.","Dos hombres limpian el piso con movimientos lentos y pesados."],["A woman sells figs, bread and meat near the church.","Una señora vende higos, pan y carne cerca de la iglesia."],["Ravi buys three figs and divides them with his friend.","Ravi compra tres higos y los divide con su amigo."]],[["At nine, a city event begins in the main street.","A las nueve, un evento de la ciudad empieza en la calle principal."],["A gun starts a small race, and the runners fly away.","Una pistola de salida da inicio a una carrera pequeña, y los corredores salen volando."],["Then the school band marches behind them, loud and happy.","Luego la banda del colegio marcha detrás de ellos, fuerte y alegre."],["Members of the band play the same melody again and again.","Los miembros de la banda tocan la misma melodía una y otra vez."],["\"This is more exciting than television,\" Leo says.","«Esto es más emocionante que la televisión», dice Leo."]],[["They continue south, to the old port.","Continúan al sur, hasta el puerto viejo."],["The sea appears, wide and grey, with one big ship.","El mar aparece, ancho y gris, con un barco grande."],["The wind is dry and full of sand.","El viento está seco y lleno de arena."],["Leo takes photos of the ship, the sand and the sky.","Leo toma fotos del barco, la arena y el cielo."],["\"That is the best sight in our section,\" Ravi says.","«Esa es la mejor vista de nuestra sección», dice Ravi."]],[["At noon they sat on a wall to eat and write.","Al mediodía se sentaron en un muro a comer y escribir."],["They count buses: fourteen in one hour, exactly.","Cuentan buses: catorce en una hora, exactamente."],["\"Every bus number has three digits,\" Leo notes.","«Cada número de bus tiene tres dígitos», anota Leo."],["The number of passengers varies with the hour of the day.","El número de pasajeros varía según la hora del día."],["From those numbers they can draw a graph.","Con esos números pueden dibujar un gráfico."]],[["On Monday they show their work to the entire class.","El lunes muestran su trabajo a toda la clase."],["The graph shows that delays occur after eight in the morning.","El gráfico muestra que los retrasos ocurren después de las ocho de la mañana."],["Miss Rosa writes an equation on the board: time = distance ÷ speed.","Miss Rosa escribe una ecuación en la pizarra: tiempo = distancia ÷ velocidad."],["\"With this you can evaluate two routes,\" she says.","«Con esto pueden evaluar dos rutas», dice."],["Ravi interprets the graph for his classmates.","Ravi interpreta el gráfico para sus compañeros."]],[["Another group entered the room with a small model.","Otro grupo entró al salón con una maqueta pequeña."],["Their model of the north section has a beautiful design.","Su maqueta de la sección norte tiene un diseño hermoso."],["The two groups disagree about the fastest way to the port.","Los dos grupos no están de acuerdo sobre el camino más rápido al puerto."],["They discuss the problem with numbers, and nobody fights.","Discuten el problema con números y nadie pelea."],["\"Evidence, not voices,\" says Miss Rosa, and everybody laughs.","«Evidencia, no gritos», dice Miss Rosa, y todos se ríen."]],[["Finally, the four maps hang together upon the wall.","Finalmente, los cuatro mapas cuelgan juntos sobre la pared."],["The four sections form the entire city, side by side.","Las cuatro secciones forman la ciudad entera, lado a lado."],["Near the edge of the map, the grass and the sea grow together.","Cerca del borde del mapa, el césped y el mar crecen juntos."],["The morning fog slowly dissolves in Leo's photo of the port.","La niebla de la mañana se disuelve despacio en la foto del puerto de Leo."],["\"Now I can find any street,\" he says. \"Goodbye, small map!\"","«Ahora puedo encontrar cualquier calle», dice. «¡Adiós, mapita!»"]]],"datos":["Superlativos: <span class=\"frase\">That is the best sight in our section.</span> · <b>the fastest way</b> (el camino más rápido).","Imperativos de instrucción: <span class=\"frase\">Look, measure and ask.</span> · Secuencia: <b>first · then · finally</b>.","Preguntas con <b>How</b>: <span class=\"frase\">How many buses pass in one hour? · How far is the port?</span>",null],"dlg":[["Sara","Good morning. Two tickets to the beach, please.","Buenos días. Dos boletos a la playa, por favor."],["Señora Paz","For today or for tomorrow?","¿Para hoy o para mañana?"],["Sara","For tomorrow, in the morning.","Para mañana, por la mañana."],["Señora Paz","The first bus leaves at six thirty.","El primer bus sale a las seis y media."],["Sara","How much is the fare?","¿Cuánto es el pasaje?"],["Señora Paz","Nine soles for adults. What is your age?","Nueve soles para adultos. ¿Cuál es tu edad?"],["Sara","I am thirteen, and my brother is six.","Tengo trece y mi hermano tiene seis."],["Señora Paz","Then his ticket is half. Fares vary with age.","Entonces su boleto es la mitad. Las tarifas varían según la edad."],["Sara","Perfect. Do we have numbered seats?","Perfecto. ¿Tenemos asientos numerados?"],["Señora Paz","Yes. Seat nine and seat ten, on the left side.","Sí. Asiento nueve y asiento diez, del lado izquierdo."],["Sara","Is seat nine near the window?","¿El asiento nueve está junto a la ventana?"],["Señora Paz","Yes, and seat ten is beside it.","Sí, y el asiento diez está al lado."],["Sara","Where exactly does the bus stop?","¿Dónde para exactamente el bus?"],["Señora Paz","Here, at this kiosk. Do not wait across the street.","Aquí, en este kiosco. No esperen al otro lado de la calle."],["Sara","Is this the meeting point for everybody?","¿Este es el punto de encuentro para todos?"],["Señora Paz","Yes, all passengers meet here, next to the door.","Sí, todos los pasajeros se reúnen aquí, junto a la puerta."],["Sara","What happens if the bus is late?","¿Qué pasa si el bus se retrasa?"],["Señora Paz","Delays occur when it rains. We call the office.","Los retrasos ocurren cuando llueve. Llamamos a la oficina."],["Sara","Can you send a message to my phone?","¿Puede enviar un mensaje a mi teléfono?"],["Señora Paz","Of course. Write the number with all nine digits.","Claro. Escribe el número con los nueve dígitos."],["Sara","Here it is. And how long is the trip?","Aquí está. ¿Y cuánto dura el viaje?"],["Señora Paz","Fifty minutes, if the traffic is normal.","Cincuenta minutos, si el tráfico está normal."],["Sara","Thank you. Do I keep this ticket?","Gracias. ¿Guardo este boleto?"],["Señora Paz","Yes, keep it. It is your evidence of payment.","Sí, guárdalo. Es tu comprobante de pago."],["Sara","I will put it in my bag, not in my pocket.","Lo pondré en mi bolso, no en mi bolsillo."],["Señora Paz","Very good. Come ten minutes early. Goodbye!","Muy bien. Ven diez minutos antes. ¡Adiós!"]]}};

   <div class="fxtop"><span id="fxcnt"></span><span><button class="fxmini" onclick="fxGear()">⚙</button><button class="fxmini" onclick="closeFocus()">✕</button></span></div>
   <div class="fxprog"><i id="fxbar"></i></div>
   <div class="fxmid"><div id="fxen"></div><div id="fxes"></div></div>
   <div class="fxbot"><button class="fxc sec" onclick="fxPrev()">◀</button><button class="fxc" id="fxplay" onclick="fxToggle()">⏸</button><button class="fxc sec" onclick="fxNext()">▶</button></div>
 </div>
</div>
<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>

window.jecGoBack=function(){ location.href="https://jucum-english-center.netlify.app/"; };
</script>
