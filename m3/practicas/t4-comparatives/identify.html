    <script>
    const quizData = [{"badge":"🏍️ Moto vs bus","options":[{"text":"A moto passes faster than a bus.","correct":true,"es":"Una moto pasa más rápido que un bus."},{"text":"A moto passes more faster than a bus.","correct":false,"es":"Una moto pasa más rápido que un bus.","errorWord":"more faster","correctWord":"faster","errorType":"Doble comparativo","explanation":"“Faster” ya es comparativo: no se le agrega “more”."},{"text":"A moto passes faster that a bus.","correct":false,"es":"Una moto pasa más rápido que un bus.","errorWord":"that","correctWord":"than","errorType":"than / that","explanation":"La palabra de comparación es “than”."}],"clue":"una sola marca + than","clueExplain":"o “-er” o “more”, nunca los dos; y la comparación cierra con “than”.","correctReason":"“Faster than a bus”: comparativo simple y “than” correcto.","hint":"Busca una marca repetida o una palabra parecida a “than”."},{"badge":"💰 Las tarifas","options":[{"text":"Children pay less than adults.","correct":true,"es":"Los niños pagan menos que los adultos."},{"text":"Children pay less that adults.","correct":false,"es":"Los niños pagan menos que los adultos.","errorWord":"that","correctWord":"than","errorType":"than / that","explanation":"Para comparar se usa “than”."},{"text":"Children pay lesser than adults.","correct":false,"es":"Los niños pagan menos que los adultos.","errorWord":"lesser","correctWord":"less","errorType":"Forma equivocada","explanation":"Con verbos se usa “less than”, no “lesser than”."}],"clue":"less than","clueExplain":"“less than” compara cantidades con un verbo.","correctReason":"“Pay less than adults”: comparación de cantidad correcta.","hint":"Una opción cambia “than”; la otra inventa una forma."},{"badge":"🛣️ La avenida","options":[{"text":"The main avenue is slower than the small streets.","correct":true,"es":"La avenida principal es más lenta que las calles pequeñas."},{"text":"The main avenue is more slow than the small streets.","correct":false,"es":"La avenida principal es más lenta que las calles pequeñas.","errorWord":"more slow","correctWord":"slower","errorType":"more con adjetivo corto","explanation":"“Slow” es corto: slower."},{"text":"The main avenue is slowest than the small streets.","correct":false,"es":"La avenida principal es más lenta que las calles pequeñas.","errorWord":"slowest","correctWord":"slower","errorType":"Superlativo con than","explanation":"“Slowest” es superlativo; con “than” va el comparativo."}],"clue":"corto → -er","clueExplain":"los adjetivos de una sílaba forman el comparativo con -er.","correctReason":"“Slower than”: comparativo corto correcto.","hint":"Piensa si el adjetivo es corto o largo."},{"badge":"🏠 El cuarto cálido","options":[{"text":"This room is warmer than my old one.","correct":true,"es":"Este cuarto es más cálido que el mío viejo."},{"text":"This room is more warmer than my old one.","correct":false,"es":"Este cuarto es más cálido que el mío viejo.","errorWord":"more warmer","correctWord":"warmer","errorType":"Doble comparativo","explanation":"Una sola marca: warmer."},{"text":"This room is warm than my old one.","correct":false,"es":"Este cuarto es más cálido que el mío viejo.","errorWord":"warm","correctWord":"warmer","errorType":"Falta el comparativo","explanation":"Sin -er no hay comparación."}],"clue":"warm → warmer","clueExplain":"la comparación necesita exactamente una marca.","correctReason":"“Warmer than my old one”: marca única y clara.","hint":"Una opción tiene dos marcas; otra, ninguna."},{"badge":"🤫 El patio tranquilo","options":[{"text":"That is quieter than the main avenue.","correct":true,"es":"Eso es más tranquilo que la avenida principal."},{"text":"That is more quiet than the main avenue.","correct":false,"es":"Eso es más tranquilo que la avenida principal.","errorWord":"more quiet","correctWord":"quieter","errorType":"more innecesario","explanation":"“Quiet” admite -er: quieter."},{"text":"That is quieter that the main avenue.","correct":false,"es":"Eso es más tranquilo que la avenida principal.","errorWord":"that","correctWord":"than","errorType":"than / that","explanation":"La comparación cierra con “than”."}],"clue":"quiet → quieter","clueExplain":"quieter + than es la forma natural.","correctReason":"“Quieter than the main avenue”: forma correcta.","hint":"Revisa la marca del adjetivo y la palabra final."},{"badge":"📏 El cuarto grande","options":[{"text":"That room is bigger than this one.","correct":true,"es":"Ese cuarto es más grande que este."},{"text":"That room is biger than this one.","correct":false,"es":"Ese cuarto es más grande que este.","errorWord":"biger","correctWord":"bigger","errorType":"Ortografía","explanation":"“Big” dobla la g: bigger."},{"text":"That room is more big than this one.","correct":false,"es":"Ese cuarto es más grande que este.","errorWord":"more big","correctWord":"bigger","errorType":"more con adjetivo corto","explanation":"“Big” es corto: bigger."}],"clue":"big → bigger","clueExplain":"consonante-vocal-consonante: se dobla la última letra.","correctReason":"“Bigger than this one”: ortografía y marca correctas.","hint":"Cuenta las g."},{"badge":"👍 Mejor que","options":[{"text":"A quiet yard is better than a big window.","correct":true,"es":"Un patio tranquilo es mejor que una ventana grande."},{"text":"A quiet yard is gooder than a big window.","correct":false,"es":"Un patio tranquilo es mejor que una ventana grande.","errorWord":"gooder","correctWord":"better","errorType":"Irregular","explanation":"“Good” no toma -er: better."},{"text":"A quiet yard is more better than a big window.","correct":false,"es":"Un patio tranquilo es mejor que una ventana grande.","errorWord":"more better","correctWord":"better","errorType":"Doble comparativo","explanation":"“Better” ya es comparativo."}],"clue":"good → better","clueExplain":"irregular, y sin “more”.","correctReason":"“Better than a big window”: irregular bien usado.","hint":"Este adjetivo no sigue la regla del -er."},{"badge":"🎉 Más emocionante","options":[{"text":"This is more exciting than television.","correct":true,"es":"Esto es más emocionante que la televisión."},{"text":"This is excitinger than television.","correct":false,"es":"Esto es más emocionante que la televisión.","errorWord":"excitinger","correctWord":"more exciting","errorType":"-er con adjetivo largo","explanation":"Los adjetivos largos usan “more”."},{"text":"This is more exciting that television.","correct":false,"es":"Esto es más emocionante que la televisión.","errorWord":"that","correctWord":"than","errorType":"than / that","explanation":"La comparación cierra con “than”."}],"clue":"largo → more","clueExplain":"tres sílabas piden “more”, no “-er”.","correctReason":"“More exciting than television”: forma larga correcta.","hint":"Cuenta las sílabas del adjetivo."},{"badge":"🔇 Mucho más tranquilo","options":[{"text":"Much quieter than the avenue.","correct":true,"es":"Mucho más tranquilo que la avenida."},{"text":"Very quieter than the avenue.","correct":false,"es":"Mucho más tranquilo que la avenida.","errorWord":"Very","correctWord":"Much","errorType":"very con comparativo","explanation":"Los comparativos se refuerzan con “much”, no con “very”."},{"text":"Much more quieter than the avenue.","correct":false,"es":"Mucho más tranquilo que la avenida.","errorWord":"more quieter","correctWord":"quieter","errorType":"Doble comparativo","explanation":"“Quieter” ya lleva la marca."}],"clue":"much + comparativo","clueExplain":"“much” refuerza; “very” no se usa con comparativos.","correctReason":"“Much quieter”: refuerzo correcto.","hint":"Piensa qué palabra refuerza un comparativo."},{"badge":"🚶 Caminar vs bus","options":[{"text":"Is walking better than the bus?","correct":true,"es":"¿Caminar es mejor que el bus?"},{"text":"Is walking better then the bus?","correct":false,"es":"¿Caminar es mejor que el bus?","errorWord":"then","correctWord":"than","errorType":"then / than","explanation":"“Then” significa “luego”; comparar es “than”."},{"text":"Is walking more better than the bus?","correct":false,"es":"¿Caminar es mejor que el bus?","errorWord":"more better","correctWord":"better","errorType":"Doble comparativo","explanation":"“Better” no admite “more”."}],"clue":"than ≠ then","clueExplain":"than compara; then ordena en el tiempo.","correctReason":"“Better than the bus”: comparación correcta.","hint":"Dos palabras suenan casi igual: than y then."},{"badge":"🎫 Más barato","options":[{"text":"The bus is cheaper than the moto.","correct":true,"es":"El bus es más barato que la moto."},{"text":"The bus is more cheap than the moto.","correct":false,"es":"El bus es más barato que la moto.","errorWord":"more cheap","correctWord":"cheaper","errorType":"more con adjetivo corto","explanation":"“Cheap” es corto: cheaper."},{"text":"The bus is cheap than the moto.","correct":false,"es":"El bus es más barato que la moto.","errorWord":"cheap","correctWord":"cheaper","errorType":"Falta el comparativo","explanation":"Sin -er no hay comparación."}],"clue":"cheap → cheaper","clueExplain":"una sílaba: -er.","correctReason":"“Cheaper than the moto”: comparativo corto.","hint":"¿Está la marca -er donde debe?"},{"badge":"🌧️ Peor con lluvia","options":[{"text":"Traffic in the rain is worse than in the sun.","correct":true,"es":"El tráfico con lluvia es peor que con sol."},{"text":"Traffic in the rain is badder than in the sun.","correct":false,"es":"El tráfico con lluvia es peor que con sol.","errorWord":"badder","correctWord":"worse","errorType":"Irregular","explanation":"“Bad” hace worse."},{"text":"Traffic in the rain is more worse than in the sun.","correct":false,"es":"El tráfico con lluvia es peor que con sol.","errorWord":"more worse","correctWord":"worse","errorType":"Doble comparativo","explanation":"“Worse” ya es comparativo."}],"clue":"bad → worse","clueExplain":"otro irregular, y sin “more”.","correctReason":"“Worse than in the sun”: irregular correcto.","hint":"No existe “badder” en inglés estándar."},{"badge":"💵 Más caro","options":[{"text":"A moto is more expensive than a bus ticket.","correct":true,"es":"Una moto es más cara que un boleto de bus."},{"text":"A moto is expensiver than a bus ticket.","correct":false,"es":"Una moto es más cara que un boleto de bus.","errorWord":"expensiver","correctWord":"more expensive","errorType":"-er con adjetivo largo","explanation":"“Expensive” es largo: more expensive."},{"text":"A moto is most expensive than a bus ticket.","correct":false,"es":"Una moto es más cara que un boleto de bus.","errorWord":"most","correctWord":"more","errorType":"Superlativo con than","explanation":"Con “than” va “more”, no “most”."}],"clue":"more + largo","clueExplain":"comparativo largo = more + adjetivo.","correctReason":"“More expensive than”: forma larga correcta.","hint":"“Most” pertenece a otro tema (superlativos)."},{"badge":"📢 Más ruidosa","options":[{"text":"The main avenue is noisier than Narrow Street.","correct":true,"es":"La avenida principal es más ruidosa que la Calle Angosta."},{"text":"The main avenue is noisyer than Narrow Street.","correct":false,"es":"La avenida principal es más ruidosa que la Calle Angosta.","errorWord":"noisyer","correctWord":"noisier","errorType":"Ortografía y → i","explanation":"Con -y final: noisy → noisier."},{"text":"The main avenue is more noisier than Narrow Street.","correct":false,"es":"La avenida principal es más ruidosa que la Calle Angosta.","errorWord":"more noisier","correctWord":"noisier","errorType":"Doble comparativo","explanation":"“Noisier” ya lleva la marca."}],"clue":"y → i + er","clueExplain":"los adjetivos en -y cambian la y por i.","correctReason":"“Noisier than”: ortografía correcta.","hint":"Mira cómo termina la palabra."},{"badge":"📍 Más lejos","options":[{"text":"The port is farther than the clinic.","correct":true,"es":"El puerto está más lejos que la clínica."},{"text":"The port is farer than the clinic.","correct":false,"es":"El puerto está más lejos que la clínica.","errorWord":"farer","correctWord":"farther","errorType":"Irregular","explanation":"“Far” hace farther (o further)."},{"text":"The port is more far than the clinic.","correct":false,"es":"El puerto está más lejos que la clínica.","errorWord":"more far","correctWord":"farther","errorType":"more con irregular","explanation":"“Far” tiene su propia forma: farther."}],"clue":"far → farther","clueExplain":"tercer irregular de la lista.","correctReason":"“Farther than the clinic”: irregular correcto.","hint":"Este adjetivo no acepta ni -er simple ni more."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
