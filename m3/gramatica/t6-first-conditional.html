<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Primer Condicional (If + presente, will)',en:'First Conditional (If + present, will)'}, reportId:'sum-first-conditional' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Para hablar de algo <b>posible en el futuro</b> y su resultado, en español decimos «<b>Si</b> + presente, futuro»: «Si caminas rápido, <b>llegarás</b> a tiempo».</div>
<div class="art-hero three"><div class="art-box"><div class="word">si…</div><div class="role">la condición</div><div class="desc">«Si llueve mañana…»</div></div><div class="art-box"><div class="word">…futuro</div><div class="role">el resultado</div><div class="desc">«…tomaremos el bus.»</div></div><div class="art-box"><div class="word">posible</div><div class="role">puede pasar</div><div class="desc">No sabemos si lloverá.</div></div></div>
${ii('🔮','Es una situación <b>concreta</b> que <b>puede pasar</b>: todavía no sabemos si va a pasar.')}
<div class="gnote life">🌎 <b>De tu vida:</b> «Si estudio hoy, aprobaré el examen». En inglés: «If I study today, I <b>will</b> pass the exam».</div>`,
      en:`<div class="gdesc">To talk about something <b>possible in the future</b> and its result, Spanish says «<b>Si</b> + present, future»: «Si caminas rápido, <b>llegarás</b> a tiempo».</div>
<div class="art-hero three"><div class="art-box"><div class="word">si…</div><div class="role">the condition</div><div class="desc">«If it rains tomorrow…»</div></div><div class="art-box"><div class="word">…future</div><div class="role">the result</div><div class="desc">«…we will take the bus.»</div></div><div class="art-box"><div class="word">possible</div><div class="role">it may happen</div><div class="desc">We do not know if it will rain.</div></div></div>
${ii('🔮','It is a <b>specific</b> situation that <b>may happen</b>: we still do not know if it will.')}
<div class="gnote life">🌎 <b>From your life:</b> «Si estudio hoy, aprobaré el examen». In English: «If I study today, I <b>will</b> pass the exam».</div>`
    },
    checks:[
      { q:{es:'«Si llueve mañana…» es:',en:'«Si llueve mañana…» is:'}, opts:{es:["una condición posible","algo que ya pasó"],en:["a possible condition","something that happened"]}, correct:0, fb:{ why:{es:'Todavía no sabemos si lloverá.',en:'We still do not know if it will rain.'}, tip:{es:'si = condición',en:'if = condition'}} },
      { q:{es:'«…tomaremos el bus» es:',en:'«…tomaremos el bus» is:'}, opts:{es:["el resultado","la condición"],en:["the result","the condition"]}, correct:0, fb:{ why:{es:'Es lo que pasará si se cumple la condición.',en:'It is what will happen if the condition is true.'}, tip:{es:'resultado = futuro',en:'result = future'}} },
      { q:{es:'Después de «si» en español va:',en:'After «si» in Spanish comes:'}, opts:{es:["presente","futuro"],en:["present","future"]}, correct:0, fb:{ why:{es:'«Si llueve», no «si lloverá».',en:'«Si llueve», not «si lloverá».'}, tip:{es:'si + presente',en:'si + present'}} },
      { q:{es:'«Si caminas rápido, llegarás a tiempo» habla de:',en:'«Si caminas rápido, llegarás a tiempo» talks about:'}, opts:{es:["una situación concreta futura","una verdad de siempre"],en:["a specific future situation","an always-true fact"]}, correct:0, fb:{ why:{es:'Es para hoy, para Nina.',en:'It is for today, for Nina.'}, tip:{es:'concreto = 1.er condicional',en:'specific = 1st conditional'}} },
      { q:{es:'El resultado en español va en:',en:'The result in Spanish is in the:'}, opts:{es:["futuro","pasado"],en:["future","past"]}, correct:0, fb:{ why:{es:'«llegarás, tomaremos».',en:'«llegarás, tomaremos».'}, tip:{es:'resultado = futuro',en:'result = future'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El primer condicional tiene la misma estructura que en español: <b>If</b> + presente, <b>will</b> + verbo.</div>
<div class="viz-grid"><div class="viz-item"><span class="ico">❓</span><span class="lbl">If it rains,</span><span class="es">Si llueve,</span></div><div class="viz-item"><span class="ico">🚌</span><span class="lbl">we will take the bus</span><span class="es">tomaremos el bus</span></div><div class="viz-item"><span class="ico">🏃</span><span class="lbl">If Nina walks fast,</span><span class="es">Si Nina camina rápido,</span></div><div class="viz-item"><span class="ico">⏰</span><span class="lbl">she will arrive on time</span><span class="es">llegará a tiempo</span></div><div class="viz-item"><span class="ico">,</span><span class="lbl">coma después del If</span><span class="es">igual que en español</span></div><div class="viz-item"><span class="ico">🔄</span><span class="lbl">el orden puede cambiar</span><span class="es">igual que en español</span></div></div>
${eg('<span class="tag s">If</span> Nina walks fast, she <span class="tag s">will</span> arrive on time.','Si Nina camina rápido, llegará a tiempo.','ok')}
${eg('<span class="tag s">If</span> it rains tomorrow, we <span class="tag s">will</span> take the bus.','Si llueve mañana, tomaremos el bus.','ok')}
<div class="sec-label">Lo igual en los dos idiomas</div>
<ul class="simlist"><li>Después de <b>If / Si</b> va el <b>presente</b>, nunca el futuro.</li><li>El resultado va en futuro: <b>will</b> arrive / <b>llegará</b>.</li><li>Si empiezas con If, pones <b>coma</b> entre las dos partes.</li></ul>`,
      en:`<div class="gdesc">The first conditional has the same structure as Spanish: <b>If</b> + present, <b>will</b> + verb.</div>
<div class="viz-grid"><div class="viz-item"><span class="ico">❓</span><span class="lbl">If it rains,</span><span class="es">Si llueve,</span></div><div class="viz-item"><span class="ico">🚌</span><span class="lbl">we will take the bus</span><span class="es">tomaremos el bus</span></div><div class="viz-item"><span class="ico">🏃</span><span class="lbl">If Nina walks fast,</span><span class="es">Si Nina camina rápido,</span></div><div class="viz-item"><span class="ico">⏰</span><span class="lbl">she will arrive on time</span><span class="es">llegará a tiempo</span></div><div class="viz-item"><span class="ico">,</span><span class="lbl">comma after the If part</span><span class="es">same as Spanish</span></div><div class="viz-item"><span class="ico">🔄</span><span class="lbl">the order can change</span><span class="es">same as Spanish</span></div></div>
${eg('<span class="tag s">If</span> Nina walks fast, she <span class="tag s">will</span> arrive on time.','If Nina walks fast, she will arrive on time.','ok')}
${eg('<span class="tag s">If</span> it rains tomorrow, we <span class="tag s">will</span> take the bus.','If it rains tomorrow, we will take the bus.','ok')}
<div class="sec-label">What is the same in both languages</div>
<ul class="simlist"><li>After <b>If</b> comes the <b>present</b>, never the future.</li><li>The result is in the future: <b>will</b> arrive.</li><li>If you start with If, put a <b>comma</b> between the two parts.</li></ul>`
    },
    checks:[
      { q:{es:'«Si llueve» =',en:'«Si llueve» ='}, opts:{es:["If it rains","If it will rain"],en:["If it rains","If it will rain"]}, correct:0, fb:{ why:{es:'Después de If: presente.',en:'After If: present.'}, tip:{es:'If + presente',en:'If + present'}} },
      { q:{es:'«…llegará a tiempo» =',en:'«…llegará a tiempo» ='}, opts:{es:["…she will arrive on time","…she arrives will on time"],en:["…she will arrive on time","…she arrives will on time"]}, correct:0, fb:{ why:{es:'Will + verbo base.',en:'Will + base verb.'}, tip:{es:'will + base',en:'will + base'}} },
      { q:{es:'Si empiezas con If, entre las partes va:',en:'If you start with If, between the parts there is:'}, opts:{es:["una coma","un punto"],en:["a comma","a full stop"]}, correct:0, fb:{ why:{es:'If…, resultado.',en:'If…, result.'}, tip:{es:'If…,',en:'If…,'}} },
      { q:{es:'¿Se puede cambiar el orden?',en:'Can the order change?'}, opts:{es:["Sí","No"],en:["Yes","No"]}, correct:0, fb:{ why:{es:'«We will take the bus if it rains.»',en:'«We will take the bus if it rains.»'}, tip:{es:'orden flexible',en:'flexible order'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["If Nina walks fast, she will arrive.","If Nina will walk fast, she arrives."],en:["If Nina walks fast, she will arrive.","If Nina will walk fast, she arrives."]}, correct:0, fb:{ why:{es:'Presente en el If, will en el resultado.',en:'Present in the If part, will in the result.'}, tip:{es:'If + presente, will',en:'If + present, will'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">Diferencias pequeñas pero importantes:</div>
<table class="dtab"><tr><th>Punto</th><th>Inglés ✅</th><th>Error típico ❌</th></tr>
<tr><td>sujeto obligatorio</td><td class="en">If it rains, …</td><td>If rains, …</td></tr>
<tr><td>-s con he / she / it</td><td class="en">If Tomás takes bus 305, …</td><td>If Tomás take bus 305, …</td></tr>
<tr><td>nunca will después de If</td><td class="en">If the bus is late, …</td><td>If the bus will be late, …</td></tr>
<tr><td>will en el resultado</td><td class="en">…the dog will go out.</td><td>…the dog goes out will.</td></tr></table>
${ii('🧩','En español a veces el resultado va en presente («Si llueve, tomamos el bus»); en el primer condicional inglés lo normal es <b>will</b>.')}
${ii('🚫','Negativas: condición con <b>don’t / doesn’t</b>, resultado con <b>won’t</b>: «If you don’t close the gate, the dog will go out» · «If we take the moto, we won’t be late».')}`,
      en:`<div class="gdesc">Small but important differences:</div>
<table class="dtab"><tr><th>Point</th><th>English ✅</th><th>Common mistake ❌</th></tr>
<tr><td>subject required</td><td class="en">If it rains, …</td><td>If rains, …</td></tr>
<tr><td>-s with he / she / it</td><td class="en">If Tomás takes bus 305, …</td><td>If Tomás take bus 305, …</td></tr>
<tr><td>never will after If</td><td class="en">If the bus is late, …</td><td>If the bus will be late, …</td></tr>
<tr><td>will in the result</td><td class="en">…the dog will go out.</td><td>…the dog goes out will.</td></tr></table>
${ii('🧩','In Spanish the result is sometimes in the present («Si llueve, tomamos el bus»); in the English first conditional it is normally <b>will</b>.')}
${ii('🚫','Negatives: condition with <b>don’t / doesn’t</b>, result with <b>won’t</b>: «If you don’t close the gate, the dog will go out» · «If we take the moto, we won’t be late».')}`
    },
    checks:[
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["If it rains, we will take the bus.","If rains, we will take the bus."],en:["If it rains, we will take the bus.","If rains, we will take the bus."]}, correct:0, fb:{ why:{es:'En inglés el sujeto «it» es obligatorio.',en:'In English the subject «it» is required.'}, tip:{es:'it + rains',en:'it + rains'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["If Tomás takes bus 305, …","If Tomás take bus 305, …"],en:["If Tomás takes bus 305, …","If Tomás take bus 305, …"]}, correct:0, fb:{ why:{es:'Tomás = he → takes.',en:'Tomás = he → takes.'}, tip:{es:'he + -s',en:'he + -s'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["If the bus is late, …","If the bus will be late, …"],en:["If the bus is late, …","If the bus will be late, …"]}, correct:0, fb:{ why:{es:'Nunca will después de If.',en:'Never will after If.'}, tip:{es:'If + presente',en:'If + present'}} },
      { q:{es:'Resultado negativo:',en:'Negative result:'}, opts:{es:["…we won’t be late.","…we don’t will be late."],en:["…we won’t be late.","…we don’t will be late."]}, correct:0, fb:{ why:{es:'will + not = won’t.',en:'will + not = won’t.'}, tip:{es:'won’t',en:'won’t'}} },
      { q:{es:'Condición negativa:',en:'Negative condition:'}, opts:{es:["If you don’t close the gate, …","If you won’t close the gate, …"],en:["If you don’t close the gate, …","If you won’t close the gate, …"]}, correct:0, fb:{ why:{es:'La condición va en presente: don’t.',en:'The condition is in the present: don’t.'}, tip:{es:'If + don’t',en:'If + don’t'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Dos órdenes posibles, una sola regla:</div>
<div class="fbox"><div class="frm"><span class="pill s">If + presente</span><span class="plus">,</span><span class="pill v">will + verbo base</span></div><div class="fex"><span class="en">If you play loud music, Doña Elsa will be angry.</span><span class="es">Si pones música fuerte, Doña Elsa se enojará.</span></div></div>
<div class="fbox"><div class="frm"><span class="pill v">will + verbo base</span><span class="plus">+</span><span class="pill s">if + presente</span></div><div class="fex"><span class="en">Doña Elsa will be angry if you play loud music.</span><span class="es">Doña Elsa se enojará si pones música fuerte.</span></div></div>
${ii('🧠','<b>Tip 1:</b> la <b>coma</b> solo va cuando empiezas con If.')}
${ii('✂️','<b>Tip 2:</b> contracciones en el resultado: she’ll · we’ll · won’t.')}
<div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «If it will rain tomorrow, …» → ✅ «If it <b>rains</b> tomorrow, …»</p></div>`,
      en:`<div class="gdesc">Two possible orders, one rule:</div>
<div class="fbox"><div class="frm"><span class="pill s">If + present</span><span class="plus">,</span><span class="pill v">will + base verb</span></div><div class="fex"><span class="en">If you play loud music, Doña Elsa will be angry.</span><span class="es">If you play loud music, Doña Elsa will be angry.</span></div></div>
<div class="fbox"><div class="frm"><span class="pill v">will + base verb</span><span class="plus">+</span><span class="pill s">if + present</span></div><div class="fex"><span class="en">Doña Elsa will be angry if you play loud music.</span><span class="es">Doña Elsa will be angry if you play loud music.</span></div></div>
${ii('🧠','<b>Tip 1:</b> the <b>comma</b> only goes when you start with If.')}
${ii('✂️','<b>Tip 2:</b> contractions in the result: she’ll · we’ll · won’t.')}
<div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «If it will rain tomorrow, …» → ✅ «If it <b>rains</b> tomorrow, …»</p></div>`
    },
    checks:[
      { q:{es:'¿Dónde va la coma?',en:'Where does the comma go?'}, opts:{es:["Después de la parte con If, si empiezas con If","Siempre antes de if"],en:["After the If part, when you start with If","Always before if"]}, correct:0, fb:{ why:{es:'«If it rains, we…».',en:'«If it rains, we…».'}, tip:{es:'If…,',en:'If…,'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["Doña Elsa will be angry if you play loud music.","Doña Elsa will be angry if you will play loud music."],en:["Doña Elsa will be angry if you play loud music.","Doña Elsa will be angry if you will play loud music."]}, correct:0, fb:{ why:{es:'Después de if: presente.',en:'After if: present.'}, tip:{es:'if + presente',en:'if + present'}} },
      { q:{es:'«we will» contraído:',en:'«we will» contracted:'}, opts:{es:["we’ll","we’ill"],en:["we’ll","we’ill"]}, correct:0, fb:{ why:{es:'will → ’ll.',en:'will → ’ll.'}, tip:{es:'we’ll',en:'we’ll'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["If it rains tomorrow, we will stay home.","If it will rain tomorrow, we stay home."],en:["If it rains tomorrow, we will stay home.","If it will rain tomorrow, we stay home."]}, correct:0, fb:{ why:{es:'If + presente, will + base.',en:'If + present, will + base.'}, tip:{es:'If + presente, will',en:'If + present, will'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["If we walk, it will take thirty minutes.","If we walk, it will takes thirty minutes."],en:["If we walk, it will take thirty minutes.","If we walk, it will takes thirty minutes."]}, correct:0, fb:{ why:{es:'Will + verbo base.',en:'Will + base verb.'}, tip:{es:'will + base',en:'will + base'}} }
    ] },
  { icon:'✨', title:{es:'Práctica Final',en:'Final Practice'}, builder:true,
    html:{
      es:`<div class="gdesc">Junta todo: If + presente, will + verbo base. Arma la oración.</div>
<div class="cboxes"><div class="cbox s"><span class="cl">Parte con If (presente)</span><span class="cv">If it rains · If Nina walks fast · If you don’t close the gate</span></div><div class="cbox o"><span class="cl">Resultado (will)</span><span class="cv">we will take the bus · she will arrive on time · the dog will go out</span></div></div>
<div class="sec-label">Las reglas en tres oraciones</div>
${eg('If Nina <span class="tag s">walks</span> fast, she <span class="tag s">will arrive</span> on time.','Si Nina camina rápido, llegará a tiempo.','ok')}
