        · El botón ES/EN cambia TODO el material (explicación + indicaciones + auto-chequeos).

        · 'tr' (botón 🌐 traducción por pregunta): ponlo SOLO en auto-chequeos donde una oración en inglés

<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Preguntas con How (far · long · much · many · often)',en:'Questions with How (far · long · much · many · often)'}, reportId:'sum-questions-how' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Para pedir un dato el español usa preguntas distintas: <b>¿qué tan lejos?</b>, <b>¿cuánto?</b>, <b>¿cuántos?</b>, <b>¿cada cuánto?</b>, <b>¿cómo?</b>.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">¿Qué tan lejos?</div><div class="role">distancia</div><div class="desc">«¿Qué tan lejos está la clínica?»</div></div><div class="art-box"><div class="word">¿Cuánto es?</div><div class="role">precio</div><div class="desc">«¿Cuánto es el pasaje?»</div></div><div class="art-box"><div class="word">¿Cuántos?</div><div class="role">cantidad</div><div class="desc">«¿Cuántos miembros viven aquí?»</div></div></div>
        ${ii('🔍','Antes de preguntar, decide QUÉ dato necesitas: distancia, tiempo, precio, cantidad o frecuencia.')}
        <div class="gnote life">🌎 <b>De tu vida:</b> en el paradero preguntas «¿cuánto es?» y «¿cada cuánto pasa?». Son dos datos distintos, y en inglés dos preguntas distintas.</div>`,
      en:`<div class="gdesc">To ask for a piece of information Spanish uses different questions: <b>¿qué tan lejos?</b>, <b>¿cuánto?</b>, <b>¿cuántos?</b>, <b>¿cada cuánto?</b>, <b>¿cómo?</b>.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">¿Qué tan lejos?</div><div class="role">distance</div><div class="desc">«¿Qué tan lejos está la clínica?»</div></div><div class="art-box"><div class="word">¿Cuánto es?</div><div class="role">price</div><div class="desc">«¿Cuánto es el pasaje?»</div></div><div class="art-box"><div class="word">¿Cuántos?</div><div class="role">quantity</div><div class="desc">«¿Cuántos miembros viven aquí?»</div></div></div>
        ${ii('🔍','Before you ask, decide WHICH piece of information you need: distance, time, price, quantity or frequency.')}
        <div class="gnote life">🌎 <b>From your life:</b> at the bus stop you ask «¿cuánto es?» and «¿cada cuánto pasa?». Two different facts, two different questions in English.</div>`
    },
    checks:[
      { q:{es:'«¿Qué tan lejos está la clínica?» pregunta por:',en:'«¿Qué tan lejos está la clínica?» asks about:'}, opts:{es:['Distancia','Precio'],en:['Distance','Price']}, correct:0, fb:{ why:{es:'La respuesta serían «dos cuadras».',en:'The answer would be «two blocks».'}, tip:{es:'lejos = far',en:'lejos = far'}} },
      { q:{es:'«¿Cuánto dura el viaje?» pregunta por:',en:'«¿Cuánto dura el viaje?» asks about:'}, opts:{es:['Tiempo','Cantidad de buses'],en:['Time','Number of buses']}, correct:0, fb:{ why:{es:'La respuesta es «cincuenta minutos».',en:'The answer is «fifty minutes».'}, tip:{es:'duración → How long',en:'duration → How long'}} },
      { q:{es:'«¿Cuántos miembros viven aquí?» se responde con:',en:'«¿Cuántos miembros viven aquí?» is answered with:'}, opts:{es:['Un número: seis','Un precio: seis soles'],en:['A number: six','A price: six soles']}, correct:0, fb:{ why:{es:'Las personas se cuentan una por una.',en:'People are counted one by one.'}, tip:{es:'contable → many',en:'countable → many'}} },
      { q:{es:'«¿Cada cuánto pasa el bus?» pregunta por:',en:'«¿Cada cuánto pasa el bus?» asks about:'}, opts:{es:['Frecuencia','Distancia'],en:['Frequency','Distance']}, correct:0, fb:{ why:{es:'Se responde «cada diez minutos».',en:'You answer «every ten minutes».'}, tip:{es:'frecuencia → How often',en:'frequency → How often'}} },
      { q:{es:'«¿Cómo vamos al estadio?» pregunta por:',en:'«¿Cómo vamos al estadio?» asks about:'}, opts:{es:['El medio (bus, moto, a pie)','El precio'],en:['The means (bus, moto, on foot)','The price']}, correct:0, fb:{ why:{es:'«Cómo» pide la manera o el medio.',en:'«Cómo» asks for the manner or means.'}, tip:{es:'cómo = how',en:'cómo = how'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés arma toda la familia con una sola palabra base: <b>How</b> + la palabra del dato.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">📍</span><span class="lbl">How far</span><span class="es">¿qué tan lejos?</span></div><div class="viz-item"><span class="ico">⏱️</span><span class="lbl">How long</span><span class="es">¿cuánto tiempo?</span></div><div class="viz-item"><span class="ico">💵</span><span class="lbl">How much</span><span class="es">¿cuánto (dinero)?</span></div><div class="viz-item"><span class="ico">🔢</span><span class="lbl">How many</span><span class="es">¿cuántos?</span></div><div class="viz-item"><span class="ico">🔁</span><span class="lbl">How often</span><span class="es">¿cada cuánto?</span></div><div class="viz-item"><span class="ico">📏</span><span class="lbl">How big / How old</span><span class="es">¿qué tan grande / cuántos años?</span></div></div>
        ${eg('<span class="tag s">How far</span> is the clinic from here?','¿Qué tan lejos está la clínica de aquí?','ok')}
        ${eg('<span class="tag s">How much</span> is the fare?','¿Cuánto es el pasaje?','ok')}
        ${eg('<span class="tag s">How many</span> members live here?','¿Cuántos miembros viven aquí?','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>La pregunta empieza por la palabra del dato, igual que en español.</li><li>Se responde con el dato solo: «Two blocks», «Fifty minutes», «Six people».</li><li>Se puede agregar el punto de partida: <b>from here</b> = «de aquí».</li></ul>
        <div class="gnote">👍 How · How far · How long · How much · How many · How often · How big · How old.</div>`,
      en:`<div class="gdesc">English builds the whole family from one base word: <b>How</b> + the word for the fact.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">📍</span><span class="lbl">How far</span><span class="es">¿qué tan lejos?</span></div><div class="viz-item"><span class="ico">⏱️</span><span class="lbl">How long</span><span class="es">¿cuánto tiempo?</span></div><div class="viz-item"><span class="ico">💵</span><span class="lbl">How much</span><span class="es">¿cuánto (dinero)?</span></div><div class="viz-item"><span class="ico">🔢</span><span class="lbl">How many</span><span class="es">¿cuántos?</span></div><div class="viz-item"><span class="ico">🔁</span><span class="lbl">How often</span><span class="es">¿cada cuánto?</span></div><div class="viz-item"><span class="ico">📏</span><span class="lbl">How big / How old</span><span class="es">¿qué tan grande / cuántos años?</span></div></div>
        ${eg('<span class="tag s">How far</span> is the clinic from here?','How far is the clinic from here?','ok')}
        ${eg('<span class="tag s">How much</span> is the fare?','How much is the fare?','ok')}
        ${eg('<span class="tag s">How many</span> members live here?','How many members live here?','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>The question starts with the word for the fact, just like in Spanish.</li><li>You answer with the fact alone: «Two blocks», «Fifty minutes», «Six people».</li><li>You can add the starting point: <b>from here</b>.</li></ul>
        <div class="gnote">👍 How · How far · How long · How much · How many · How often · How big · How old.</div>`
    },
    checks:[
      { q:{es:'«¿Qué tan lejos?» = ',en:'«¿Qué tan lejos?» = '}, opts:{es:['How far','How long'],en:['How far','How long']}, correct:0, fb:{ why:{es:'far = lejos (distancia).',en:'far = distance.'}, ex:{es:'How far is the clinic from here?',en:'How far is the clinic from here?'}} },
      { q:{es:'«¿Cuánto es el pasaje?» = ',en:'«¿Cuánto es el pasaje?» = '}, opts:{es:['How much is the fare?','How many is the fare?'],en:['How much is the fare?','How many is the fare?']}, correct:0, fb:{ why:{es:'El dinero es incontable: much.',en:'Money is uncountable: much.'}, ex:{es:'How much is the fare?',en:'How much is the fare?'}} },
      { q:{es:'«¿Cuántos miembros?» = ',en:'«¿Cuántos miembros?» = '}, opts:{es:['How many members','How much members'],en:['How many members','How much members']}, correct:0, fb:{ why:{es:'Los miembros se cuentan: many.',en:'Members are countable: many.'}, ex:{es:'How many members live here?',en:'How many members live here?'}} },
      { q:{es:'«¿Cuánto dura el viaje?» = ',en:'«¿Cuánto dura el viaje?» = '}, opts:{es:['How long is the trip?','How far is the trip?'],en:['How long is the trip?','How far is the trip?']}, correct:0, fb:{ why:{es:'Duración → How long.',en:'Duration → How long.'}, ex:{es:'And how long is the trip?',en:'And how long is the trip?'}} },
      { q:{es:'«¿Cada cuánto?» = ',en:'«¿Cada cuánto?» = '}, opts:{es:['How often','How much time'],en:['How often','How much time']}, correct:0, fb:{ why:{es:'La frecuencia tiene su propia palabra.',en:'Frequency has its own word.'}, tip:{es:'often = a menudo',en:'often = frequently'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">La gran diferencia: en inglés el <b>verbo se adelanta</b> al sujeto, y si el verbo no es «be» aparece <b>do / does</b>.</div>
        <table class="dtab"><tr><th>Español</th><th>Inglés</th><th>Por qué</th></tr>
          <tr><td>¿Cuánto es el alquiler?</td><td class="en">How much <b>is</b> the rent?</td><td>solo «be»: se adelanta</td></tr>
          <tr><td>¿Cuánto cuesta una moto?</td><td class="en">How much <b>does</b> a moto <b>cost</b>?</td><td>verbo normal → does + base</td></tr>
          <tr><td>¿Cada cuánto tomas el bus?</td><td class="en">How often <b>do</b> you <b>take</b> the bus?</td><td>you → do</td></tr>
          <tr><td>¿Cada cuánto para el bus?</td><td class="en">How often <b>does</b> the bus <b>stop</b>?</td><td>the bus = it → does</td></tr>
          <tr><td>¿Cuántos años tienes?</td><td class="en">How old <b>are</b> you?</td><td>la edad va con «be», no con «have»</td></tr>
        </table>
        <div class="sec-label">💵 much o many: la decisión de siempre</div>
        ${ii('💰','<b>How much</b> + lo que NO se cuenta: money, time, water, rent, fare.')}
        ${ii('🔢','<b>How many</b> + plural contable: buses, members, tickets, minutes, blocks.')}
        ${eg('How much <span class="tag s">money</span> do you have?','¿Cuánto dinero tienes?','ok')}
        ${eg('How many <span class="tag s">buses</span> pass in one hour?','¿Cuántos buses pasan en una hora?','ok')}
        ${eg('How far the clinic is?','El verbo va ANTES del sujeto: <b>How far is the clinic?</b>','bad')}
        ${eg('How much does a moto costs?','Después de <b>does</b> el verbo va sin -s: <b>cost</b>.','bad')}
        <div class="gnote">📍 be → is/are · verbo normal → do/does + verbo base · nunca los dos juntos.</div>`,
      en:`<div class="gdesc">The big difference: in English the <b>verb comes before</b> the subject, and if the verb is not «be» you add <b>do / does</b>.</div>
        <table class="dtab"><tr><th>Spanish</th><th>English</th><th>Why</th></tr>
          <tr><td>¿Cuánto es el alquiler?</td><td class="en">How much <b>is</b> the rent?</td><td>only «be»: it moves up</td></tr>
          <tr><td>¿Cuánto cuesta una moto?</td><td class="en">How much <b>does</b> a moto <b>cost</b>?</td><td>normal verb → does + base</td></tr>
          <tr><td>¿Cada cuánto tomas el bus?</td><td class="en">How often <b>do</b> you <b>take</b> the bus?</td><td>you → do</td></tr>
          <tr><td>¿Cada cuánto para el bus?</td><td class="en">How often <b>does</b> the bus <b>stop</b>?</td><td>the bus = it → does</td></tr>
          <tr><td>¿Cuántos años tienes?</td><td class="en">How old <b>are</b> you?</td><td>age takes «be», not «have»</td></tr>
        </table>
        <div class="sec-label">💵 much or many: the everyday decision</div>
        ${ii('💰','<b>How much</b> + things you do NOT count: money, time, water, rent, fare.')}
        ${ii('🔢','<b>How many</b> + countable plurals: buses, members, tickets, minutes, blocks.')}
        ${eg('How much <span class="tag s">money</span> do you have?','How much money do you have?','ok')}
        ${eg('How many <span class="tag s">buses</span> pass in one hour?','How many buses pass in one hour?','ok')}
        ${eg('How far the clinic is?','The verb goes BEFORE the subject: <b>How far is the clinic?</b>','bad')}
        ${eg('How much does a moto costs?','After <b>does</b> the verb takes no -s: <b>cost</b>.','bad')}
        <div class="gnote">📍 be → is/are · normal verb → do/does + base verb · never both together.</div>`
    },
    checks:[
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:['How far is the clinic?','How far the clinic is?'],en:['How far is the clinic?','How far the clinic is?']}, correct:0, fb:{ why:{es:'En la pregunta, «is» va antes del sujeto.',en:'In a question «is» goes before the subject.'}, ex:{es:'How far is the clinic from here?',en:'How far is the clinic from here?'}} },
      { q:{es:'«¿Cuánto cuesta una moto?» = ',en:'«How much does a moto cost?» = '}, opts:{es:['How much does a moto cost?','How much does a moto costs?'],en:['How much does a moto cost?','How much does a moto costs?']}, correct:0, fb:{ why:{es:'La -s ya la lleva «does».',en:'«Does» already carries the -s.'}, tip:{es:'does + verbo base',en:'does + base verb'}} },
      { q:{es:'«How often ___ the buses pass?»',en:'«How often ___ the buses pass?»'}, opts:{es:['do','does'],en:['do','does']}, correct:0, fb:{ why:{es:'«The buses» es plural → do.',en:'«The buses» is plural → do.'}, tip:{es:'they → do',en:'they → do'}} },
      { q:{es:'«¿Cuánto dinero?» = ',en:'«¿Cuánto dinero?» = '}, opts:{es:['How much money','How many money'],en:['How much money','How many money']}, correct:0, fb:{ why:{es:'«Money» no tiene plural.',en:'«Money» has no plural.'}, tip:{es:'incontable → much',en:'uncountable → much'}} },
      { q:{es:'«¿Cuántos años tienes?» = ',en:'«¿Cuántos años tienes?» = '}, opts:{es:['How old are you?','How old do you have?'],en:['How old are you?','How old do you have?']}, correct:0, fb:{ why:{es:'La edad va con «be»: I am thirteen.',en:'Age takes «be»: I am thirteen.'}, ex:{es:'I am thirteen, and my brother is six.',en:'I am thirteen, and my brother is six.'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Dos fórmulas y ya puedes preguntar todo lo del módulo:</div>
        <div class="fbox"><div class="frm"><span class="pill s">How (+ palabra)</span><span class="plus">+</span><span class="pill v">is / are</span><span class="plus">+</span><span class="pill o">sujeto + ?</span></div><div class="fex"><span class="en">How much is the fare?</span><span class="es">¿Cuánto es el pasaje?</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">How (+ palabra)</span><span class="plus">+</span><span class="pill v">do / does</span><span class="plus">+</span><span class="pill o">sujeto + verbo base + ?</span></div><div class="fex"><span class="en">How often does the bus stop here?</span><span class="es">¿Cada cuánto para el bus aquí?</span></div></div>
        ${ii('🧠','<b>Tip 1 — busca el verbo:</b> si no hay más verbo que «ser/estar», usa <b>is/are</b>. Si hay otro verbo (cost, take, pass, stop), usa <b>do/does</b>.')}
        ${ii('💥','<b>Tip 2 — una sola -s:</b> «does» ya la tiene, así que el verbo va limpio: <i>does the bus <b>stop</b></i>.')}
        ${ii('📢','<b>Tip 3 — How many va pegado al plural:</b> How many <b>buses</b>… How many <b>members</b>…')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «How much time does the trip?» → ✅ «How long <b>does</b> the trip <b>take</b>?»</p></div>
        ${ii('⚡','Respuestas cortas del módulo: «Two blocks away.» · «Fifty minutes.» · «Nine soles for adults.» · «Six people.»')}`,
      en:`<div class="gdesc">Two formulas and you can ask everything in this module:</div>
        <div class="fbox"><div class="frm"><span class="pill s">How (+ word)</span><span class="plus">+</span><span class="pill v">is / are</span><span class="plus">+</span><span class="pill o">subject + ?</span></div><div class="fex"><span class="en">How much is the fare?</span><span class="es">How much is the fare?</span></div></div>

function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
  let tot=0,corr=0; answers.forEach((arr,si)=>arr.forEach((k,ci)=>{ if(k!==null){tot++; if(k===STEPS[si].checks[ci].correct)corr++;} })); const pct=tot?Math.round(corr/tot*100):0; const pass=pct>=PASS;
  const db=document.getElementById('doneBar'); db.classList.toggle('fail',!pass); db.textContent= pass? t.done : t.failBar; document.getElementById('fscore').textContent=pct; document.getElementById('fphrase').textContent= pass? t.phrase : t.phraseFail;
  document.getElementById('kpList').innerHTML=SUMMARY[info].map(s=>`<li>${s}</li>`).join('');
  document.getElementById('surprise').style.display= pass? 'block':'none';
  if(pass){ document.getElementById('medalEm').textContent=BADGE.emoji; document.getElementById('surT').textContent=t.surT; document.getElementById('surBadge').textContent=t.surBadge(BADGE.name[info]); document.getElementById('surP').textContent=t.surP; document.getElementById('xpWin').textContent=t.xp(BADGE.xp); }
  try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:pct, pass:pass, type:'summary', badge:BADGE.name.en, xp:BADGE.xp, mat:MAT.reportId, final:true}})); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'}); }
function restart(){ render(); }
function openHelp(){document.getElementById('helpov').classList.add('show');} function closeHelp(){document.getElementById('helpov').classList.remove('show');}
function setInfo(l){ info=l; applyLang(); }
function setLevel(lv){ document.getElementById('screen').setAttribute('data-level',lv); info= lv==='a2'?'en':'es'; render(); }
function volver(){ if(document.referrer){ location.href=document.referrer; } else if(history.length>1){ history.back(); } else { toast(info==='es'?'Vuelve a tu práctica en la plataforma':'Go back to your practice'); } }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.mat')){ e.preventDefault(); toast(info==='es'?'Material protegido © JUCUM EC':'Protected material © JUCUM EC'); }});
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
/* FIN DEL MOTOR */
setLevel(document.getElementById('screen').getAttribute('data-level')||'pre-a1');
</script>
