<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Present Perfect con since / for',en:'Present Perfect (since / for)'}, reportId:'sum-since-for' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Para algo que <b>empezó en el pasado y sigue hoy</b>, en español usamos el presente: «Vivo aquí <b>desde</b> 2015», «Vende agua <b>hace</b> muchos años».</div>
<div class="art-hero three"><div class="art-box"><div class="word">desde</div><div class="role">punto de inicio</div><div class="desc">«desde el lunes», «desde 2015»</div></div><div class="art-box"><div class="word">hace / durante</div><div class="role">cuánto tiempo</div><div class="desc">«hace diez minutos», «durante dos años»</div></div><div class="art-box"><div class="word">¿cuánto tiempo?</div><div class="role">preguntar</div><div class="desc">«¿Cuánto tiempo llevas aquí?»</div></div></div>
${ii('⏳','La acción <b>empezó antes</b> y <b>todavía continúa</b>: Don Beto vendía agua antes y hoy sigue vendiendo.')}
<div class="gnote life">🌎 <b>De tu vida:</b> «Estudio inglés desde marzo». En inglés NO se dice con presente: «I <b>have studied</b> English <b>since</b> March».</div>`,
      en:`<div class="gdesc">For something that <b>started in the past and continues today</b>, Spanish uses the present: «Vivo aquí <b>desde</b> 2015», «Vende agua <b>hace</b> muchos años».</div>
<div class="art-hero three"><div class="art-box"><div class="word">desde</div><div class="role">starting point</div><div class="desc">«since Monday», «since 2015»</div></div><div class="art-box"><div class="word">hace / durante</div><div class="role">how much time</div><div class="desc">«for ten minutes», «for two years»</div></div><div class="art-box"><div class="word">¿cuánto tiempo?</div><div class="role">asking</div><div class="desc">«How long have you been here?»</div></div></div>
${ii('⏳','The action <b>started before</b> and <b>still continues</b>: Don Beto sold water before and he still sells it today.')}
<div class="gnote life">🌎 <b>From your life:</b> «Estudio inglés desde marzo». In English we do NOT use the present: «I <b>have studied</b> English <b>since</b> March».</div>`
    },
    checks:[
      { q:{es:'«Vivo aquí desde 2015» — ¿sigue viviendo aquí?',en:'«Vivo aquí desde 2015» — does the person still live here?'}, opts:{es:["Sí","No"],en:["Yes","No"]}, correct:0, fb:{ why:{es:'Empezó en 2015 y continúa hoy.',en:'It started in 2015 and continues today.'}, tip:{es:'desde = sigue',en:'desde = continues'}} },
      { q:{es:'«Desde» marca:',en:'«Desde» marks:'}, opts:{es:["el punto de inicio","la cantidad de tiempo"],en:["the starting point","the amount of time"]}, correct:0, fb:{ why:{es:'«desde el lunes»: un momento concreto.',en:'«since Monday»: a specific moment.'}, tip:{es:'desde = punto',en:'desde = point'}} },
      { q:{es:'«Hace diez minutos que espero» marca:',en:'«Hace diez minutos que espero» marks:'}, opts:{es:["cuánto tiempo","un punto de inicio"],en:["how much time","a starting point"]}, correct:0, fb:{ why:{es:'Diez minutos es una duración.',en:'Ten minutes is a length of time.'}, tip:{es:'hace = duración',en:'hace = length'}} },
      { q:{es:'En español, «vivo aquí desde…» usa el verbo en:',en:'In Spanish, «vivo aquí desde…» uses the verb in the:'}, opts:{es:["presente","futuro"],en:["present","future"]}, correct:0, fb:{ why:{es:'«Vivo» está en presente.',en:'«Vivo» is in the present.'}, tip:{es:'español = presente',en:'Spanish = present'}} },
      { q:{es:'«¿Cuánto tiempo llevas aquí?» pregunta por:',en:'«¿Cuánto tiempo llevas aquí?» asks about:'}, opts:{es:["una duración","un lugar"],en:["a length of time","a place"]}, correct:0, fb:{ why:{es:'Pregunta cuánto tiempo.',en:'It asks how long.'}, tip:{es:'¿cuánto tiempo? = duración',en:'how long = length'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">Las ideas son las mismas: una palabra para el <b>punto de inicio</b> y otra para la <b>duración</b>.</div>
<div class="viz-grid"><div class="viz-item"><span class="ico">📍</span><span class="lbl">since Monday</span><span class="es">desde el lunes</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">since 2015</span><span class="es">desde 2015</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">since nine o’clock</span><span class="es">desde las nueve</span></div><div class="viz-item"><span class="ico">⏱️</span><span class="lbl">for ten minutes</span><span class="es">(hace / durante) diez minutos</span></div><div class="viz-item"><span class="ico">⏱️</span><span class="lbl">for eleven years</span><span class="es">(hace) once años</span></div><div class="viz-item"><span class="ico">❓</span><span class="lbl">How long…?</span><span class="es">¿Cuánto tiempo…?</span></div></div>
${eg('Don Beto has sold water <span class="tag s">for</span> many years.','Don Beto vende agua desde hace muchos años.','ok')}
${eg('Nina has lived in the city <span class="tag s">since</span> Monday.','Nina vive en la ciudad desde el lunes.','ok')}
<div class="sec-label">Lo igual en los dos idiomas</div>
<ul class="simlist"><li><b>since</b> = desde → un momento: Monday, 2015, nine o’clock.</li><li><b>for</b> = durante / hace → una cantidad: ten minutes, two years.</li><li>Se pregunta con <b>How long…?</b> / ¿Cuánto tiempo…?</li></ul>`,
      en:`<div class="gdesc">The ideas are the same: one word for the <b>starting point</b> and one for the <b>length of time</b>.</div>
<div class="viz-grid"><div class="viz-item"><span class="ico">📍</span><span class="lbl">since Monday</span><span class="es">desde el lunes</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">since 2015</span><span class="es">desde 2015</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">since nine o’clock</span><span class="es">desde las nueve</span></div><div class="viz-item"><span class="ico">⏱️</span><span class="lbl">for ten minutes</span><span class="es">(hace / durante) diez minutos</span></div><div class="viz-item"><span class="ico">⏱️</span><span class="lbl">for eleven years</span><span class="es">(hace) once años</span></div><div class="viz-item"><span class="ico">❓</span><span class="lbl">How long…?</span><span class="es">¿Cuánto tiempo…?</span></div></div>
${eg('Don Beto has sold water <span class="tag s">for</span> many years.','Don Beto has sold water for many years.','ok')}
${eg('Nina has lived in the city <span class="tag s">since</span> Monday.','Nina has lived in the city since Monday.','ok')}
<div class="sec-label">What is the same in both languages</div>
<ul class="simlist"><li><b>since</b> → a moment: Monday, 2015, nine o’clock.</li><li><b>for</b> → an amount: ten minutes, two years.</li><li>You ask with <b>How long…?</b></li></ul>`
    },
    checks:[
      { q:{es:'«Desde el lunes» =',en:'«Desde el lunes» ='}, opts:{es:["since Monday","for Monday"],en:["since Monday","for Monday"]}, correct:0, fb:{ why:{es:'El lunes es un momento → since.',en:'Monday is a moment → since.'}, tip:{es:'since + momento',en:'since + moment'}} },
      { q:{es:'«Diez minutos» (duración) va con:',en:'«Ten minutes» (length) goes with:'}, opts:{es:["for","since"],en:["for","since"]}, correct:0, fb:{ why:{es:'Cantidad de tiempo → for.',en:'Amount of time → for.'}, tip:{es:'for + cantidad',en:'for + amount'}} },
      { q:{es:'«Desde 2015» =',en:'«Desde 2015» ='}, opts:{es:["since 2015","for 2015"],en:["since 2015","for 2015"]}, correct:0, fb:{ why:{es:'Un año concreto → since.',en:'A specific year → since.'}, tip:{es:'since + año',en:'since + year'}} },
      { q:{es:'«¿Cuánto tiempo…?» =',en:'«¿Cuánto tiempo…?» ='}, opts:{es:["How long…?","How much…?"],en:["How long…?","How much…?"]}, correct:0, fb:{ why:{es:'Para duración: How long.',en:'For length of time: How long.'}, tip:{es:'How long',en:'How long'}} },
      { q:{es:'«Once años» va con:',en:'«Eleven years» goes with:'}, opts:{es:["for","since"],en:["for","since"]}, correct:0, fb:{ why:{es:'Es una cantidad de años.',en:'It is an amount of years.'}, tip:{es:'for + años',en:'for + years'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">La gran diferencia: el español usa el <b>presente</b> («vivo aquí desde…»), pero el inglés usa el <b>Present Perfect</b>: <b>have / has + participio</b>.</div>
<table class="dtab"><tr><th>Español</th><th>Inglés ✅</th><th>Error típico ❌</th></tr>
<tr><td>Vivo aquí desde 2015.</td><td class="en">I have lived here since 2015.</td><td>I live here since 2015.</td></tr>
<tr><td>Espero hace diez minutos.</td><td class="en">I have waited for ten minutes.</td><td>I wait since ten minutes.</td></tr>
<tr><td>Tiene el perro hace once años.</td><td class="en">She has had the dog for eleven years.</td><td>She has the dog since eleven years.</td></tr></table>
${ii('🔧','Participios comunes: live → <b>lived</b> · work → <b>worked</b> · wait → <b>waited</b> · have → <b>had</b> · sell → <b>sold</b> · be → <b>been</b> · know → <b>known</b> · teach → <b>taught</b>.')}
${ii('🚫','«Hace diez años» NO se traduce con «ago» aquí: «for ten years» (sigue) ≠ «ten years ago» (terminó).')}`,
      en:`<div class="gdesc">The big difference: Spanish uses the <b>present</b> («vivo aquí desde…»), but English uses the <b>Present Perfect</b>: <b>have / has + past participle</b>.</div>
<table class="dtab"><tr><th>Spanish</th><th>English ✅</th><th>Common mistake ❌</th></tr>
<tr><td>Vivo aquí desde 2015.</td><td class="en">I have lived here since 2015.</td><td>I live here since 2015.</td></tr>
<tr><td>Espero hace diez minutos.</td><td class="en">I have waited for ten minutes.</td><td>I wait since ten minutes.</td></tr>
<tr><td>Tiene el perro hace once años.</td><td class="en">She has had the dog for eleven years.</td><td>She has the dog since eleven years.</td></tr></table>
${ii('🔧','Common participles: live → <b>lived</b> · work → <b>worked</b> · wait → <b>waited</b> · have → <b>had</b> · sell → <b>sold</b> · be → <b>been</b> · know → <b>known</b> · teach → <b>taught</b>.')}
${ii('🚫','«Hace diez años» is NOT «ago» here: «for ten years» (it continues) ≠ «ten years ago» (it finished).')}`
    },
    checks:[
      { q:{es:'«Vivo aquí desde 2015» =',en:'«Vivo aquí desde 2015» ='}, opts:{es:["I have lived here since 2015.","I live here since 2015."],en:["I have lived here since 2015.","I live here since 2015."]}, correct:0, fb:{ why:{es:'Sigue hasta hoy → Present Perfect.',en:'It continues to today → Present Perfect.'}, tip:{es:'have + participio',en:'have + participle'}} },
      { q:{es:'Participio de «sell»:',en:'Past participle of «sell»:'}, opts:{es:["sold","selled"],en:["sold","selled"]}, correct:0, fb:{ why:{es:'Sell es irregular: sold.',en:'Sell is irregular: sold.'}, tip:{es:'sell → sold',en:'sell → sold'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["She has had the dog for eleven years.","She has the dog since eleven years."],en:["She has had the dog for eleven years.","She has the dog since eleven years."]}, correct:0, fb:{ why:{es:'Present Perfect + for + cantidad.',en:'Present Perfect + for + amount.'}, tip:{es:'for + años',en:'for + years'}} },
      { q:{es:'«For ten years» significa que la acción:',en:'«For ten years» means the action:'}, opts:{es:["sigue hoy","terminó hace diez años"],en:["continues today","ended ten years ago"]}, correct:0, fb:{ why:{es:'Con Present Perfect, sigue.',en:'With the Present Perfect, it continues.'}, tip:{es:'for = sigue',en:'for = continues'}} },
      { q:{es:'Participio de «teach»:',en:'Past participle of «teach»:'}, opts:{es:["taught","teached"],en:["taught","teached"]}, correct:0, fb:{ why:{es:'Teach es irregular: taught.',en:'Teach is irregular: taught.'}, tip:{es:'teach → taught',en:'teach → taught'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Tres fórmulas para contar cuánto tiempo:</div>
<div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">have / has + participio</span><span class="plus">+</span><span class="pill o">since + momento</span></div><div class="fex"><span class="en">The family has lived here since 2015.</span><span class="es">La familia vive aquí desde 2015.</span></div></div>
<div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">have / has + participio</span><span class="plus">+</span><span class="pill o">for + cantidad</span></div><div class="fex"><span class="en">They have waited for ten minutes.</span><span class="es">Esperan hace diez minutos.</span></div></div>
<div class="fbox"><div class="frm"><span class="pill s">How long</span><span class="plus">+</span><span class="pill v">have / has</span><span class="plus">+</span><span class="pill o">sujeto + participio?</span></div><div class="fex"><span class="en">How long have you lived here?</span><span class="es">¿Cuánto tiempo llevas viviendo aquí?</span></div></div>
${ii('🧠','<b>Tip 1:</b> ¿puedes contar el tiempo (5 minutos, 2 años)? → <b>for</b>. ¿Es una fecha u hora? → <b>since</b>.')}
${ii('✂️','<b>Tip 2:</b> contracciones: I’ve · she’s · they’ve · haven’t · hasn’t.')}
<div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «I live here since 2015» → ✅ «I <b>have lived</b> here since 2015».</p></div>`,
      en:`<div class="gdesc">Three formulas to say how long:</div>
<div class="fbox"><div class="frm"><span class="pill s">subject</span><span class="plus">+</span><span class="pill v">have / has + participle</span><span class="plus">+</span><span class="pill o">since + moment</span></div><div class="fex"><span class="en">The family has lived here since 2015.</span><span class="es">The family has lived here since 2015.</span></div></div>
<div class="fbox"><div class="frm"><span class="pill s">subject</span><span class="plus">+</span><span class="pill v">have / has + participle</span><span class="plus">+</span><span class="pill o">for + amount</span></div><div class="fex"><span class="en">They have waited for ten minutes.</span><span class="es">They have waited for ten minutes.</span></div></div>
<div class="fbox"><div class="frm"><span class="pill s">How long</span><span class="plus">+</span><span class="pill v">have / has</span><span class="plus">+</span><span class="pill o">subject + participle?</span></div><div class="fex"><span class="en">How long have you lived here?</span><span class="es">How long have you lived here?</span></div></div>
${ii('🧠','<b>Tip 1:</b> can you count the time (5 minutes, 2 years)? → <b>for</b>. Is it a date or a time? → <b>since</b>.')}
${ii('✂️','<b>Tip 2:</b> contractions: I’ve · she’s · they’ve · haven’t · hasn’t.')}
<div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «I live here since 2015» → ✅ «I <b>have lived</b> here since 2015».</p></div>`
    },
    checks:[
      { q:{es:'«since» o «for»: ___ nine o’clock',en:'«since» or «for»: ___ nine o’clock'}, opts:{es:["since","for"],en:["since","for"]}, correct:0, fb:{ why:{es:'Una hora concreta → since.',en:'A specific time → since.'}, tip:{es:'hora = since',en:'time = since'}} },
      { q:{es:'«since» o «for»: ___ two years',en:'«since» or «for»: ___ two years'}, opts:{es:["for","since"],en:["for","since"]}, correct:0, fb:{ why:{es:'Se cuenta → for.',en:'It is counted → for.'}, tip:{es:'cantidad = for',en:'amount = for'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["How long have you lived here?","How long do you live here since?"],en:["How long have you lived here?","How long do you live here since?"]}, correct:0, fb:{ why:{es:'How long + have + sujeto + participio.',en:'How long + have + subject + participle.'}, tip:{es:'How long have…?',en:'How long have…?'}} },
      { q:{es:'«She has» contraído:',en:'«She has» contracted:'}, opts:{es:["she’s","she’ve"],en:["she’s","she’ve"]}, correct:0, fb:{ why:{es:'has → ’s.',en:'has → ’s.'}, tip:{es:'she’s',en:'she’s'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:["They have waited for ten minutes.","They have waited since ten minutes."],en:["They have waited for ten minutes.","They have waited since ten minutes."]}, correct:0, fb:{ why:{es:'Diez minutos = cantidad → for.',en:'Ten minutes = amount → for.'}, tip:{es:'for + minutos',en:'for + minutes'}} }
    ] },
  { icon:'✨', title:{es:'Práctica Final',en:'Final Practice'}, builder:true,
    html:{
      es:`<div class="gdesc">Junta todo: have / has + participio + since / for. Arma la oración.</div>

function say(text,acc){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; const vs=speechSynthesis.getVoices()||[]; const want=acc==='US'?'en-US':'en-GB'; const v=vs.find(x=>x.lang===want)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0); if(v){u.voice=v;u.lang=v.lang;}else u.lang=want; speechSynthesis.speak(u); }catch(e){} }

function applyLang(){ const t=L();
