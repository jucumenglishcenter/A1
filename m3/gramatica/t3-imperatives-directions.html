<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Imperativos para dar indicaciones',en:'Imperatives for Directions'}, reportId:'sum-imperatives-directions' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Cuando le explicas el camino a alguien, usas <b>órdenes suaves</b>: «<b>regresa</b>», «<b>dobla</b>», «<b>continúa</b>», «<b>cruza</b>», «<b>no esperes</b>».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">dobla</div><div class="role">orden</div><div class="desc">«Dobla a la izquierda.»</div></div><div class="art-box"><div class="word">continúa</div><div class="role">orden</div><div class="desc">«Continúa hasta la iglesia.»</div></div><div class="art-box"><div class="word">no esperes</div><div class="role">orden negativa</div><div class="desc">«No esperes al otro lado.»</div></div></div>
        ${ii('🗣️','No dices «tú dobla»: el sujeto no aparece. La orden empieza con el verbo.')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «Regresa una cuadra, luego dobla al este y por último pasa detrás de la iglesia». Tres pasos, tres verbos.</div>`,
      en:`<div class="gdesc">When you explain the way to somebody, you use <b>soft orders</b>: «<b>regresa</b>», «<b>dobla</b>», «<b>continúa</b>», «<b>cruza</b>», «<b>no esperes</b>».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">dobla</div><div class="role">order</div><div class="desc">«Dobla a la izquierda.»</div></div><div class="art-box"><div class="word">continúa</div><div class="role">order</div><div class="desc">«Continúa hasta la iglesia.»</div></div><div class="art-box"><div class="word">no esperes</div><div class="role">negative order</div><div class="desc">«No esperes al otro lado.»</div></div></div>
        ${ii('🗣️','You do not say «tú dobla»: the subject disappears. The order starts with the verb.')}
        <div class="gnote life">🌎 <b>From your life:</b> «Regresa una cuadra, luego dobla al este y por último pasa detrás de la iglesia». Three steps, three verbs.</div>`
    },
    checks:[
      { q:{es:'«Dobla a la izquierda» es:',en:'«Dobla a la izquierda» is:'}, opts:{es:['Una indicación (orden)','Una pregunta'],en:['A direction (order)','A question']}, correct:0, fb:{ why:{es:'Le dices a alguien qué hacer.',en:'You tell somebody what to do.'}, tip:{es:'orden = imperativo',en:'order = imperative'}} },
      { q:{es:'En «Cruza la calle», ¿aparece el sujeto?',en:'In «Cruza la calle», is the subject there?'}, opts:{es:['No aparece','Sí, aparece «tú»'],en:['No, it disappears','Yes, «tú» is there']}, correct:0, fb:{ why:{es:'El imperativo no lleva sujeto.',en:'The imperative has no subject.'}, tip:{es:'verbo primero',en:'verb first'}} },
      { q:{es:'«No esperes ahí» es:',en:'«No esperes ahí» is:'}, opts:{es:['Una orden negativa','Una orden afirmativa'],en:['A negative order','An affirmative order']}, correct:0, fb:{ why:{es:'Le pides que NO haga algo.',en:'You ask somebody NOT to do something.'}, tip:{es:'no + verbo',en:'no + verb'}} },
      { q:{es:'«Primero… luego… finalmente…» sirven para:',en:'«Primero… luego… finalmente…» are used to:'}, opts:{es:['Ordenar los pasos','Preguntar la hora'],en:['Order the steps','Ask the time']}, correct:0, fb:{ why:{es:'Marcan la secuencia del camino.',en:'They mark the sequence of the route.'}, tip:{es:'secuencia',en:'sequence'}} },
      { q:{es:'«Cierra la puerta, por favor» suena:',en:'«Cierra la puerta, por favor» sounds:'}, opts:{es:['Amable','Grosero'],en:['Polite','Rude']}, correct:0, fb:{ why:{es:'«Por favor» suaviza la orden.',en:'«Por favor» softens the order.'}, tip:{es:'please = por favor',en:'please = por favor'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés hace lo mismo: la orden empieza con el verbo, sin sujeto.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">↩️</span><span class="lbl">Go back</span><span class="es">regresa</span></div><div class="viz-item"><span class="ico">↪️</span><span class="lbl">Turn left</span><span class="es">dobla a la izquierda</span></div><div class="viz-item"><span class="ico">➡️</span><span class="lbl">Continue</span><span class="es">continúa</span></div><div class="viz-item"><span class="ico">🚦</span><span class="lbl">Cross</span><span class="es">cruza</span></div><div class="viz-item"><span class="ico">🚌</span><span class="lbl">Take the bus</span><span class="es">toma el bus</span></div><div class="viz-item"><span class="ico">👀</span><span class="lbl">Look</span><span class="es">mira</span></div></div>
        ${eg('<span class="tag s">Go back</span> one block, then turn east.','Regresa una cuadra, luego dobla al este.','ok')}
        ${eg('<span class="tag s">Continue</span> to the church and pass behind it.','Continúa hasta la iglesia y pasa por detrás.','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>El verbo va primero: <b>Turn</b> left.</li><li>No se dice el sujeto: nunca «You turn left» como indicación.</li><li><b>Please</b> suaviza igual que «por favor».</li><li>Los pasos se encadenan: first → then → finally.</li></ul>
        <div class="gnote">👍 Go · Turn · Take · Cross · Pass · Continue · Walk · Look · Wait · Keep · Write · Come.</div>`,
      en:`<div class="gdesc">English does the same: the order starts with the verb, with no subject.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">↩️</span><span class="lbl">Go back</span><span class="es">regresa</span></div><div class="viz-item"><span class="ico">↪️</span><span class="lbl">Turn left</span><span class="es">dobla a la izquierda</span></div><div class="viz-item"><span class="ico">➡️</span><span class="lbl">Continue</span><span class="es">continúa</span></div><div class="viz-item"><span class="ico">🚦</span><span class="lbl">Cross</span><span class="es">cruza</span></div><div class="viz-item"><span class="ico">🚌</span><span class="lbl">Take the bus</span><span class="es">toma el bus</span></div><div class="viz-item"><span class="ico">👀</span><span class="lbl">Look</span><span class="es">mira</span></div></div>
        ${eg('<span class="tag s">Go back</span> one block, then turn east.','Go back one block, then turn east.','ok')}
        ${eg('<span class="tag s">Continue</span> to the church and pass behind it.','Continue to the church and pass behind it.','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>The verb comes first: <b>Turn</b> left.</li><li>No subject: never «You turn left» as a direction.</li><li><b>Please</b> softens it, like «por favor».</li><li>Steps chain up: first → then → finally.</li></ul>
        <div class="gnote">👍 Go · Turn · Take · Cross · Pass · Continue · Walk · Look · Wait · Keep · Write · Come.</div>`
    },
    checks:[
      { q:{es:'«Regresa una cuadra» = ',en:'«Regresa una cuadra» = '}, opts:{es:['Go back one block','You go back one block'],en:['Go back one block','You go back one block']}, correct:0, fb:{ why:{es:'La indicación no lleva sujeto.',en:'A direction takes no subject.'}, ex:{es:'Go back one block, then turn east.',en:'Go back one block, then turn east.'}} },
      { q:{es:'«Cruza la calle» = ',en:'«Cruza la calle» = '}, opts:{es:['Cross the street','Crossing the street'],en:['Cross the street','Crossing the street']}, correct:0, fb:{ why:{es:'Se usa el verbo en forma base.',en:'You use the base form of the verb.'}, tip:{es:'forma base',en:'base form'}} },
      { q:{es:'«Toma el bus 301» = ',en:'«Toma el bus 301» = '}, opts:{es:['Take bus 301','Takes bus 301']}, correct:0, fb:{ why:{es:'El imperativo nunca lleva -s.',en:'The imperative never takes -s.'}, tip:{es:'sin -s',en:'no -s'}} },
      { q:{es:'«Continúa hasta la iglesia» = ',en:'«Continúa hasta la iglesia» = '}, opts:{es:['Continue to the church','Continue at the church'],en:['Continue to the church','Continue at the church']}, correct:0, fb:{ why:{es:'El destino lleva «to».',en:'The destination takes «to».'}, ex:{es:'Continue to the church and pass behind it.',en:'Continue to the church and pass behind it.'}} },
      { q:{es:'«Cierra la puerta, por favor» = ',en:'«Cierra la puerta, por favor» = '}, opts:{es:['Close the gate, please','Please you close the gate'],en:['Close the gate, please','Please you close the gate']}, correct:0, fb:{ why:{es:'«Please» va al inicio o al final, sin sujeto.',en:'«Please» goes first or last, with no subject.'}, ex:{es:'And close the gate, please, because of the dog.',en:'And close the gate, please, because of the dog.'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">La diferencia clave está en la <b>orden negativa</b>: el español cambia el verbo, el inglés solo agrega <b>Do not / Don't</b>.</div>
        <table class="dtab"><tr><th>Español</th><th>Inglés</th><th>Nota</th></tr>
          <tr><td>Espera aquí</td><td class="en">Wait here</td><td>verbo base</td></tr>
          <tr><td>No esperes ahí</td><td class="en">Do not wait there</td><td>Do not + base</td></tr>
          <tr><td>No tomes otro bus</td><td class="en">Do not take another bus</td><td>nunca «not take»</td></tr>
        </table>
        <div class="sec-label">⚠️ El verbo no cambia nunca</div>
        ${ii('🚫','En español el verbo cambia («espera» → «no esperes»). En inglés se queda igual: <b>wait</b> → <b>do not wait</b>.')}
        ${eg('<span class="tag s">Do not wait</span> across the street.','No esperen al otro lado de la calle.','ok')}
        ${eg('<span class="tag s">Don’t take</span> another bus.','No tomes otro bus.','ok')}
        ${eg('Not wait across the street.','Falta el auxiliar: <b>Do not</b> wait.','bad')}
        ${eg('Do not takes another bus.','Después de «do not» va la forma base: <b>take</b>.','bad')}
        <div class="gnote">📍 <b>Don't</b> es la forma corta de <b>do not</b>: significan lo mismo.</div>`,
      en:`<div class="gdesc">The key difference is the <b>negative order</b>: Spanish changes the verb, English only adds <b>Do not / Don't</b>.</div>
        <table class="dtab"><tr><th>Spanish</th><th>English</th><th>Note</th></tr>
          <tr><td>Espera aquí</td><td class="en">Wait here</td><td>base verb</td></tr>
          <tr><td>No esperes ahí</td><td class="en">Do not wait there</td><td>Do not + base</td></tr>
          <tr><td>No tomes otro bus</td><td class="en">Do not take another bus</td><td>never «not take»</td></tr>
        </table>
        <div class="sec-label">⚠️ The verb never changes</div>
        ${ii('🚫','In Spanish the verb changes («espera» → «no esperes»). In English it stays the same: <b>wait</b> → <b>do not wait</b>.')}
        ${eg('<span class="tag s">Do not wait</span> across the street.','Do not wait across the street.','ok')}
        ${eg('<span class="tag s">Don’t take</span> another bus.','Don’t take another bus.','ok')}
        ${eg('Not wait across the street.','The auxiliary is missing: <b>Do not</b> wait.','bad')}
        ${eg('Do not takes another bus.','After «do not» use the base form: <b>take</b>.','bad')}
        <div class="gnote">📍 <b>Don't</b> is the short form of <b>do not</b>: same meaning.</div>`
    },
    checks:[
      { q:{es:'«No esperes al otro lado»:',en:'«Do not wait across the street»:'}, opts:{es:['Do not wait across the street','Not wait across the street'],en:['Do not wait across the street','Not wait across the street']}, correct:0, fb:{ why:{es:'La negación necesita «do».',en:'The negative needs «do».'}, ex:{es:'Here, at this kiosk. Do not wait across the street.',en:'Here, at this kiosk. Do not wait across the street.'}} },
      { q:{es:'«No tomes otro bus»:',en:'«Do not take another bus»:'}, opts:{es:['Do not take another bus','Do not takes another bus'],en:['Do not take another bus','Do not takes another bus']}, correct:0, fb:{ why:{es:'Después de «do not» va la forma base.',en:'After «do not» use the base form.'}, ex:{es:'Very good. Do not take another bus.',en:'Very good. Do not take another bus.'}} },
      { q:{es:'«Don’t» significa:',en:'«Don’t» means:'}, opts:{es:['do not','does not'],en:['do not','does not']}, correct:0, fb:{ why:{es:'Es la forma corta de «do not».',en:'It is the short form of «do not».'}, tip:{es:"don't = do not",en:"don't = do not"}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:['Do not turn left here','Do not turning left here'],en:['Do not turn left here','Do not turning left here']}, correct:0, fb:{ why:{es:'Base sin -ing.',en:'Base form, no -ing.'}, tip:{es:'do not + base',en:'do not + base'}} },
      { q:{es:'«Espera aquí» (afirmativo):',en:'«Wait here» (affirmative):'}, opts:{es:['Wait here','Do wait here please not'],en:['Wait here','Do wait here please not']}, correct:0, fb:{ why:{es:'El afirmativo no necesita «do».',en:'The affirmative needs no «do».'}, tip:{es:'solo el verbo',en:'just the verb'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Las dos fórmulas de las indicaciones:</div>
        <div class="fbox"><div class="frm"><span class="pill v">verbo base</span><span class="plus">+</span><span class="pill o">resto</span></div><div class="fex"><span class="en">Turn east at the church.</span><span class="es">Dobla al este en la iglesia.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">Do not</span><span class="plus">+</span><span class="pill v">verbo base</span><span class="plus">+</span><span class="pill o">resto</span></div><div class="fex"><span class="en">Do not wait across the street.</span><span class="es">No esperes al otro lado de la calle.</span></div></div>
        ${ii('🧭','<b>Tip 1 — el kit de direcciones:</b> Go straight · Turn left / right · Turn east · Go back one block · Cross the street · Take the bus · Get off at…')}
        ${ii('🔢','<b>Tip 2 — encadena los pasos:</b> <b>First</b> go straight, <b>then</b> turn left, <b>finally</b> cross the street.')}
        ${ii('🙏','<b>Tip 3 — amabilidad:</b> agrega <b>please</b> («Come ten minutes early, please») o empieza con <b>Excuse me</b> antes de preguntar.')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «You turn left at the church» (como indicación) → ✅ «<b>Turn</b> left at the church».</p></div>
        ${ii('⚡','Una indicación clara = verbo base + lugar + (paso siguiente).')}`,
      en:`<div class="gdesc">The two direction formulas:</div>
        <div class="fbox"><div class="frm"><span class="pill v">base verb</span><span class="plus">+</span><span class="pill o">the rest</span></div><div class="fex"><span class="en">Turn east at the church.</span><span class="es">Turn east at the church.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">Do not</span><span class="plus">+</span><span class="pill v">base verb</span><span class="plus">+</span><span class="pill o">the rest</span></div><div class="fex"><span class="en">Do not wait across the street.</span><span class="es">Do not wait across the street.</span></div></div>
        ${ii('🧭','<b>Tip 1 — the directions kit:</b> Go straight · Turn left / right · Turn east · Go back one block · Cross the street · Take the bus · Get off at…')}
        ${ii('🔢','<b>Tip 2 — chain the steps:</b> <b>First</b> go straight, <b>then</b> turn left, <b>finally</b> cross the street.')}
        ${ii('🙏','<b>Tip 3 — politeness:</b> add <b>please</b> («Come ten minutes early, please») or start with <b>Excuse me</b> before asking.')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «You turn left at the church» (as a direction) → ✅ «<b>Turn</b> left at the church».</p></div>
        ${ii('⚡','A clear direction = base verb + place + (next step).')}`
    },
    checks:[
      { q:{es:'¿Cuál es una indicación correcta?',en:'Which is a correct direction?'}, opts:{es:['Turn left at the church','You turn left at the church'],en:['Turn left at the church','You turn left at the church']}, correct:0, fb:{ why:{es:'Sin sujeto.',en:'No subject.'}, tip:{es:'verbo primero',en:'verb first'}} },
      { q:{es:'«Sigue derecho dos cuadras»:',en:'«Go straight two blocks»:'}, opts:{es:['Go straight two blocks','Going straight two blocks'],en:['Go straight two blocks','Going straight two blocks']}, correct:0, fb:{ why:{es:'Forma base: go.',en:'Base form: go.'}, tip:{es:'go straight',en:'go straight'}} },

function renderTabs(){ document.getElementById('steptabs').innerHTML=STEPS.map((s,i)=>`<button class="stab${i===0?' on':''}${doneSteps[i]?' done':''}" id="stab${i}" onclick="goStep(${i})">${s.icon} ${i+1}</button>`).join(''); }
function applyLang(){ const t=L();

  document.getElementById('kpT').textContent=t.kpT; document.getElementById('lBack').textContent=t.back; document.getElementById('lRetry').textContent=t.retry;
  updateMilestone(); renderStep(); }
function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';

  const ansd=answers[cur].filter(x=>x!==null).length;

function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
