        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }

        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

:"el adverbio de frecuencia va ANTES del verbo normal y DESPUÉS de to be (is/are/am).","correctReason":"“Often travel”: adverbio antes del verbo normal.","hint":"Ubica el verbo: ¿es “to be” o un verbo normal? Eso decide dónde vive el adverbio."},{"badge":"💼 El trabajo","options":[{"text":"I am never late for work.","correct":true,"es":"Nunca llego tarde al trabajo."},{"text":"I never am late for work.","correct":false,"es":"Nunca llego tarde al trabajo.","errorWord":"never","correctWord":"(después de am)","errorType":"Posición con to be","explanation":"Con “am” el adverbio va después: “am never”."},{"text":"I am late never for work.","correct":false,"es":"Nunca llego tarde al trabajo.","errorWord":"never","correctWord":"(después de am)","errorType":"Posición","explanation":"“Never” va pegado al verbo: “am never late”."}],"clue":"to be + adverbio","clueExplain":"el adverbio de frecuencia va ANTES del verbo normal y DESPUÉS de to be (is/are/am).","correctReason":"“Am never late”: después de “am”.","hint":"Ubica el verbo: ¿es “to be” o un verbo normal? Eso decide dónde vive el adverbio."},{"badge":"🥖 Pan fresco","options":[{"text":"She always buys fresh bread.","correct":true,"es":"Ella siempre compra pan fresco."},{"text":"She buys always fresh bread.","correct":false,"es":"Ella siempre compra pan fresco.","errorWord":"always","correctWord":"(antes del verbo)","errorType":"Posición con verbo normal","explanation":"“Always” va antes: “always buys”."},{"text":"Always she buys fresh bread.","correct":false,"es":"Ella siempre compra pan fresco.","errorWord":"Always","correctWord":"(antes del verbo)","errorType":"“Always” no abre la oración","explanation":"A diferencia de “sometimes”, “always” no inicia: va antes del verbo."}],"clue":"always no abre","clueExplain":"“always” y “never” no abren la oración: viven antes del verbo normal.","correctReason":"“Always buys”: posición correcta para “always”.","hint":"No todos los adverbios tienen permiso de abrir la oración."},{"badge":"💵 El pago","options":[{"text":"They never pay with cash.","correct":true,"es":"Nunca pagan en efectivo."},{"text":"They pay never with cash.","correct":false,"es":"Nunca pagan en efectivo.","errorWord":"never","correctWord":"(antes del verbo)","errorType":"Posición con verbo normal","explanation":"“Never” va antes del verbo: “never pay”."},{"text":"They don't never pay with cash.","correct":false,"es":"Nunca pagan en efectivo.","errorWord":"never","correctWord":"ever","errorType":"Doble negación","explanation":"“Never” no se combina con “don't”: una sola negación."}],"clue":"never = ya negativo","clueExplain":"“never” niega solito; sumar “don’t” crea doble negación.","correctReason":"“Never pay”: una sola negación, bien ubicada.","hint":"Cuenta las negaciones de cada opción."},{"badge":"🏢 Ocupado","options":[{"text":"He is usually busy at work.","correct":true,"es":"Suele estar ocupado en el trabajo."},{"text":"He usually is busy at work.","correct":false,"es":"Suele estar ocupado en el trabajo.","errorWord":"usually","correctWord":"(después de is)","errorType":"Posición con to be","explanation":"Con to be, va después: “is usually”."},{"text":"He is busy usually at work.","correct":false,"es":"Suele estar ocupado en el trabajo.","errorWord":"usually","correctWord":"(después de is)","errorType":"Posición","explanation":"“Usually” va junto a “is”: “is usually busy”."}],"clue":"to be + adverbio","clueExplain":"el adverbio de frecuencia va ANTES del verbo normal y DESPUÉS de to be (is/are/am).","correctReason":"“Is usually busy”: el adverbio abraza al to be por detrás.","hint":"Ubica el verbo: ¿es “to be” o un verbo normal? Eso decide dónde vive el adverbio."},{"badge":"💻 Online","options":[{"text":"We sometimes shop online.","correct":true,"es":"A veces compramos por internet."},{"text":"We shop sometimes online.","correct":false,"es":"A veces compramos por internet.","errorWord":"sometimes","correctWord":"(antes del verbo)","errorType":"Posición con verbo normal","explanation":"“Sometimes” va antes del verbo: “sometimes shop”."},{"text":"We are sometimes shop online.","correct":false,"es":"A veces compramos por internet.","errorWord":"are","correctWord":"(nada)","errorType":"“Are” sobra","explanation":"“Shop” es verbo normal: sin “are”."}],"clue":"antes del verbo normal","clueExplain":"el adverbio de frecuencia va ANTES del verbo normal y DESPUÉS de to be (is/are/am).","correctReason":"“Sometimes shop”: posición estándar.","hint":"Ubica el verbo: ¿es “to be” o un verbo normal? Eso decide dónde vive el adverbio."},{"badge":"🍬 Los snacks","options":[{"text":"I rarely spend money on snacks.","correct":true,"es":"Rara vez gasto en snacks."},{"text":"I spend rarely money on snacks.","correct":false,"es":"Rara vez gasto en snacks.","errorWord":"rarely","correctWord":"(antes del verbo)","errorType":"Posición con verbo normal","explanation":"“Rarely” va antes: “rarely spend”."},{"text":"Rarely I spend money on snacks.","correct":false,"es":"Rara vez gasto en snacks.","errorWord":"Rarely","correctWord":"(antes del verbo)","errorType":"“Rarely” no abre así","explanation":"“Rarely” no abre la oración en este nivel: va antes del verbo."}],"clue":"antes del verbo normal","clueExplain":"el adverbio de frecuencia va ANTES del verbo normal y DESPUÉS de to be (is/are/am).","correctReason":"“Rarely spend”: adverbio en su lugar.","hint":"Dos opciones movieron el adverbio a lugares prohibidos."},{"badge":"🏪 La tienda","options":[{"text":"The store is often crowded.","correct":true,"es":"La tienda suele estar llena."},{"text":"The store often is crowded.","correct":false,"es":"La tienda suele estar llena.","errorWord":"often","correctWord":"(después de is)","errorType":"Posición con to be","explanation":"Con to be va después: “is often”."},{"text":"The store is crowded often.","correct":false,"es":"La tienda suele estar llena.","errorWord":"often","correctWord":"(después de is)","errorType":"Adverbio al final","explanation":"“Often” no cierra: “is often crowded”."}],"clue":"to be + adverbio","clueExplain":"el adverbio de frecuencia va ANTES del verbo normal y DESPUÉS de to be (is/are/am).","correctReason":"“Is often crowded”: posición correcta.","hint":"Ubica el verbo: ¿es “to be” o un verbo normal? Eso decide dónde vive el adverbio."},{"badge":"👛 La cartera","options":[{"text":"My mother seldom forgets her wallet.","correct":true,"es":"Mi madre rara vez olvida su cartera."},{"text":"My mother forgets seldom her wallet.","correct":false,"es":"Mi madre rara vez olvida su cartera.","errorWord":"seldom","correctWord":"(antes del verbo)","errorType":"Posición con verbo normal","explanation":"“Seldom” va antes del verbo: “seldom forgets”."},{"text":"My mother doesn't seldom forget her wallet.","correct":false,"es":"Mi madre rara vez olvida su cartera.","errorWord":"seldom","correctWord":"(nada)","errorType":"Doble negación","explanation":"“Seldom” ya es casi-negativo: no se junta con “doesn't”."}],"clue":"seldom = casi negativo","clueExplain":"“seldom” (rara vez) funciona como “never”: va antes del verbo y sin otra negación.","correctReason":"“Seldom forgets”: una negación suave, bien puesta.","hint":"“Seldom” se parece más a “never” de lo que aparenta."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
