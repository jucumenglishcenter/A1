<script>
const GLOSS = [{"w":"shop / store","es":"tienda","ex":"The shop opens at nine in the morning."},{"w":"cost / price","es":"costo / precio","ex":"She estimates the total cost: three months of saving."},{"w":"expensive / cheap","es":"caro / barato","ex":"\"Beautiful, but expensive,\" Ana says every time."},{"w":"earn / save / spend","es":"ganar / ahorrar / gastar","ex":"Marisol earns fifty a week at her aunt's shop."},{"w":"receipt","es":"recibo / boleta","ex":"\"Returns require a receipt,\" the sign declares."},{"w":"sell / buy","es":"vender / comprar","ex":"The shop mainly sells kitchen machines."},{"w":"size / material","es":"talla / material","ex":"\"Select the size, and I bring it,\" says Doña Vera."},{"w":"cash / card","es":"efectivo / tarjeta","ex":"\"At the market, cash is king,\" says Don Felipe."},{"w":"manager","es":"encargado/a / gerente","ex":"The manager listens and considers the options."},{"w":"fix / replace","es":"arreglar / reemplazar","ex":"The letter asks for one clear action: fix it or replace it."},{"w":"always / usually / often","es":"siempre / normalmente / seguido","ex":"Ana usually walks past the shop at eight."},{"w":"sometimes / never","es":"a veces / nunca","ex":"He never loses his patience with customers."},{"w":"at / in / on (tiempo)","es":"a las / en / el (día)","ex":"On Fridays, the shop closes at seven in the evening."},{"w":"have you ever…?","es":"¿alguna vez has…?","ex":"\"Has this ever happened before?\""},{"w":"just / already / yet","es":"recién / ya / todavía","ex":"\"I have just opened the box, and it has already stopped.\""},{"w":"since","es":"desde","ex":"Ana has passed that window every day since March."},{"w":"gone","es":"ido / desaparecido","ex":"The green hat was gone."},{"w":"describe / explain","es":"describir / explicar","ex":"\"Describe the problem, explain the cause, and justify your request.\""},{"w":"persuade","es":"persuadir / convencer","ex":"A calm letter persuades more than an angry face."},{"w":"proofread","es":"revisar (un texto)","ex":"Ana proofreads the letter twice before they go."},{"w":"indicate / infer","es":"indicar / deducir","ex":"The noise indicates a problem; we can infer the motor is dead."},{"w":"demonstrate","es":"demostrar / hacer una demo","ex":"Carlos demonstrates the juice machine several times a day."},{"w":"estimate","es":"estimar / calcular","ex":"Quick math: fifty a week, two hundred a month."},{"w":"solution","es":"solución","ex":"The manager offers a solution in two minutes."},{"w":"separate","es":"separado/a","ex":"She keeps the money in two separate envelopes."},{"w":"slightly","es":"ligeramente","ex":"\"This one is slightly cheaper, and the material is better.\""},{"w":"despite","es":"a pesar de","ex":"Despite the long day, Carlos walks home smiling."},{"w":"distant","es":"lejano/a","ex":"The guitar is not a distant dream now."},{"w":"fear","es":"miedo / temor","ex":"Her only fear: spending it all in one weekend."},{"w":"shift","es":"turno (de trabajo)","ex":"His shift starts at nine and finishes at six."},{"w":"in his element","es":"en su elemento (cómodo)","ex":"Behind the counter, Carlos is in his element."},{"w":"underneath","es":"debajo de","ex":"The receipt was underneath the manual, safe and clean."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"The Hat in the Window","sTitleEs":"El sombrero de la vitrina","dTitle":"The Green Jacket","dTitleEs":"La casaca verde","paras":[[["There is a small shop on the corner of Ana's street.","Hay una tienda pequeña en la esquina de la calle de Ana."],["A wooden sign says: \"Established in 1990 — Family Business\".","Un letrero de madera dice: «Establecida en 1990 — Negocio Familiar»."],["Ana usually walks past the shop at eight in the morning.","Ana normalmente pasa por la tienda a las ocho de la mañana."],["She always looks at the window, just for a second.","Siempre mira la vitrina, solo por un segundo."]],[["In the window, there is a hat the color of the sea.","En la vitrina, hay un sombrero del color del mar."],["Ana has passed that window every day since March.","Ana ha pasado por esa vitrina cada día desde marzo."],["\"Beautiful, but expensive,\" she says every time, and keeps walking.","«Hermoso, pero caro», dice cada vez, y sigue caminando."],["The price below the hat never changes: sixty soles.","El precio debajo del sombrero nunca cambia: sesenta soles."]],[["Her grandmother's birthday is on the last Sunday of July.","El cumpleaños de su abuela es el último domingo de julio."],["Delia often talks about the hats of her young years.","Delia habla seguido de los sombreros de sus años jóvenes."],["\"A good hat, made well, lasts a whole life,\" she says.","«Un buen sombrero, bien hecho, dura toda la vida», dice."],["That sea-green hat looks exactly like her old photos.","Ese sombrero verde mar se ve exactamente como sus fotos antiguas."]],[["Ana decides to save for it, week by week.","Ana decide ahorrar para él, semana a semana."],["She does small jobs: she helps Doña Carmen with her garden.","Hace trabajos pequeños: ayuda a Doña Carmen con su jardín."],["She usually saves ten soles a week, sometimes a little more.","Normalmente ahorra diez soles por semana, a veces un poco más."],["Quick math: six weeks of work for one perfect gift.","Matemática rápida: seis semanas de trabajo para un regalo perfecto."]],[["Does she ever want to spend the money on other things?","¿Alguna vez quiere gastar el dinero en otras cosas?"],["Of course — new music, sweet bread, a movie with Marisol.","Claro — música nueva, pan dulce, una película con Marisol."],["But she keeps the money in a separate envelope, hidden.","Pero guarda el dinero en un sobre separado, escondido."],["On the envelope she wrote: \"For grandma. Do not touch.\"","En el sobre escribió: «Para la abuela. No tocar»."]],[["In week five, Ana walks past the shop and stops cold.","En la semana cinco, Ana pasa por la tienda y se queda helada."],["The window is empty; the sea-green hat is gone.","La vitrina está vacía; el sombrero verde mar ya no está."],["Her heart drops to her feet in one second.","El corazón se le cae a los pies en un segundo."],["She opens the door and asks, almost without air.","Abre la puerta y pregunta, casi sin aire."]],[["\"The green hat? A woman is considering it right now.\"","«¿El sombrero verde? Una señora lo está considerando ahora mismo»."],["The shop owner points to a table near the back.","La dueña de la tienda señala una mesa cerca del fondo."],["Ana explains her six weeks in one long, honest minute.","Ana explica sus seis semanas en un minuto largo y honesto."],["The woman listens, smiles slowly, and puts the hat down.","La señora escucha, sonríe despacio y deja el sombrero."]],[["\"A gift with that story matters more than my vacation hat.\"","«Un regalo con esa historia importa más que mi sombrero de vacaciones»."],["Ana pays with her envelope money, counting every sol.","Ana paga con el dinero de su sobre, contando cada sol."],["The owner adds a ribbon and does not charge for it.","La dueña agrega una cinta y no la cobra."],["Kindness, it seems, also lives in small shops.","La amabilidad, parece, también vive en las tiendas pequeñas."]],[["On the last Sunday of July, Delia opens the box.","El último domingo de julio, Delia abre la caja."],["She does not say anything for a long, quiet moment.","No dice nada por un momento largo y silencioso."],["Then she puts on the hat and looks fifty years younger.","Luego se pone el sombrero y se ve cincuenta años más joven."],["\"Where is my photo camera?\" laughs Ernesto. \"This is history!\"","«¿Dónde está mi cámara de fotos?», ríe Ernesto. «¡Esto es historia!»."]]],"datos":["Adverbios de frecuencia: <b>always · usually · often · sometimes · never</b> — van antes del verbo: <span class=\"frase\">She always looks…</span>","Presente perfecto + <b>since</b>: <span class=\"frase\">She has passed that window every day since March.</span>","Tiempo: <b>on</b> + día/fecha (on the last Sunday) · <b>at</b> + hora (at eight) · <b>in</b> + mes/parte del día (in July, in the morning).",null,null,"<b>gone</b> = ido/desaparecido: <span class=\"frase\">the hat is gone.</span>",null,null,null],"dlg":[["Marisol","Excuse me, does this jacket come in green?","Disculpe, ¿esta casaca viene en verde?"],["Doña Vera","Yes, we got new colors on Monday. One moment.","Sí, nos llegaron colores nuevos el lunes. Un momento."],["Marisol","Great! Do you have a medium size?","¡Genial! ¿Tiene talla mediana?"],["Doña Vera","Select the size, and I bring it from the back.","Elige la talla, y la traigo del almacén."],["Marisol","Medium, please. What is the material?","Mediana, por favor. ¿Cuál es el material?"],["Doña Vera","Soft cotton, made in Peru. Feel it.","Algodón suave, hecho en Perú. Tócala."],["Marisol","Oh, it is really soft. And the price?","Oh, es muy suave. ¿Y el precio?"],["Doña Vera","Eighty soles. It is our most popular jacket.","Ochenta soles. Es nuestra casaca más popular."],["Marisol","Eighty! That is more than my whole budget.","¡Ochenta! Eso es más que todo mi presupuesto."],["Doña Vera","How much do you want to spend?","¿Cuánto quieres gastar?"],["Marisol","Sixty, maybe sixty-five with pain in my heart.","Sesenta, quizás sesenta y cinco con dolor en el corazón."],["Doña Vera","Ha! Honest customers are my favorite customers.","¡Ja! Los clientes honestos son mis clientes favoritos."],["Doña Vera","Look at this other one. It is slightly cheaper.","Mira esta otra. Es ligeramente más barata."],["Marisol","The green is different… more like the sea.","El verde es distinto… más como el mar."],["Doña Vera","Sea green. And it matches your eyes, by the way.","Verde mar. Y combina con tus ojos, por cierto."],["Marisol","You say that to everyone, Doña Vera.","Eso le dice a todos, Doña Vera."],["Doña Vera","Only when it is true. Try it on.","Solo cuando es verdad. Pruébatela."],["Marisol","Okay… oh. Oh, this one is perfect.","Bueno… oh. Oh, esta es perfecta."],["Doña Vera","Sixty-five, and I add a cloth bag.","Sesenta y cinco, y agrego una bolsa de tela."],["Marisol","Does it have a pocket inside for my phone?","¿Tiene un bolsillo adentro para mi teléfono?"],["Doña Vera","Two pockets. One with a button.","Dos bolsillos. Uno con botón."],["Marisol","Sold! I mean — I am buying it.","¡Vendida! Digo — la compro."],["Doña Vera","Cash or card, my dear?","¿Efectivo o tarjeta, querida?"],["Marisol","Cash. I earned it this week, sol by sol.","Efectivo. Lo gané esta semana, sol por sol."],["Doña Vera","Money you earn always buys better. Here you go.","El dinero que ganas siempre compra mejor. Aquí tienes."],["Marisol","Thank you! See you next month, probably.","¡Gracias! Nos vemos el próximo mes, probablemente."]]},"2":{"sTitle":"The Receipt","sTitleEs":"El recibo","dTitle":"The Wrong Box","dTitleEs":"La caja equivocada","paras":[[["Ernesto has just bought a blender from the corner shop.","Ernesto acaba de comprar una licuadora en la tienda de la esquina."],["He is making his famous soup when the machine stops.","Está preparando su sopa famosa cuando la máquina se detiene."],["No sound, no light, no smell — the motor is simply dead.","Sin sonido, sin luz, sin olor — el motor está simplemente muerto."],["\"I have used it exactly three times!\" he says, incredulous.","«¡La he usado exactamente tres veces!», dice, incrédulo."]],[["Ana checks the box and finds the manual inside.","Ana revisa la caja y encuentra el manual adentro."],["The receipt was underneath the manual, safe and clean.","El recibo estaba debajo del manual, a salvo y limpio."],["\"Good news: you have not lost the receipt yet,\" she jokes.","«Buenas noticias: todavía no has perdido el recibo», bromea."],["The receipt indicates the date, the price, and the model.","El recibo indica la fecha, el precio y el modelo."]],[["At school, Ana has already learned to write a claim.","En la escuela, Ana ya aprendió a escribir un reclamo."],["\"Describe the problem, explain the cause, and justify your request.\"","«Describe el problema, explica la causa y justifica tu pedido»."],["\"The noise indicates a problem; we can infer the motor is dead.\"","«El ruido indica un problema; podemos deducir que el motor está muerto»."],["A calm letter persuades more than an angry face.","Una carta tranquila persuade más que una cara enojada."]],[["They write it together at the kitchen table, in twenty minutes.","La escriben juntos en la mesa de la cocina, en veinte minutos."],["The letter asks for one clear action: fix it or replace it.","La carta pide una acción clara: arreglarla o reemplazarla."],["Ana proofreads the letter twice before they go.","Ana revisa la carta dos veces antes de salir."],["\"Perfect grammar opens doors,\" she says, sounding like a teacher.","«La gramática perfecta abre puertas», dice, sonando como profesora."]],[["At the shop, a sign declares: \"Returns require a receipt.\"","En la tienda, un letrero declara: «Las devoluciones requieren recibo»."],["\"We have the receipt,\" says Ernesto, slightly nervous anyway.","«Tenemos el recibo», dice Ernesto, un poco nervioso igual."],["A short line leads to the manager's desk at the back.","Una fila corta lleva al escritorio del encargado, al fondo."],["The manager reads the letter first, then looks at the machine.","El encargado lee primero la carta, luego mira la máquina."]],[["\"Have you ever brought a claim letter before?\" he asks, surprised.","«¿Alguna vez había traído una carta de reclamo?», pregunta, sorprendido."],["\"My daughter wrote it. She is studying word order,\" says Ernesto.","«La escribió mi hija. Está estudiando el orden de las palabras», dice Ernesto."],["The manager laughs and tests the blender himself: nothing.","El encargado se ríe y prueba la licuadora él mismo: nada."],["\"You are right. This motor has died young,\" he declares.","«Tienen razón. Este motor ha muerto joven», declara."]],[["\"Let me consider the options,\" he says, checking a list.","«Déjenme considerar las opciones», dice, revisando una lista."],["\"These motors come from two different factories, mainly one in Lima.\"","«Estos motores vienen de dos fábricas distintas, principalmente una en Lima»."],["\"I can send it for repair, but that takes three weeks.\"","«Puedo mandarla a reparar, pero eso toma tres semanas»."],["\"Or I can replace it today. New box, new machine.\"","«O puedo reemplazarla hoy. Caja nueva, máquina nueva»."]],[["\"Replace it, please,\" says Ernesto, faster than his own shadow.","«Reemplácela, por favor», dice Ernesto, más rápido que su propia sombra."],["The manager offers a solution in two minutes, with a smile.","El encargado ofrece una solución en dos minutos, con una sonrisa."],["\"Thank you for the calm letter. Angry customers shout; you explained.\"","«Gracias por la carta tranquila. Los clientes enojados gritan; ustedes explicaron»."],["Ana felt proud all the way home; one calm letter led to a new machine.","Ana se sintió orgullosa todo el camino; una carta tranquila llevó a una máquina nueva."]],[["That night, the new blender sings, and the soup is perfect.","Esa noche, la licuadora nueva canta, y la sopa queda perfecta."],["\"To Ana, the family lawyer!\" says Ernesto, raising his cup.","«¡Por Ana, la abogada de la familia!», dice Ernesto, alzando su taza."],["Delia keeps the old receipt in the recipe notebook, as a lesson.","Delia guarda el recibo viejo en el recetario, como lección."],["Keep your receipts; write with calm; small papers save big days.","Guarda tus recibos; escribe con calma; los papeles pequeños salvan grandes días."]]],"datos":["Presente perfecto con <b>just / already / yet</b>: <span class=\"frase\">has just bought (recién) · has already learned (ya) · have not lost… yet (todavía no).</span>",null,"Verbos de un reclamo: <b>describe</b> (describir) · <b>explain</b> (explicar) · <b>justify</b> (justificar) · <b>persuade</b> (persuadir) · <b>proofread</b> (revisar el texto).",null,"<b>require</b> = requerir: <span class=\"frase\">Returns require a receipt.</span> · <b>declare</b> = declarar (letreros y anuncios).","Pregunta con <b>ever</b>: <span class=\"frase\">Have you ever brought a claim letter?</span> (¿alguna vez…?)",null,null,null],"dlg":[["Clienta","Good morning. I am afraid there is a problem.","Buenos días. Me temo que hay un problema."],["Carlos","Good morning! Tell me, what is the matter?","¡Buenos días! Dígame, ¿qué sucede?"],["Clienta","I ordered the small mixer, the white one.","Pedí la batidora pequeña, la blanca."],["Carlos","Yes, I remember. Order forty-two, on Tuesday.","Sí, recuerdo. Pedido cuarenta y dos, el martes."],["Clienta","Well, this box has a big black radio inside.","Bueno, esta caja tiene una radio negra grande adentro."],["Carlos","A radio?! Oh no. I am so sorry about this.","¡¿Una radio?! Oh no. Lo siento muchísimo."],["Clienta","Has this ever happened before?","¿Alguna vez había pasado esto?"],["Carlos","Never… well, honestly? Twice this year.","Nunca… bueno, ¿honestamente? Dos veces este año."],["Clienta","Ha! At least you are honest, young man.","¡Ja! Al menos eres honesto, muchacho."],["Carlos","The delivery labels sometimes get mixed. I can handle this.","Las etiquetas de envío a veces se mezclan. Yo me encargo."],["Clienta","Do I need to bring the receipt?","¿Necesito traer el recibo?"],["Carlos","Do you have it with you now?","¿Lo tiene con usted ahora?"],["Clienta","Yes, here it is. I never lose receipts.","Sí, aquí está. Nunca pierdo los recibos."],["Carlos","Perfect. They sent your mixer here — it is in the shop.","Perfecto. Enviaron su batidora aquí — está en la tienda."],["Clienta","Really? That is fast. Have you just checked?","¿En serio? Qué rápido. ¿Recién lo revisaste?"],["Carlos","Yes, I have just seen it on the system.","Sí, recién la he visto en el sistema."],["Clienta","And the radio? I have already opened the box.","¿Y la radio? Ya abrí la caja."],["Carlos","No problem. The mistake is ours, not yours.","No hay problema. El error es nuestro, no suyo."],["Carlos","I just need one signature here, please.","Solo necesito una firma aquí, por favor."],["Clienta","Of course. You have not lost your smile yet.","Claro. Todavía no has perdido tu sonrisa."],["Carlos","My manager says the smile is part of the uniform.","Mi encargada dice que la sonrisa es parte del uniforme."],["Clienta","Smart manager. Here is your radio, then.","Encargada lista. Aquí está tu radio, entonces."],["Carlos","And here is your mixer, with a small gift.","Y aquí está su batidora, con un regalito."],["Clienta","A gift? What is it?","¿Un regalo? ¿Qué es?"],["Carlos","A recipe book for mixers. Page five is famous.","Un recetario para batidoras. La página cinco es famosa."],["Clienta","Ha! You have just earned a regular customer.","¡Ja! Acabas de ganarte una clienta fija."]]},"3":{"sTitle":"Fifty a Week","sTitleEs":"Cincuenta a la semana","dTitle":"Gold or Credit?","dTitleEs":"¿Oro o crédito?","paras":[[["Marisol earns fifty soles a week at her aunt's shop.","Marisol gana cincuenta soles a la semana en la tienda de su tía."],["She works on Saturdays, from nine in the morning to six.","Trabaja los sábados, de nueve de la mañana a seis."],["The shop sells eggs from a farm outside the city.","La tienda vende huevos de una granja fuera de la ciudad."],["The farm sits near a green field, far from the factories.","La granja queda junto a un campo verde, lejos de las fábricas."]],[["Why is Marisol suddenly working? Two words: a guitar.","¿Por qué Marisol de pronto trabaja? Dos palabras: una guitarra."],["She saw it in June, in a music shop window.","La vio en junio, en la vitrina de una tienda de música."],["Brown wood, soft strings, and a sound like warm honey.","Madera marrón, cuerdas suaves y un sonido como miel tibia."],["\"The best guitar on earth,\" she tells Ana every single day.","«La mejor guitarra de la tierra», le dice a Ana cada día."]],[["The guitar costs three hundred soles, plus a set of strings.","La guitarra cuesta trescientos soles, más un juego de cuerdas."],["Quick math: fifty a week means six weeks of work.","Matemática rápida: cincuenta por semana son seis semanas de trabajo."],["She estimates the total cost and writes it on her wall.","Estima el costo total y lo escribe en su pared."],["Cheap guitars come from big factories; this one comes from hands.","Las guitarras baratas vienen de fábricas grandes; esta viene de unas manos."]],[["Saving is a quiet war, and Marisol knows her enemy.","Ahorrar es una guerra silenciosa, y Marisol conoce a su enemigo."],["Her only fear: spending it all in one happy weekend.","Su único miedo: gastarlo todo en un fin de semana feliz."],["So she keeps the money in two separate envelopes.","Así que guarda el dinero en dos sobres separados."],["One says \"Guitar\"; the other says \"Life happens\".","Uno dice «Guitarra»; el otro dice «La vida pasa»."]],[["Her cousin does not understand the plan at all.","Su primo no entiende el plan para nada."],["\"Money is for spending! Plants die; money flies!\" he says.","«¡La plata es para gastar! ¡Las plantas mueren; la plata vuela!», dice."],["Marisol usually answers him with one calm sentence.","Marisol normalmente le responde con una frase tranquila."],["\"Savings die without patience; dreams die without savings.\"","«Los ahorros mueren sin paciencia; los sueños mueren sin ahorros»."]],[["Some weeks are hard, and the envelope grows slowly.","Algunas semanas son duras, y el sobre crece despacio."],["In week four, her old shoes fell apart — hello, \"Life happens\".","En la semana cuatro, sus zapatos viejos se deshicieron — hola, «La vida pasa»."],["She never touches the guitar envelope, not even that week.","Nunca toca el sobre de la guitarra, ni siquiera esa semana."],["Discipline, she learns, is mainly love with a calendar.","La disciplina, aprende, es principalmente amor con calendario."]],[["At the shop, she often watches the customers and learns.","En la tienda, seguido observa a los clientes y aprende."],["Some people always count every sol, slowly and carefully.","Algunas personas siempre cuentan cada sol, despacio y con cuidado."],["Others never check the price and pay with tired eyes.","Otras nunca miran el precio y pagan con ojos cansados."],["Money talks, her aunt says; you decide what it says.","La plata habla, dice su tía; tú decides qué dice."]],[["Week six arrives at last, on a bright Saturday.","La semana seis llega por fin, un sábado luminoso."],["The envelope is full; the dream is not distant anymore.","El sobre está lleno; el sueño ya no es lejano."],["At the music shop, she counts the money twice, hands shaking.","En la tienda de música, cuenta el dinero dos veces, con las manos temblando."],["The guitar is slightly cheaper this month — a small miracle.","La guitarra está ligeramente más barata este mes — un pequeño milagro."]],[["That evening, the family hears her first three chords.","Esa tarde, la familia escucha sus primeros tres acordes."],["They are terrible, honestly, and everyone smiles anyway.","Son terribles, honestamente, e igual todos sonríen."],["\"Six weeks for three chords!\" laughs her cousin, impressed.","«¡Seis semanas por tres acordes!», ríe su primo, impresionado."],["\"Six weeks for a lifetime of music,\" she answers, tuning.","«Seis semanas para una vida de música», responde ella, afinando."]]],"datos":["Tiempo con <b>on / from… to / in</b>: <span class=\"frase\">on Saturdays · from nine to six · in June.</span>",null,null,"Orden con adverbios: la frecuencia va antes del verbo (<span class=\"frase\">She never touches…</span>), el modo al final (<span class=\"frase\">slowly and carefully</span>).","Negación 3.ª persona: <b>does not</b> + verbo base: <span class=\"frase\">Her cousin does not understand the plan.</span>",null,null,null,null],"dlg":[["Ana","Don Felipe, do you take cards now?","Don Felipe, ¿ya acepta tarjetas?"],["Don Felipe","Cards! Ha! At the market, cash is king.","¡Tarjetas! ¡Ja! En el mercado, el efectivo es rey."],["Ana","My father says the same thing, word for word.","Mi papá dice lo mismo, palabra por palabra."],["Don Felipe","Ernesto is a wise man, then.","Ernesto es un hombre sabio, entonces."],["Ana","But the supermarket takes cards, you know.","Pero el supermercado acepta tarjetas, ¿sabe?"],["Don Felipe","And does the supermarket save apples for you?","¿Y el supermercado te guarda manzanas?"],["Ana","Ha! No. No, it does not.","¡Ja! No. No lo hace."],["Don Felipe","Exactly. Service is my machine, girl.","Exacto. El servicio es mi máquina, muchacha."],["Ana","Have you ever paid with a card, Don Felipe?","¿Alguna vez ha pagado con tarjeta, Don Felipe?"],["Don Felipe","Once. In a big store, two years ago.","Una vez. En una tienda grande, hace dos años."],["Ana","And? How did it feel?","¿Y? ¿Qué se sintió?"],["Don Felipe","Like magic… dangerous magic. The money leaves in silence.","Como magia… magia peligrosa. La plata se va en silencio."],["Ana","What do you mean, in silence?","¿Cómo que en silencio?"],["Don Felipe","With cash, your hand feels the goodbye.","Con efectivo, tu mano siente la despedida."],["Don Felipe","With a card, you have already spent it, and you feel nothing.","Con tarjeta, ya lo gastaste, y no sientes nada."],["Ana","That is… actually a great point.","Eso es… en realidad un gran punto."],["Don Felipe","Old men have two or three good points. Not more.","Los viejos tenemos dos o tres buenos puntos. No más."],["Ana","So gold under the bed, then? Like the old days?","¿Entonces oro bajo la cama? ¿Como antes?"],["Don Felipe","Gold is pretty, but gold does not buy bread fast.","El oro es bonito, pero el oro no compra pan rápido."],["Ana","So what is your system, honestly?","Entonces, ¿cuál es su sistema, honestamente?"],["Don Felipe","Cash for the week, savings in the bank, thank God.","Efectivo para la semana, ahorros en el banco, gracias a Dios."],["Ana","The bank! You do trust the bank, then.","¡El banco! Entonces sí confía en el banco."],["Don Felipe","I trust my mattress less. It has mice.","Confío menos en mi colchón. Tiene ratones."],["Ana","Ha! Okay, one kilo of apples, please. Cash.","¡Ja! Bueno, un kilo de manzanas, por favor. Efectivo."],["Don Felipe","See? The system works. Here, the good ones.","¿Ves? El sistema funciona. Toma, las buenas."],["Ana","Thank you! Say hello to the mice.","¡Gracias! Salude a los ratones."]]},"4":{"sTitle":"Carlos's Long Shift","sTitleEs":"El turno largo de Carlos","dTitle":"The Shift Swap","dTitleEs":"El cambio de turno","paras":[[["Carlos is Marisol's older brother, nineteen years old and tall.","Carlos es el hermano mayor de Marisol, diecinueve años y alto."],["He works at the home goods shop on the main street.","Trabaja en la tienda de artículos del hogar de la calle principal."],["His shift usually starts at nine and finishes at six.","Su turno normalmente empieza a las nueve y termina a las seis."],["Today, however, is not a usual day at all.","Hoy, sin embargo, no es un día normal para nada."]],[["It is sale week, and the shop is a friendly storm.","Es semana de ofertas, y la tienda es una tormenta amistosa."],["Doña Vera, the manager, manages the chaos with a calm voice.","Doña Vera, la encargada, maneja el caos con voz tranquila."],["\"Thank God for quiet Mondays,\" she says. \"This is not one.\"","«Gracias a Dios por los lunes tranquilos», dice. «Este no es uno»."],["Everyone is moving fast; nobody is standing still.","Todos se mueven rápido; nadie se queda quieto."]],[["Right now, Carlos is demonstrating the new juice machine.","Ahora mismo, Carlos está demostrando la máquina de jugos nueva."],["He demonstrates it several times a day during sale week.","La demuestra varias veces al día durante la semana de ofertas."],["\"One button, thirty seconds, fresh juice,\" he says, smiling.","«Un botón, treinta segundos, jugo fresco», dice, sonriendo."],["A red mark on the sign shows the new price, below the old one.","Una marca roja en el letrero muestra el precio nuevo, debajo del viejo."]],[["Behind the counter, Carlos is in his element.","Detrás del mostrador, Carlos está en su elemento."],["He never loses his patience, even with difficult customers.","Nunca pierde la paciencia, ni con los clientes difíciles."],["One word defines his style: attention. He listens first.","Una palabra define su estilo: atención. Escucha primero."],["The shop takes energy; the customers bring every emotion.","La tienda exige energía; los clientes traen todas las emociones."]],[["At noon, an old man cannot find his shopping list.","Al mediodía, un señor mayor no encuentra su lista de compras."],["Carlos walks the aisles with him, item by item, slowly.","Carlos recorre los pasillos con él, artículo por artículo, despacio."],["\"You are the first person who does not hurry me,\" says the man.","«Eres la primera persona que no me apura», dice el señor."],["Small moments like this one keep Carlos in this job.","Momentos pequeños como este mantienen a Carlos en este trabajo."]],[["In the afternoon, the shop gets even busier.","Por la tarde, la tienda se pone aún más movida."],["Carlos is carrying boxes, answering questions, and fixing a shelf.","Carlos está cargando cajas, respondiendo preguntas y arreglando un estante."],["A little girl drops a glass jar; it breaks near her feet.","Una niña deja caer un frasco de vidrio; se rompe cerca de sus pies."],["Carlos arrives first with the broom: \"Nobody moves, nobody worries.\"","Carlos llega primero con la escoba: «Nadie se mueve, nadie se preocupa»."]],[["By five, his feet hurt and his voice is thin.","Para las cinco, le duelen los pies y su voz está débil."],["He has already answered the same question forty times today.","Ya ha respondido la misma pregunta cuarenta veces hoy."],["\"Where are the sale blenders?\" — \"Aisle three, on your left.\"","«¿Dónde están las licuadoras de oferta?» — «Pasillo tres, a su izquierda»."],["He says it kindly every time, like the first time.","Lo dice con amabilidad cada vez, como la primera vez."]],[["At six, Doña Vera counts the register and smiles widely.","A las seis, Doña Vera cuenta la caja y sonríe ampliamente."],["\"Best sale day since we established the shop,\" she announces.","«El mejor día de ofertas desde que fundamos la tienda», anuncia."],["\"Carlos, take the last juice from the demo machine. You earned it.\"","«Carlos, llévate el último jugo de la máquina de demostración. Te lo ganaste»."],["It is, honestly, the best juice on earth.","Es, honestamente, el mejor jugo de la tierra."]],[["Despite the long day, Carlos walks home smiling.","A pesar del día largo, Carlos camina a casa sonriendo."],["Marisol is playing her three famous chords in the kitchen.","Marisol está tocando sus tres acordes famosos en la cocina."],["\"Hard day?\" she asks. \"Long,\" he says, \"but a good one.\"","«¿Día duro?», pregunta ella. «Largo», dice él, «pero bueno»."],["Work is heavy, but it is lighter with a reason.","El trabajo pesa, pero pesa menos con una razón."]]],"datos":[null,null,"Presente continuo para lo que pasa AHORA: <span class=\"frase\">Carlos is demonstrating…</span> · <b>demonstrate</b> = demostrar/hacer una demo.","<b>in his element</b> = en su elemento (donde se siente cómodo).",null,null,"Perfecto + <b>already</b>: <span class=\"frase\">He has already answered the same question forty times.</span>",null,"<b>despite</b> = a pesar de: <span class=\"frase\">Despite the long day, Carlos walks home smiling.</span>"],"dlg":[["Carlos","Rosa, can I ask you a big favor?","Rosa, ¿puedo pedirte un gran favor?"],["Rosa","That depends on the size of \"big\".","Depende del tamaño de ese «gran»."],["Carlos","Can we swap shifts on Friday?","¿Podemos cambiar turnos el viernes?"],["Rosa","This Friday? Let me check the calendar.","¿Este viernes? Déjame ver el calendario."],["Carlos","I work in the morning; you work in the evening.","Yo trabajo en la mañana; tú en la tarde."],["Rosa","And you want my evening shift? Why?","¿Y quieres mi turno de la tarde? ¿Por qué?"],["Carlos","My sister has her first small concert at noon.","Mi hermana tiene su primer pequeño concierto al mediodía."],["Rosa","Marisol? The girl of the three chords?","¿Marisol? ¿La chica de los tres acordes?"],["Carlos","She knows seven chords now. It is serious.","Ya sabe siete acordes. Es serio."],["Rosa","Ha! Okay, seven chords change everything.","¡Ja! Bueno, siete acordes lo cambian todo."],["Rosa","But I have a dentist visit at five on Friday.","Pero tengo dentista a las cinco el viernes."],["Carlos","The evening shift starts at two, not at five.","El turno de tarde empieza a las dos, no a las cinco."],["Rosa","Right… and does Doña Vera allow swaps in sale week?","Cierto… ¿y Doña Vera permite cambios en semana de ofertas?"],["Carlos","She does not allow them WITHOUT a note.","No los permite SIN una nota."],["Carlos","So I already wrote the note. Two signatures, and done.","Así que ya escribí la nota. Dos firmas, y listo."],["Rosa","You have already written it?! You were sure about me!","¡¿Ya la escribiste?! ¡Estabas seguro de mí!"],["Carlos","I was hopeful. There is a difference.","Estaba esperanzado. Hay una diferencia."],["Rosa","Okay, hopeful man. What else do I get?","Bueno, hombre esperanzado. ¿Qué más gano yo?"],["Carlos","My Saturday morning shift next week?","¿Mi turno del sábado en la mañana la próxima semana?"],["Rosa","Sold. I hate Saturday mornings, honestly.","Vendido. Odio los sábados por la mañana, honestamente."],["Carlos","Everyone does. That is why it works.","Todos los odian. Por eso funciona."],["Rosa","One condition: video of the concert, please.","Una condición: video del concierto, por favor."],["Carlos","Deal. Front row, full concert, seven chords.","Trato. Primera fila, concierto completo, siete acordes."],["Rosa","And tell her: next year, the big stage.","Y dile: el próximo año, el escenario grande."],["Carlos","She says the kitchen IS the big stage.","Ella dice que la cocina ES el escenario grande."],["Rosa","Ha! Sign the note, artist's brother.","¡Ja! Firma la nota, hermano de artista."]]}};

    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
<script id="jecback">
window.jecGoBack=function(){ location.href="https://jucum-english-center.netlify.app/"; };
</script>
