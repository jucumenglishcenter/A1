        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }

        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }

        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

lse,"es":"El mejor cuarto no siempre es el más grande.","errorWord":"the most big","correctWord":"the biggest","errorType":"“most” con adjetivo corto","explanation":"Los adjetivos cortos usan -est."}],"clue":"big → the biggest","clueExplain":"consonante-vocal-consonante dobla la última letra.","correctReason":"“The biggest”: ortografía correcta del superlativo.","hint":"Cuenta las letras g."},{"badge":"🌧️ El peor momento","options":[{"text":"Traffic in the rain is the worst moment of the day.","correct":true,"es":"El tráfico con lluvia es el peor momento del día."},{"text":"Traffic in the rain is the baddest moment of the day.","correct":false,"es":"El tráfico con lluvia es el peor momento del día.","errorWord":"the baddest","correctWord":"the worst","errorType":"Irregular","explanation":"“Bad” es irregular: the worst."},{"text":"Traffic in the rain is the most bad moment of the day.","correct":false,"es":"El tráfico con lluvia es el peor momento del día.","errorWord":"the most bad","correctWord":"the worst","errorType":"Irregular","explanation":"“Bad” no usa “most”."}],"clue":"bad → the worst","clueExplain":"irregular, como good → the best.","correctReason":"“The worst moment”: superlativo irregular correcto.","hint":"Recuerda los tres irregulares del tema."},{"badge":"💰 La opción más cara","options":[{"text":"A moto is the most expensive option.","correct":true,"es":"La moto es la opción más cara."},{"text":"A moto is the expensivest option.","correct":false,"es":"La moto es la opción más cara.","errorWord":"the expensivest","correctWord":"the most expensive","errorType":"-est con adjetivo largo","explanation":"Los adjetivos largos usan “the most”."},{"text":"A moto is the more expensive option.","correct":false,"es":"La moto es la opción más cara.","errorWord":"the more expensive","correctWord":"the most expensive","errorType":"Comparativo por superlativo","explanation":"“More” compara dos; aquí hablamos de todas las opciones."}],"clue":"largo → the most","clueExplain":"tres sílabas piden “the most”.","correctReason":"“The most expensive”: forma larga correcta.","hint":"Cuenta las sílabas del adjetivo."},{"badge":"⛪ El camino más corto","options":[{"text":"This is the shortest way to the clinic.","correct":true,"es":"Este es el camino más corto a la clínica."},{"text":"This is the most short way to the clinic.","correct":false,"es":"Este es el camino más corto a la clínica.","errorWord":"the most short","correctWord":"the shortest","errorType":"“most” con adjetivo corto","explanation":"“Short” es de una sílaba: shortest."},{"text":"This is shortest way to the clinic.","correct":false,"es":"Este es el camino más corto a la clínica.","errorWord":"shortest","correctWord":"the shortest","errorType":"Falta “the”","explanation":"Sin “the” el superlativo queda incompleto."}],"clue":"the + short + est","clueExplain":"artículo obligatorio.","correctReason":"“The shortest way”: artículo y terminación correctos.","hint":"Mira el artículo."},{"badge":"🚌 El mejor método","options":[{"text":"The bus is the best method for a heavy bag.","correct":true,"es":"El bus es el mejor método para una bolsa pesada."},{"text":"The bus is a best method for a heavy bag.","correct":false,"es":"El bus es el mejor método para una bolsa pesada.","errorWord":"a best","correctWord":"the best","errorType":"Artículo equivocado","explanation":"El superlativo va con “the”, nunca con “a”."},{"text":"The bus is the best method than the moto.","correct":false,"es":"El bus es el mejor método para una bolsa pesada.","errorWord":"than the moto","correctWord":"for a heavy bag","errorType":"“than” con superlativo","explanation":"“Than” pertenece al comparativo, no al superlativo."}],"clue":"the best + in/of/for","clueExplain":"el superlativo no se cierra con “than”.","correctReason":"“The best method”: artículo correcto y sin “than”.","hint":"Revisa el artículo y la palabra final."},{"badge":"🔊 La calle más ruidosa","options":[{"text":"The main avenue is the noisiest street in this section.","correct":true,"es":"La avenida principal es la calle más ruidosa de esta sección."},{"text":"The main avenue is the noisyest street in this section.","correct":false,"es":"La avenida principal es la calle más ruidosa de esta sección.","errorWord":"the noisyest","correctWord":"the noisiest","errorType":"Ortografía y → i","explanation":"La “y” final cambia a “i” antes de -est."},{"text":"The main avenue is noisiest street in this section.","correct":false,"es":"La avenida principal es la calle más ruidosa de esta sección.","errorWord":"noisiest","correctWord":"the noisiest","errorType":"Falta “the”","explanation":"Todo superlativo necesita “the”."}],"clue":"noisy → the noisiest","clueExplain":"y → i + est.","correctReason":"“The noisiest”: ortografía y artículo correctos.","hint":"Mira la letra antes de -est."},{"badge":"🏥 El lugar más cercano","options":[{"text":"The clinic is the nearest place to the church.","correct":true,"es":"La clínica es el lugar más cercano a la iglesia."},{"text":"The clinic is the nearer place to the church.","correct":false,"es":"La clínica es el lugar más cercano a la iglesia.","errorWord":"the nearer","correctWord":"the nearest","errorType":"Comparativo por superlativo","explanation":"“Nearer” compara dos lugares; aquí es el más cercano de todos."},{"text":"The clinic is the most near place to the church.","correct":false,"es":"La clínica es el lugar más cercano a la iglesia.","errorWord":"the most near","correctWord":"the nearest","errorType":"“most” con adjetivo corto","explanation":"“Near” es corto: nearest."}],"clue":"near → the nearest","clueExplain":"-er compara dos, -est compara todos.","correctReason":"“The nearest place”: superlativo correcto.","hint":"¿Compara dos lugares o todos?"},{"badge":"👀 La mejor vista","options":[{"text":"That is the best sight in our section.","correct":true,"es":"Esa es la mejor vista de nuestra sección."},{"text":"That is the best sight than our section.","correct":false,"es":"Esa es la mejor vista de nuestra sección.","errorWord":"than","correctWord":"in","errorType":"“than” con superlativo","explanation":"El superlativo cierra con “in/of” + grupo."},{"text":"That is best sight in our section.","correct":false,"es":"Esa es la mejor vista de nuestra sección.","errorWord":"best","correctWord":"the best","errorType":"Falta “the”","explanation":"Sin artículo el superlativo no funciona."}],"clue":"the best + in + grupo","clueExplain":"“in our section” dice dónde se compara.","correctReason":"“The best sight in our section”: cierre correcto.","hint":"Mira la palabra que une con el grupo."},{"badge":"⏱️ El viaje más largo","options":[{"text":"Fifty minutes is the longest trip of the week.","correct":true,"es":"Cincuenta minutos es el viaje más largo de la semana."},{"text":"Fifty minutes is the most long trip of the week.","correct":false,"es":"Cincuenta minutos es el viaje más largo de la semana.","errorWord":"the most long","correctWord":"the longest","errorType":"“most” con adjetivo corto","explanation":"“Long” es corto: longest."},{"text":"Fifty minutes is the longer trip of the week.","correct":false,"es":"Cincuenta minutos es el viaje más largo de la semana.","errorWord":"the longer","correctWord":"the longest","errorType":"Comparativo por superlativo","explanation":"“Longer” compara dos viajes, no toda la semana."}],"clue":"long → the longest","clueExplain":"de toda la semana → superlativo.","correctReason":"“The longest trip”: superlativo correcto.","hint":"¿Dos viajes o todos los de la semana?"},{"badge":"⚓ El punto más lejano","options":[{"text":"The port is the farthest point of the city.","correct":true,"es":"El puerto es el punto más lejano de la ciudad."},{"text":"The port is the farest point of the city.","correct":false,"es":"El puerto es el punto más lejano de la ciudad.","errorWord":"the farest","correctWord":"the farthest","errorType":"Irregular","explanation":"“Far” es irregular: farthest (o furthest)."},{"text":"The port is the most far point of the city.","correct":false,"es":"El puerto es el punto más lejano de la ciudad.","errorWord":"the most far","correctWord":"the farthest","errorType":"Irregular","explanation":"“Far” nunca usa “most”."}],"clue":"far → the farthest","clueExplain":"irregular, como good y bad.","correctReason":"“The farthest point”: irregular correcto.","hint":"Recuerda los tres irregulares."},{"badge":"🚶 La opción más barata","options":[{"text":"Walking is the cheapest option.","correct":true,"es":"Caminar es la opción más barata."},{"text":"Walking is cheapest option.","correct":false,"es":"Caminar es la opción más barata.","errorWord":"cheapest","correctWord":"the cheapest","errorType":"Falta “the”","explanation":"El superlativo pide “the”."},{"text":"Walking is the cheapest option than the bus.","correct":false,"es":"Caminar es la opción más barata.","errorWord":"than the bus","correctWord":"(sin “than”)","errorType":"“than” con superlativo","explanation":"“Than” es del comparativo: “cheaper than the bus”."}],"clue":"the cheapest","clueExplain":"artículo sí, “than” no.","correctReason":"“The cheapest option”: superlativo limpio.","hint":"Revisa el inicio y el final de la oración."},{"badge":"🤫 De los tres cuartos","options":[{"text":"Of the three rooms, this one is the quietest.","correct":true,"es":"De los tres cuartos, este es el más tranquilo."},{"text":"Of the three rooms, this one is the quieter.","correct":false,"es":"De los tres cuartos, este es el más tranquilo.","errorWord":"the quieter","correctWord":"the quietest","errorType":"Comparativo por superlativo","explanation":"Con tres o más se usa el superlativo."},{"text":"Of the three rooms, this one is quietest.","correct":false,"es":"De los tres cuartos, este es el más tranquilo.","errorWord":"quietest","correctWord":"the quietest","errorType":"Falta “the”","explanation":"Falta el artículo “the”."}],"clue":"tres o más → the -est","clueExplain":"dos cosas → -er than.","correctReason":"“The quietest”: superlativo entre tres cuartos.","hint":"Cuenta cuántos cuartos se comparan."},{"badge":"🎉 La clase más emocionante","options":[{"text":"This is the most exciting class of the year.","correct":true,"es":"Esta es la clase más emocionante del año."},{"text":"This is the excitingest class of the year.","correct":false,"es":"Esta es la clase más emocionante del año.","errorWord":"the excitingest","correctWord":"the most exciting","errorType":"-est con adjetivo largo","explanation":"“Exciting” usa “the most”."},{"text":"This is the more exciting class of the year.","correct":false,"es":"Esta es la clase más emocionante del año.","errorWord":"the more exciting","correctWord":"the most exciting","errorType":"Comparativo por superlativo","explanation":"“More” compara dos; de todo el año es “the most”."}],"clue":"largo → the most","clueExplain":"“most” para adjetivos de 2+ sílabas.","correctReason":"“The most exciting class”: forma larga correcta.","hint":"¿Compara dos clases o todo el año?"}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
