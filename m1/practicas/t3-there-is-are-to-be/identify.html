        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }

    <script>
    const quizData = [{"badge":"🍵 La mesa","options":[{"text":"There are two cups on the table.","correct":true,"es":"Hay dos tazas en la mesa."},{"text":"There is two cups on the table.","correct":false,"es":"Hay dos tazas en la mesa.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Two cups” es plural: “there are”."},{"text":"There are a cup on the table.","correct":false,"es":"Hay una taza en la mesa.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“A cup” es singular: “there is”."}],"clue":"there is/are","clueExplain":"is = uno (he/she/it) · are = varios (we/you/they) · there is + singular · there are + plural.","correctReason":"“Two cups” (plural) pide “there are”.","hint":"Cuenta lo que hay ANTES de elegir: ¿uno o varios?"},{"badge":"⏰ Las seis","options":[{"text":"Ana is awake at six.","correct":true,"es":"Ana está despierta a las seis."},{"text":"Ana are awake at six.","correct":false,"es":"Ana está despierta a las seis.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"Ana es una sola persona (she): “is”."},{"text":"Ana am awake at six.","correct":false,"es":"Ana está despierta a las seis.","errorWord":"am","correctWord":"is","errorType":"Concordancia","explanation":"“Am” solo acompaña a “I”. Con Ana (she) va “is”."}],"clue":"is = una persona","clueExplain":"is = uno (he/she/it) · are = varios (we/you/they) · there is + singular · there are + plural.","correctReason":"Ana = she → “is”.","hint":"¿Qué pronombre reemplaza a “Ana”? Ese decide el verbo."},{"badge":"🌬 Afuera","options":[{"text":"There is fresh air outside.","correct":true,"es":"Hay aire fresco afuera."},{"text":"There are fresh air outside.","correct":false,"es":"Hay aire fresco afuera.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“Air” es incontable: funciona como singular → “there is”."},{"text":"There are a fresh air outside.","correct":false,"es":"Hay un aire fresco afuera.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“A fresh air” sería singular; además “air” no se cuenta: “there is fresh air”."}],"clue":"incontable = singular","clueExplain":"los incontables (air, water, milk) van con “there is”, como si fueran uno.","correctReason":"“Air” no se cuenta: se trata como singular → “there is”.","hint":"“Aire” no se cuenta de a uno… ¿entonces qué forma le toca?"},{"badge":"🏠 La familia","options":[{"text":"Dad and Ana are busy now.","correct":true,"es":"Papá y Ana están ocupados ahora."},{"text":"I is ready now.","correct":false,"es":"Estoy listo ahora.","errorWord":"is","correctWord":"am","errorType":"Concordancia","explanation":"Con “I” siempre va “am”: “I am ready”."},{"text":"There is some eggs here.","correct":false,"es":"Hay algunos huevos aquí.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Some eggs” es plural: “there are”."}],"clue":"sujeto → verbo","clueExplain":"cada oración tiene su propio sujeto; el verbo debe concordar con ÉL.","correctReason":"“Dad and Ana” son dos personas → “are”.","hint":"Tres oraciones, tres sujetos. Revisa la pareja sujeto-verbo de cada una."},{"badge":"🎒 Listos","options":[{"text":"I am ready for school.","correct":true,"es":"Estoy listo para la escuela."},{"text":"I is ready for school.","correct":false,"es":"Estoy listo para la escuela.","errorWord":"is","correctWord":"am","errorType":"Concordancia","explanation":"“I” tiene su propia forma: “am”."},{"text":"I are ready for school.","correct":false,"es":"Estoy listo para la escuela.","errorWord":"are","correctWord":"am","errorType":"Concordancia","explanation":"“Are” es de you/we/they. Con “I” va “am”."}],"clue":"I am","clueExplain":"“I” va siempre con “am”; is y are pertenecen a otros sujetos.","correctReason":"“I am” es la única pareja válida.","hint":"“I” es un sujeto consentido: tiene verbo propio."},{"badge":"🥚 La refri","options":[{"text":"There are some eggs in the fridge.","correct":true,"es":"Hay algunos huevos en la refri."},{"text":"There is some eggs in the fridge.","correct":false,"es":"Hay algunos huevos en la refri.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Some eggs” es plural: “there are”."},{"text":"There are some egg in the fridge.","correct":false,"es":"Hay algo de huevo en la refri.","errorWord":"egg","correctWord":"eggs","errorType":"Singular con “are”","explanation":"“Are” pide plural: “some eggs”."}],"clue":"there are + plural","clueExplain":"is = uno (he/she/it) · are = varios (we/you/they) · there is + singular · there are + plural.","correctReason":"“Some eggs” (plural) concuerda con “there are”.","hint":"Una opción falla en el verbo… y otra falla en el sustantivo. Mira ambos lados."},{"badge":"🍵 El té","options":[{"text":"The tea is very hot.","correct":true,"es":"El té está muy caliente."},{"text":"The cups is empty.","correct":false,"es":"Las tazas están vacías.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“The cups” es plural: “are empty”."},{"text":"You is early today.","correct":false,"es":"Llegas temprano hoy.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"Con “you” siempre va “are”."}],"clue":"sujeto → verbo","clueExplain":"el verbo “to be” cambia según el sujeto de CADA oración.","correctReason":"“The tea” es singular → “is”.","hint":"No busques la oración “bonita”: busca la pareja sujeto-verbo correcta."},{"badge":"🌅 Temprano","options":[{"text":"You are early today.","correct":true,"es":"Llegas temprano hoy."},{"text":"You is early today.","correct":false,"es":"Llegas temprano hoy.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“You” va con “are”, sea una persona o varias."},{"text":"You be early today.","correct":false,"es":"Llegas temprano hoy.","errorWord":"be","correctWord":"are","errorType":"Verbo sin conjugar","explanation":"“Be” es la forma base; aquí se conjuga: “you are”."}],"clue":"you are","clueExplain":"“you” usa “are” siempre; “be” sin conjugar solo va en órdenes.","correctReason":"“You are early” conjuga bien el verbo.","hint":"Una opción dejó el verbo “en crudo”, sin conjugar."},{"badge":"🕐 El reloj","options":[{"text":"There is a clock in the kitchen.","correct":true,"es":"Hay un reloj en la cocina."},{"text":"There are a clock in the kitchen.","correct":false,"es":"Hay un reloj en la cocina.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“A clock” es singular: “there is”."},{"text":"There is a clocks in the kitchen.","correct":false,"es":"Hay unos relojes en la cocina.","errorWord":"clocks","correctWord":"clock","errorType":"a + plural","explanation":"“A” acompaña singular: “a clock”."}],"clue":"there is + singular","clueExplain":"is = uno (he/she/it) · are = varios (we/you/they) · there is + singular · there are + plural.","correctReason":"“A clock” (uno) pide “there is”.","hint":"Revisa las dos piezas: el verbo Y el sustantivo que lo acompaña."},{"badge":"🪟 El cuarto","options":[{"text":"There are two windows in the room.","correct":true,"es":"Hay dos ventanas en el cuarto."},{"text":"Ana and her father is happy.","correct":false,"es":"Ana y su padre están felices.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Ana and her father” son dos → “are”."},{"text":"There is many cups here.","correct":false,"es":"Hay muchas tazas aquí.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Many cups” es plural: “there are”."}],"clue":"¿uno o varios?","clueExplain":"cuenta el sujeto de cada oración: esa cantidad elige el verbo.","correctReason":"“Two windows” (plural) va con “there are”.","hint":"Suma: ¿cuántos son en cada oración? El número manda."},{"badge":"😊 Felices","options":[{"text":"Ana and her father are happy.","correct":true,"es":"Ana y su padre están felices."},{"text":"Ana and her father is happy.","correct":false,"es":"Ana y su padre están felices.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"Dos personas juntas = plural → “are”."},{"text":"Ana and her father be happy.","correct":false,"es":"Ana y su padre están felices.","errorWord":"be","correctWord":"are","errorType":"Verbo sin conjugar","explanation":"Falta conjugar: “are happy”."}],"clue":"X and Y = plural","clueExplain":"dos sujetos unidos con “and” funcionan como “they”: “are”.","correctReason":"“Ana and her father” = they → “are”.","hint":"“And” une a dos… ¿y dos personas cuentan como uno o como varios?"},{"badge":"🚪 Mi cuarto","options":[{"text":"There is one window in my room.","correct":true,"es":"Hay una ventana en mi cuarto."},{"text":"There are one window in my room.","correct":false,"es":"Hay una ventana en mi cuarto.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“One window” es singular: “there is”."},{"text":"There is one windows in my room.","correct":false,"es":"Hay unas ventanas en mi cuarto.","errorWord":"windows","correctWord":"window","errorType":"“One” + plural","explanation":"“One” pide singular: “one window”."}],"clue":"there is + singular","clueExplain":"is = uno (he/she/it) · are = varios (we/you/they) · there is + singular · there are + plural.","correctReason":"“One window” (uno) concuerda con “there is”.","hint":"“One” te dice la cantidad exacta. Haz que todo concuerde con ella."},{"badge":"🍳 La cocina","options":[{"text":"We are in the kitchen now.","correct":true,"es":"Estamos en la cocina ahora."},{"text":"There is three chairs here.","correct":false,"es":"Hay tres sillas aquí.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Three chairs” es plural: “there are”."},{"text":"The eggs is on the table.","correct":false,"es":"Los huevos están en la mesa.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“The eggs” es plural: “are”."}],"clue":"sujeto → verbo","clueExplain":"revisa el sujeto de cada oración: dos de ellas no concuerdan.","correctReason":"“We” (nosotros) va con “are”.","hint":"Tres escenas de la cocina; solo una pareja sujeto-verbo es válida."},{"badge":"📚 El escritorio","options":[{"text":"There are some books on the desk.","correct":true,"es":"Hay algunos libros en el escritorio."},{"text":"There is some books on the desk.","correct":false,"es":"Hay algunos libros en el escritorio.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“Some books” es plural: “there are”."},{"text":"There are a books on the desk.","correct":false,"es":"Hay unos libros en el escritorio.","errorWord":"a","correctWord":"some","errorType":"a + plural","explanation":"“A” no va con plural: “some books”."}],"clue":"there are + plural","clueExplain":"is = uno (he/she/it) · are = varios (we/you/they) · there is + singular · there are + plural.","correctReason":"“Some books” (plural) pide “there are”.","hint":"El verbo y el articulito deben apuntar al mismo número."},{"badge":"🌄 La mañana","options":[{"text":"It is cold in the morning.","correct":true,"es":"Hace frío en la mañana."},{"text":"The windows is open.","correct":false,"es":"Las ventanas están abiertas.","errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"“The windows” es plural: “are open”."},{"text":"There are a clock here.","correct":false,"es":"Hay un reloj aquí.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“A clock” es singular: “there is”."}],"clue":"sujeto → verbo","clueExplain":"cada oración por separado: ¿su sujeto es uno o varios?","correctReason":"“It” (el clima) es singular → “is”.","hint":"El clima en inglés usa un sujeto pequeñito y singular."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
