    <style>
        :root {

        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }

        .fb-icon { font-size:1.6rem; }

        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }

        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }

        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }
        .sent-option { border:2.5px solid #E5E7EB; border-radius:14px; padding:1rem 1.1rem; cursor:pointer; transition:all .2s; background:white; text-align:left; font-family:'Nunito',sans-serif; display:flex; gap:0.75rem; align-items:flex-start; width:100%; }
        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

    <script>
    const quizData = [{"badge":"⏰ La alarma","options":[{"text":"Ana was sleeping when the alarm rang.","correct":true,"es":"Ana estaba durmiendo cuando sonó la alarma."},{"text":"Ana were sleeping when the alarm rang.","correct":false,"es":"Ana estaba durmiendo cuando sonó la alarma.","errorWord":"were","correctWord":"was","errorType":"Concordancia was/were","explanation":"Ana es una sola (she): “was”."},{"text":"Ana was sleep when the alarm rang.","correct":false,"es":"Ana estaba durmiendo cuando sonó la alarma.","errorWord":"sleep","correctWord":"sleeping","errorType":"Falta -ing","explanation":"Tras was/were la acción va en -ing: “sleeping”."}],"clue":"was/were + -ing","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Was” concuerda con Ana y “sleeping” lleva su -ing.","hint":"Busca las tres piezas: was/were según el sujeto · verbo-ing · interrupción en past simple."},{"badge":"🍳 El desayuno","options":[{"text":"They were eating breakfast when Ernesto arrived.","correct":true,"es":"Estaban desayunando cuando llegó Ernesto."},{"text":"They was eating breakfast when Ernesto arrived.","correct":false,"es":"Estaban desayunando cuando llegó Ernesto.","errorWord":"was","correctWord":"were","errorType":"Concordancia was/were","explanation":"“They” es plural: “were”."},{"text":"They were eating breakfast when Ernesto arriving.","correct":false,"es":"Estaban desayunando cuando llegó Ernesto.","errorWord":"arriving","correctWord":"arrived","errorType":"Interrupción en -ing","explanation":"La acción que interrumpe va en past simple: “arrived”."}],"clue":"interrupción = past simple","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Were” (they) + “eating” + “arrived” (interrupción): todo en su lugar.","hint":"La acción corta que corta la escena no lleva -ing."},{"badge":"🍉 La fruta","options":[{"text":"Her father was cutting fruit when Ana entered.","correct":true,"es":"Su padre estaba cortando fruta cuando Ana entró."},{"text":"Her father was cut fruit when Ana entered.","correct":false,"es":"Su padre estaba cortando fruta cuando Ana entró.","errorWord":"cut","correctWord":"cutting","errorType":"Falta -ing","explanation":"Tras “was” la acción en progreso va en -ing: “cutting”."},{"text":"Her father were cutting fruit when Ana entered.","correct":false,"es":"Su padre estaba cortando fruta cuando Ana entró.","errorWord":"were","correctWord":"was","errorType":"Concordancia was/were","explanation":"“Her father” es uno (he): “was”."}],"clue":"was/were + -ing","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Was cutting” forma bien el continuo y “entered” la interrupción.","hint":"Busca las tres piezas: was/were según el sujeto · verbo-ing · interrupción en past simple."},{"badge":"📞 El teléfono","options":[{"text":"Delia was sleeping when the phone rang.","correct":true,"es":"Delia estaba durmiendo cuando sonó el teléfono."},{"text":"Delia is sleeping when the phone rang.","correct":false,"es":"Delia está durmiendo cuando sonó el teléfono.","errorWord":"is","correctWord":"was","errorType":"Presente en narración pasada","explanation":"“Rang” sitúa la escena en pasado: “was sleeping”."},{"text":"Delia was sleeping when the phone ringing.","correct":false,"es":"Delia estaba durmiendo cuando sonó el teléfono.","errorWord":"ringing","correctWord":"rang","errorType":"Interrupción en -ing","explanation":"La interrupción va en past simple: “rang”."}],"clue":"todo en pasado","clueExplain":"la narración es pasada: nada queda en presente ni la interrupción en -ing.","correctReason":"“Was sleeping … rang”: continuo + interrupción correctos.","hint":"Un verbo se quedó en presente en una opción; en otra, la interrupción quedó “larga”."},{"badge":"🌧 La lluvia","options":[{"text":"While the rain was falling, Ana read her book.","correct":true,"es":"Mientras caía la lluvia, Ana leyó su libro."},{"text":"While the rain was falling, Ana readed her book.","correct":false,"es":"Mientras caía la lluvia, Ana leyó su libro.","errorWord":"readed","correctWord":"read","errorType":"Pasado irregular","explanation":"“Read” es irregular: su pasado se escribe igual, “read”."},{"text":"While the rain was fall, Ana read her book.","correct":false,"es":"Mientras caía la lluvia, Ana leyó su libro.","errorWord":"fall","correctWord":"falling","errorType":"Falta -ing","explanation":"Tras “was”, la acción larga va en -ing: “falling”."}],"clue":"while + acción larga","clueExplain":"“while” presenta la acción larga (continuo); la otra acción va en past simple.","correctReason":"“Was falling” (larga) + “read” (pasado irregular): correcto.","hint":"Ojo con los verbos irregulares: no todos aceptan -ed."},{"badge":"🔧 El cajón","options":[{"text":"Ernesto was fixing the drawer while Ana was reading.","correct":true,"es":"Ernesto arreglaba el cajón mientras Ana leía."},{"text":"Ernesto was fixed the drawer while Ana was reading.","correct":false,"es":"Ernesto arreglaba el cajón mientras Ana leía.","errorWord":"fixed","correctWord":"fixing","errorType":"Falta -ing","explanation":"Tras “was” va -ing: “fixing”."},{"text":"Ernesto was fixing the drawer while Ana was read.","correct":false,"es":"Ernesto arreglaba el cajón mientras Ana leía.","errorWord":"read","correctWord":"reading","errorType":"Falta -ing","explanation":"La segunda acción larga también va en -ing: “reading”."}],"clue":"dos acciones largas","clueExplain":"con “while” pueden ir DOS acciones largas: ambas en was/were + -ing.","correctReason":"Ambas acciones llevan was + -ing: paralelas y correctas.","hint":"Aquí hay dos escenas al mismo tiempo. Revisa el -ing en las dos."},{"badge":"⚽ Los niños","options":[{"text":"The kids were playing outside when the rain started.","correct":true,"es":"Los niños jugaban afuera cuando empezó la lluvia."},{"text":"The kids was playing outside when the rain started.","correct":false,"es":"Los niños jugaban afuera cuando empezó la lluvia.","errorWord":"was","correctWord":"were","errorType":"Concordancia was/were","explanation":"“The kids” es plural: “were”."},{"text":"The kids were play outside when the rain started.","correct":false,"es":"Los niños jugaban afuera cuando empezó la lluvia.","errorWord":"play","correctWord":"playing","errorType":"Falta -ing","explanation":"Tras “were” va -ing: “playing”."}],"clue":"was/were + -ing","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Were” (kids, plural) + “playing”: continuo bien formado.","hint":"Busca las tres piezas: was/were según el sujeto · verbo-ing · interrupción en past simple."},{"badge":"💡 La luz","options":[{"text":"When the lights went out, they were eating dinner.","correct":true,"es":"Cuando se fue la luz, estaban cenando."},{"text":"When the lights went out, they was eating dinner.","correct":false,"es":"Cuando se fue la luz, estaban cenando.","errorWord":"was","correctWord":"were","errorType":"Concordancia was/were","explanation":"“They” usa “were”."},{"text":"When the lights go out, they were eating dinner.","correct":false,"es":"Cuando se va la luz, estaban cenando.","errorWord":"go","correctWord":"went","errorType":"Presente en narración pasada","explanation":"Toda la escena es pasada: “went out”."}],"clue":"todo en pasado","clueExplain":"ningún verbo puede quedarse en presente dentro de una narración pasada.","correctReason":"“Went out” + “were eating”: los dos tiempos correctos.","hint":"Lee cada verbo y pregúntale: ¿ya estás en pasado?"},{"badge":"📖 La lectura","options":[{"text":"Ana was reading her book when the phone rang.","correct":true,"es":"Ana leía su libro cuando sonó el teléfono."},{"text":"Ana was reading her book when the phone ringing.","correct":false,"es":"Ana leía su libro cuando sonó el teléfono.","errorWord":"ringing","correctWord":"rang","errorType":"Interrupción en -ing","explanation":"La interrupción va en past simple: “rang”."},{"text":"Ana were reading her book when the phone rang.","correct":false,"es":"Ana leía su libro cuando sonó el teléfono.","errorWord":"were","correctWord":"was","errorType":"Concordancia was/were","explanation":"Ana (she) va con “was”."}],"clue":"interrupción = past simple","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Was reading … rang”: continuo e interrupción en su forma.","hint":"La campanada del teléfono es corta: ¿qué tiempo le toca?"},{"badge":"📻 La radio","options":[{"text":"The radio was playing softly while Delia slept.","correct":true,"es":"La radio sonaba bajito mientras Delia dormía."},{"text":"The radio were playing softly while Delia slept.","correct":false,"es":"La radio sonaba bajito mientras Delia dormía.","errorWord":"were","correctWord":"was","errorType":"Concordancia was/were","explanation":"“The radio” es una cosa (it): “was”."},{"text":"The radio was playing softly while Delia sleeped.","correct":false,"es":"La radio sonaba bajito mientras Delia dormía.","errorWord":"sleeped","correctWord":"slept","errorType":"Pasado irregular","explanation":"“Sleep” es irregular: su pasado es “slept”."}],"clue":"irregulares sin -ed","clueExplain":"los verbos irregulares tienen pasado propio: sleep→slept, ring→rang, read→read.","correctReason":"“Was” (the radio) y “slept” (irregular): correcto.","hint":"Un verbo intentó ponerse -ed sin permiso."},{"badge":"🍵 La visita","options":[{"text":"She was drinking tea when Ernesto opened the door.","correct":true,"es":"Ella tomaba té cuando Ernesto abrió la puerta."},{"text":"She was drink tea when Ernesto opened the door.","correct":false,"es":"Ella tomaba té cuando Ernesto abrió la puerta.","errorWord":"drink","correctWord":"drinking","errorType":"Falta -ing","explanation":"Tras “was” va -ing: “drinking”."},{"text":"She was drinking tea when Ernesto opens the door.","correct":false,"es":"Ella tomaba té cuando Ernesto abre la puerta.","errorWord":"opens","correctWord":"opened","errorType":"Presente en narración pasada","explanation":"La interrupción también es pasada: “opened”."}],"clue":"todo en pasado","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Was drinking” + “opened”: continuo e interrupción correctos.","hint":"Revisa las dos mitades de la oración por separado."},{"badge":"💧 El agua","options":[{"text":"While they were cooking, the water stopped suddenly.","correct":true,"es":"Mientras cocinaban, el agua se cortó de repente."},{"text":"While they were cooking, the water stops suddenly.","correct":false,"es":"Mientras cocinaban, el agua se corta de repente.","errorWord":"stops","correctWord":"stopped","errorType":"Presente en narración pasada","explanation":"La escena es pasada: “stopped”."},{"text":"While they was cooking, the water stopped suddenly.","correct":false,"es":"Mientras cocinaban, el agua se cortó de repente.","errorWord":"was","correctWord":"were","errorType":"Concordancia was/were","explanation":"“They” va con “were”."}],"clue":"todo en pasado","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Were cooking” + “stopped”: concordancia y tiempos correctos.","hint":"Un verbo se escapó al presente en una de las opciones."},{"badge":"🚶‍♀️ Camino a casa","options":[{"text":"Ana and Delia were walking home when it started to rain.","correct":true,"es":"Ana y Delia caminaban a casa cuando empezó a llover."},{"text":"Ana and Delia was walking home when it started to rain.","correct":false,"es":"Ana y Delia caminaban a casa cuando empezó a llover.","errorWord":"was","correctWord":"were","errorType":"Concordancia was/were","explanation":"Dos personas = plural: “were”."},{"text":"Ana and Delia were walking home when it starting to rain.","correct":false,"es":"Ana y Delia caminaban a casa cuando empezó a llover.","errorWord":"starting","correctWord":"started","errorType":"Interrupción en -ing","explanation":"La interrupción va en past simple: “started”."}],"clue":"X and Y = were","clueExplain":"dos sujetos con “and” son plural: were + -ing; la interrupción, en past simple.","correctReason":"“Were walking” (dos personas) + “started”: correcto.","hint":"Cuenta los sujetos antes de mirar el verbo."},{"badge":"🐱 El gato","options":[{"text":"The cat was sleeping on the sofa when Ana arrived.","correct":true,"es":"El gato dormía en el sofá cuando llegó Ana."},{"text":"The cat was sleep on the sofa when Ana arrived.","correct":false,"es":"El gato dormía en el sofá cuando llegó Ana.","errorWord":"sleep","correctWord":"sleeping","errorType":"Falta -ing","explanation":"Tras “was” va -ing: “sleeping”."},{"text":"The cat was sleeping on the sofa when Ana arrives.","correct":false,"es":"El gato dormía en el sofá cuando llega Ana.","errorWord":"arrives","correctWord":"arrived","errorType":"Presente en narración pasada","explanation":"La llegada también es pasada: “arrived”."}],"clue":"was/were + -ing","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Was sleeping … arrived”: las dos piezas en su tiempo.","hint":"Busca las tres piezas: was/were según el sujeto · verbo-ing · interrupción en past simple."},{"badge":"🎬 La película","options":[{"text":"They were watching a movie when the lights went out.","correct":true,"es":"Veían una película cuando se fue la luz."},{"text":"They was watching a movie when the lights went out.","correct":false,"es":"Veían una película cuando se fue la luz.","errorWord":"was","correctWord":"were","errorType":"Concordancia was/were","explanation":"“They” es plural: “were”."},{"text":"They were watched a movie when the lights went out.","correct":false,"es":"Veían una película cuando se fue la luz.","errorWord":"watched","correctWord":"watching","errorType":"Falta -ing","explanation":"Tras “were” va -ing: “watching”."}],"clue":"was/were + -ing","clueExplain":"pasado continuo = was/were + verbo-ing (acción larga); la interrupción va en past simple. Todo en pasado.","correctReason":"“Were watching” forma el continuo; “went out” interrumpe en past simple.","hint":"Busca las tres piezas: was/were según el sujeto · verbo-ing · interrupción en past simple."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
