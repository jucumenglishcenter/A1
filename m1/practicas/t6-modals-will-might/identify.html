        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }

erbo “ser/estar”?"},{"badge":"👶 El bebé","options":[{"text":"The baby can't walk yet.","correct":true,"es":"El bebé aún no puede caminar."},{"text":"The baby can't walks yet.","correct":false,"es":"El bebé aún no puede caminar.","errorWord":"walks","correctWord":"walk","errorType":"-s después del modal","explanation":"También en negativo: “can't” + base → “walk”."},{"text":"The baby can't to walk yet.","correct":false,"es":"El bebé aún no puede caminar.","errorWord":"to","correctWord":"(nada)","errorType":"“To” después del modal","explanation":"“Can't” va con el verbo directo: “can't walk”."}],"clue":"can't + verbo base","clueExplain":"el modal negativo sigue la misma regla: verbo en forma base.","correctReason":"“Can't walk”: negación del modal + base.","hint":"Después de un modal el verbo va “desnudo”: ni to, ni -s, ni -ing."},{"badge":"📦 La mudanza","options":[{"text":"I will help you with the boxes.","correct":true,"es":"Te ayudaré con las cajas."},{"text":"She cans cook very well.","correct":false,"es":"Ella sabe cocinar muy bien.","errorWord":"cans","correctWord":"can","errorType":"Modal con -s","explanation":"Los modales NUNCA se conjugan: “she can cook”."},{"text":"He must works today.","correct":false,"es":"Él debe trabajar hoy.","errorWord":"works","correctWord":"work","errorType":"-s después del modal","explanation":"Tras “must” el verbo va en base: “work”."}],"clue":"los modales no se conjugan","clueExplain":"ni el modal ni el verbo que le sigue llevan -s: she can cook, he must work.","correctReason":"“Will help”: modal + base, sin conjugar nada.","hint":"Tres oraciones distintas: en dos de ellas alguien puso una -s de más."},{"badge":"❄️ La noche","options":[{"text":"It might snow tonight.","correct":true,"es":"Quizás nieve esta noche."},{"text":"It mights snow tonight.","correct":false,"es":"Quizás nieve esta noche.","errorWord":"mights","correctWord":"might","errorType":"Modal con -s","explanation":"Los modales no se conjugan: “might”, nunca “mights”."},{"text":"It might snows tonight.","correct":false,"es":"Quizás nieve esta noche.","errorWord":"snows","correctWord":"snow","errorType":"-s después del modal","explanation":"Tras “might” el verbo queda en base: “snow”."}],"clue":"los modales no se conjugan","clueExplain":"ni “it” logra ponerle -s a un modal ni al verbo que lo acompaña.","correctReason":"“Might snow”: las dos palabras en su forma.","hint":"La -s de tercera persona aquí no entra por ningún lado."},{"badge":"🤝 La ayuda","options":[{"text":"We can help you.","correct":true,"es":"Podemos ayudarte."},{"text":"You should sleeps more.","correct":false,"es":"Deberías dormir más.","errorWord":"sleeps","correctWord":"sleep","errorType":"-s después del modal","explanation":"Tras “should” va la base: “sleep”."},{"text":"It will raining soon.","correct":false,"es":"Lloverá pronto.","errorWord":"raining","correctWord":"rain","errorType":"-ing después del modal","explanation":"Tras “will” va la base: “rain”."}],"clue":"modal + verbo base","clueExplain":"cada opción usa un modal distinto; la regla es la misma para todos.","correctReason":"“Can help”: modal + verbo base.","hint":"Tres modales, una sola regla. Búscala en cada oración."},{"badge":"🏫 El pasillo","options":[{"text":"Students must not run in the hall.","correct":true,"es":"Los estudiantes no deben correr en el pasillo."},{"text":"Students must not to run in the hall.","correct":false,"es":"Los estudiantes no deben correr en el pasillo.","errorWord":"to","correctWord":"(nada)","errorType":"“To” después del modal","explanation":"“Must not” + verbo directo: “must not run”."},{"text":"Students must not running in the hall.","correct":false,"es":"Los estudiantes no deben correr en el pasillo.","errorWord":"running","correctWord":"run","errorType":"-ing después del modal","explanation":"Tras “must not” va la base: “run”."}],"clue":"must not + base","clueExplain":"la prohibición con must not también pide el verbo en forma base.","correctReason":"“Must not run”: prohibición bien formada.","hint":"Después de un modal el verbo va “desnudo”: ni to, ni -s, ni -ing."},{"badge":"🕐 Más tarde","options":[{"text":"He might come later.","correct":true,"es":"Quizás venga después."},{"text":"He might comes later.","correct":false,"es":"Quizás venga después.","errorWord":"comes","correctWord":"come","errorType":"-s después del modal","explanation":"Tras “might” el verbo va en base: “come”."},{"text":"He might coming later.","correct":false,"es":"Quizás venga después.","errorWord":"coming","correctWord":"come","errorType":"-ing después del modal","explanation":"“Might” + base: “come”."}],"clue":"might + verbo base","clueExplain":"modal (can, must, should, will, might) + verbo en forma BASE: sin “to”, sin -s, sin -ing.","correctReason":"“Might come”: posibilidad con verbo base.","hint":"Después de un modal el verbo va “desnudo”: ni to, ni -s, ni -ing."},{"badge":"💧 El consejo","options":[{"text":"You should drink more water.","correct":true,"es":"Deberías tomar más agua."},{"text":"You should drinks more water.","correct":false,"es":"Deberías tomar más agua.","errorWord":"drinks","correctWord":"drink","errorType":"-s después del modal","explanation":"Tras “should” va la base: “drink”."},{"text":"You should to drink more water.","correct":false,"es":"Deberías tomar más agua.","errorWord":"to","correctWord":"(nada)","errorType":"“To” después del modal","explanation":"“Should” + verbo directo: “should drink”."}],"clue":"should + verbo base","clueExplain":"modal (can, must, should, will, might) + verbo en forma BASE: sin “to”, sin -s, sin -ing.","correctReason":"“Should drink”: consejo con verbo base.","hint":"Después de un modal el verbo va “desnudo”: ni to, ni -s, ni -ing."},{"badge":"🧥 El abrigo","options":[{"text":"It will be cold tomorrow.","correct":true,"es":"Hará frío mañana."},{"text":"Ana can swimming very fast.","correct":false,"es":"Ana sabe nadar muy rápido.","errorWord":"swimming","correctWord":"swim","errorType":"-ing después del modal","explanation":"Tras “can” va la base: “swim”."},{"text":"You must to wear a coat.","correct":false,"es":"Debes usar abrigo.","errorWord":"to","correctWord":"(nada)","errorType":"“To” después del modal","explanation":"“Must” + verbo directo: “must wear”."}],"clue":"modal + verbo base","clueExplain":"tres oraciones, tres modales: solo una respeta la forma base.","correctReason":"“Will be cold”: will + be (base) es la única bien formada.","hint":"Revisa qué le sigue a cada modal: ¿base, -ing o un “to” colado?"},{"badge":"🚗 El domingo","options":[{"text":"We can visit you on Sunday.","correct":true,"es":"Podemos visitarte el domingo."},{"text":"We can visits you on Sunday.","correct":false,"es":"Podemos visitarte el domingo.","errorWord":"visits","correctWord":"visit","errorType":"-s después del modal","explanation":"Tras “can” va la base: “visit”."},{"text":"We can to visit you on Sunday.","correct":false,"es":"Podemos visitarte el domingo.","errorWord":"to","correctWord":"(nada)","errorType":"“To” después del modal","explanation":"“Can” + verbo directo: “can visit”."}],"clue":"can + verbo base","clueExplain":"modal (can, must, should, will, might) + verbo en forma BASE: sin “to”, sin -s, sin -ing.","correctReason":"“Can visit”: modal + base.","hint":"Después de un modal el verbo va “desnudo”: ni to, ni -s, ni -ing."},{"badge":"🏆 El juego","options":[{"text":"You might win today.","correct":true,"es":"Quizás ganes hoy."},{"text":"You might to win today.","correct":false,"es":"Quizás ganes hoy.","errorWord":"to","correctWord":"(nada)","errorType":"“To” después del modal","explanation":"“Might” + verbo directo: “might win”."},{"text":"You might winning today.","correct":false,"es":"Quizás ganes hoy.","errorWord":"winning","correctWord":"win","errorType":"-ing después del modal","explanation":"Tras “might” va la base: “win”."}],"clue":"might + verbo base","clueExplain":"modal (can, must, should, will, might) + verbo en forma BASE: sin “to”, sin -s, sin -ing.","correctReason":"“Might win”: posibilidad con verbo base.","hint":"Después de un modal el verbo va “desnudo”: ni to, ni -s, ni -ing."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
