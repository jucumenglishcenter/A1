        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }

    <script>
    const quizData = [{"badge":"😴 El sueño","options":[{"text":"Ana was tired. When did she sleep?","correct":true,"es":"Ana estaba cansada. ¿Cuándo durmió?"},{"text":"Ana was tired. When did she slept?","correct":false,"es":"Ana estaba cansada. ¿Cuándo durmió?","errorWord":"slept","correctWord":"sleep","errorType":"Pasado doble","explanation":"“Did” ya marca el pasado: el verbo va en base → “did she sleep”."},{"text":"Ana was tired. When she did sleep?","correct":false,"es":"Ana estaba cansada. ¿Cuándo durmió?","errorWord":"she","correctWord":"did she","errorType":"Orden de la pregunta","explanation":"El auxiliar va ANTES del sujeto: “When did she…”."}],"clue":"did + verbo base","clueExplain":"pregunta en pasado = Wh- + did + sujeto + verbo BASE. Si preguntas por el sujeto (Who…?), va directo el verbo en pasado, sin did.","correctReason":"“When did she sleep?”: did antes del sujeto y verbo en base.","hint":"“Did” ya carga el pasado: el verbo que le sigue vuelve a su forma base."},{"badge":"🍳 La cocina","options":[{"text":"The food smelled good. What did he cook?","correct":true,"es":"La comida olía bien. ¿Qué cocinó?"},{"text":"The food smelled good. What did he cooked?","correct":false,"es":"La comida olía bien. ¿Qué cocinó?","errorWord":"cooked","correctWord":"cook","errorType":"Pasado doble","explanation":"Con “did”, el verbo regresa a su forma base: “cook”."},{"text":"The food smelled good. What does he cook?","correct":false,"es":"La comida olía bien. ¿Qué cocina?","errorWord":"does","correctWord":"did","errorType":"Presente en escena pasada","explanation":"“Smelled” cuenta algo pasado: la pregunta también va en pasado (did)."}],"clue":"la escena manda","clueExplain":"si la escena es pasada (smelled), la pregunta usa DID, y el verbo queda en base.","correctReason":"La escena es pasada y “cook” quedó en forma base: correcto.","hint":"Lee la primera oración: ¿en qué tiempo está la escena?"},{"badge":"🚪 La salida","options":[{"text":"Ana left home. Where did she led?","correct":false,"es":"Llegó el bus. ¿Cómo viajó?","errorWord":"traveled","correctWord":"travel","errorType":"Pasado doble","explanation":"Con “did”, “traveled” vuelve a su base: “travel”."},{"text":"The bus came. How does she travel?","correct":false,"es":"Llegó el bus. ¿Cómo viaja?","errorWord":"does","correctWord":"did","errorType":"Presente en escena pasada","explanation":"“Came” es pasado: la pregunta va con “did”."}],"clue":"la escena manda","clueExplain":"escena en pasado → pregunta con did + verbo base.","correctReason":"Pasado (came) + did + travel en base: correcto.","hint":"Compara el tiempo de la primera oración con el de la pregunta."},{"badge":"🍞 El desayuno","options":[{"text":"Breakfast was ready. Who made it?","correct":true,"es":"El desayuno estaba listo. ¿Quién lo hizo?"},{"text":"Breakfast was ready. Who did made it?","correct":false,"es":"El desayuno estaba listo. ¿Quién lo hizo?","errorWord":"did","correctWord":"(nada)","errorType":"Did sobra en pregunta de sujeto","explanation":"Cuando “who” ES el sujeto, el verbo va directo en pasado: “Who made it?”."},{"text":"Breakfast was ready. Who maked it?","correct":false,"es":"El desayuno estaba listo. ¿Quién lo hizo?","errorWord":"maked","correctWord":"made","errorType":"Pasado irregular","explanation":"“Make” es irregular: su pasado es “made”, no “maked”."}],"clue":"who = sujeto → sin did","clueExplain":"si preguntas POR EL SUJETO (¿quién lo hizo?), no se usa did: el verbo va directo en pasado.","correctReason":"“Who made it?” pregunta por el sujeto: verbo directo en pasado.","hint":"Aquí “who” no es cualquier pregunta: es el que HIZO la acción."},{"badge":"⏰ Despertar","options":[{"text":"Ana felt cold. When did Ana wake up?","correct":true,"es":"Ana tenía frío. ¿Cuándo se despertó?"},{"text":"Ana felt cold. When did Ana woke up?","correct":false,"es":"Ana tenía frío. ¿Cuándo se despertó?","errorWord":"woke","correctWord":"wake","errorType":"Pasado doble","explanation":"“Did” ya es pasado: “did Ana wake up”."},{"text":"Ana felt cold. When does Ana wake up?","correct":false,"es":"Ana tenía frío. ¿Cuándo se despierta?","errorWord":"does","correctWord":"did","errorType":"Presente en escena pasada","explanation":"La escena (felt) es pasada: corresponde “did”."}],"clue":"did + verbo base","clueExplain":"pregunta en pasado = Wh- + did + sujeto + verbo BASE. Si preguntas por el sujeto (Who…?), va directo el verbo en pasado, sin did.","correctReason":"“When did Ana wake up?”: did + verbo en base.","hint":"Revisa el tiempo de la escena y la forma del verbo tras el auxiliar."},{"badge":"🍵 Las tazas","options":[{"text":"The cups were dirty. What did she wash?","correct":true,"es":"Las tazas estaban sucias. ¿Qué lavó?"},{"text":"The cups were dirty. What did she washed?","correct":false,"es":"Las tazas estaban sucias. ¿Qué lavó?","errorWord":"washed","correctWord":"wash","errorType":"Pasado doble","explanation":"Después de “did” el verbo va en base: “wash”."},{"text":"The cups were dirty. What she washed?","correct":false,"es":"Las tazas estaban sucias. ¿Qué lavó?","errorWord":"washed","correctWord":"did wash","errorType":"Falta el auxiliar","explanation":"La pregunta necesita “did”: “What did she wash?”."}],"clue":"did + verbo base","clueExplain":"pregunta en pasado = Wh- + did + sujeto + verbo BASE. Si preguntas por el sujeto (Who…?), va directo el verbo en pasado, sin did.","correctReason":"“What did she wash?” usa el auxiliar y el verbo base.","hint":"Sin su auxiliar, la “pregunta” se queda a medias."},{"badge":"💬 La charla","options":[{"text":"They talked a lot. What did they discuss?","correct":true,"es":"Hablaron mucho. ¿De qué hablaron?"},{"text":"They talked a lot. What did they discussed?","correct":false,"es":"Hablaron mucho. ¿De qué hablaron?","errorWord":"discussed","correctWord":"discuss","errorType":"Pasado doble","explanation":"“Did” + verbo base: “discuss”."},{"text":"They talked a lot. What do they discuss?","correct":false,"es":"Hablaron mucho. ¿De qué hablan?","errorWord":"do","correctWord":"did","errorType":"Presente en escena pasada","explanation":"“Talked” es pasado: la pregunta va con “did”."}],"clue":"la escena manda","clueExplain":"escena pasada → did; el verbo que sigue queda en base.","correctReason":"Escena pasada + “did they discuss”: correcto.","hint":"¿La conversación ya pasó o está pasando? Eso elige el auxiliar."},{"badge":"🏫 La escuela","options":[{"text":"School was far. How did Ana get there?","correct":true,"es":"La escuela estaba lejos. ¿Cómo llegó Ana?"},{"text":"School was far. How did Ana got there?","correct":false,"es":"La escuela estaba lejos. ¿Cómo llegó Ana?","errorWord":"got","correctWord":"get","errorType":"Pasado doble","explanation":"Con “did”, “got” vuelve a “get”."},{"text":"School was far. How Ana got there?","correct":false,"es":"La escuela estaba lejos. ¿Cómo llegó Ana?","errorWord":"got","correctWord":"did get","errorType":"Falta el auxiliar","explanation":"Falta “did”: “How did Ana get there?”."}],"clue":"did + verbo base","clueExplain":"pregunta en pasado = Wh- + did + sujeto + verbo BASE. Si preguntas por el sujeto (Who…?), va directo el verbo en pasado, sin did.","correctReason":"“How did Ana get there?”: estructura completa.","hint":"Las dos incorrectas fallan alrededor del mismo verbo, por razones distintas."},{"badge":"😄 La risa","options":[{"text":"Her father smiled. Why did he laugh?","correct":true,"es":"Su padre sonrió. ¿Por qué rió?"},{"text":"Her father smiled. Why did he laughed?","correct":false,"es":"Su padre sonrió. ¿Por qué rió?","errorWord":"laughed","correctWord":"laugh","errorType":"Pasado doble","explanation":"Tras “did”, el verbo va en base: “laugh”."},{"text":"Her father smiled. Why does he laugh?","correct":false,"es":"Su padre sonrió. ¿Por qué ríe?","errorWord":"does","correctWord":"did","errorType":"Presente en escena pasada","explanation":"“Smiled” sitúa todo en pasado: va “did”."}],"clue":"la escena manda","clueExplain":"la primera oración marca el tiempo; la pregunta lo respeta con did.","correctReason":"Pasado + did + laugh (base): correcto.","hint":"Otra vez: la escena decide el auxiliar; el auxiliar decide la forma del verbo."},{"badge":"🕐 El final","options":[{"text":"The class ended. When did it finish?","correct":true,"es":"La clase terminó. ¿Cuándo acabó?"},{"text":"The class ended. When did it finished?","correct":false,"es":"La clase terminó. ¿Cuándo acabó?","errorWord":"finished","correctWord":"finish","errorType":"Pasado doble","explanation":"“Did” + base: “finish”."},{"text":"The class ended. When it finished?","correct":false,"es":"La clase terminó. ¿Cuándo acabó?","errorWord":"finished","correctWord":"did finish","errorType":"Falta el auxiliar","explanation":"Sin “did” no se forma la pregunta: “When did it finish?”."}],"clue":"did + verbo base","clueExplain":"pregunta en pasado = Wh- + did + sujeto + verbo BASE. Si preguntas por el sujeto (Who…?), va directo el verbo en pasado, sin did.","correctReason":"“When did it finish?” está completa y con verbo base.","hint":"“Did” ya carga el pasado: el verbo que le sigue vuelve a su forma base."},{"badge":"🚶 Todos se fueron","options":[{"text":"The room was empty. Where did everyone go?","correct":true,"es":"El cuarto estaba vacío. ¿A dónde fueron todos?"},{"text":"The room was empty. Where did everyone went?","correct":false,"es":"El cuarto estaba vacío. ¿A dónde fueron todos?","errorWord":"went","correctWord":"go","errorType":"Pasado doble","explanation":"“Did” ya es pasado: “did everyone go”."},{"text":"The room was empty. Where does everyone go?","correct":false,"es":"El cuarto estaba vacío. ¿A dónde van todos?","errorWord":"does","correctWord":"did","errorType":"Presente en escena pasada","explanation":"La escena es pasada (was empty): va “did”."}],"clue":"la escena manda","clueExplain":"escena pasada → did + verbo base.","correctReason":"“Where did everyone go?” respeta escena y estructura.","hint":"“Was empty” te dice en qué tiempo ocurre todo."},{"badge":"🤝 La ayuda","options":[{"text":"Someone helped her. Who helped Ana?","correct":true,"es":"Alguien la ayudó. ¿Quién ayudó a Ana?"},{"text":"Someone helped her. Who did helped Ana?","correct":false,"es":"Alguien la ayudó. ¿Quién ayudó a Ana?","errorWord":"did","correctWord":"(nada)","errorType":"Did sobra en pregunta de sujeto","explanation":"“Who” es el sujeto: el verbo va directo → “Who helped Ana?”."},{"text":"Someone helped her. Who helping Ana?","correct":false,"es":"Alguien la ayudó. ¿Quién ayudó a Ana?","errorWord":"helping","correctWord":"helped","errorType":"Forma -ing sin auxiliar","explanation":"“Helping” solo no es pasado: aquí va “helped”."}],"clue":"who = sujeto → sin did","clueExplain":"pregunta por el sujeto: verbo directo en pasado, sin did.","correctReason":"“Who helped Ana?”: pregunta de sujeto bien formada.","hint":"¿Quién hizo la acción? Cuando eso se pregunta, el did descansa."},{"badge":"🍵 La bebida","options":[{"text":"The tea was gone. What did Ana drink?","correct":true,"es":"El té se acabó. ¿Qué bebió Ana?"},{"text":"The tea was gone. What did Ana drank?","correct":false,"es":"El té se acabó. ¿Qué bebió Ana?","errorWord":"drank","correctWord":"drink","errorType":"Pasado doble","explanation":"Tras “did”, el verbo vuelve a base: “drink”."},{"text":"The tea was gone. What Ana drank?","correct":false,"es":"El té se acabó. ¿Qué bebió Ana?","errorWord":"drank","correctWord":"did drink","errorType":"Falta el auxiliar","explanation":"Falta “did”: “What did Ana drink?”."}],"clue":"did + verbo base","clueExplain":"pregunta en pasado = Wh- + did + sujeto + verbo BASE. Si preguntas por el sujeto (Who…?), va directo el verbo en pasado, sin did.","correctReason":"“What did Ana drink?” tiene auxiliar y verbo base.","hint":"“Did” ya carga el pasado: el verbo que le sigue vuelve a su forma base."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=78?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=78?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 78%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
