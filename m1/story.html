<script>
const GLOSS = [{"w":"wake up","es":"despertar(se)","ex":"Ana wakes up at half past six every morning, without an alarm."},{"w":"habit / routine","es":"hábito / rutina","ex":"It is not magic; it is just a good habit."},{"w":"there is / there are","es":"hay (uno / varios)","ex":"There is one full hour before school, and she uses it well."},{"w":"there was / there were","es":"había","ex":"Behind the old pots, there was a small brown notebook."},{"w":"imperativo (Open… / Put…)","es":"orden amable: el verbo primero","ex":"\"Put the cups on the table, please,\" he says with a smile."},{"w":"was / were + -ing","es":"pasado continuo (estaba haciendo)","ex":"She was looking for a clean jar when she found something better."},{"w":"will","es":"futuro (seguro)","ex":"Tomorrow, the little hour will be there for her again."},{"w":"will probably","es":"probablemente (futuro probable)","ex":"\"It will probably rain in the afternoon,\" said grandma Delia."},{"w":"might","es":"podría / quizás","ex":"\"The sky might stay dry.\""},{"w":"may","es":"puede (posibilidad)","ex":"Ten minutes of help may save a neighbor's whole morning."},{"w":"must","es":"deber (obligación fuerte)","ex":"\"Then we must do the outside things first,\" Ana answered."},{"w":"could","es":"podría","ex":"I could ask for the notes."},{"w":"according to","es":"según","ex":"Simple days often make the best memories, according to grandma."},{"w":"actually","es":"en realidad","ex":"I was looking at old photos, actually."},{"w":"although","es":"aunque","ex":"Although the street was wet, everything looked new and clean."},{"w":"especially","es":"especialmente","ex":"Breakfast is important, especially before long classes."},{"w":"definitely","es":"definitivamente","ex":"It is a short moment, but it is definitely her favorite."},{"w":"fairly","es":"bastante","ex":"The walk to school is fairly short, only four long blocks."},{"w":"generally","es":"por lo general","ex":"Short and clear beats long and tired, generally."},{"w":"above","es":"encima de","ex":"Ana was cleaning the high shelf above the stove."},{"w":"near / far","es":"cerca / lejos","ex":"Put the phone far from your bed."},{"w":"between","es":"entre","ex":"There is always an old story between the mixing and the waiting."},{"w":"during","es":"durante","ex":"He fell asleep during the exam."},{"w":"both","es":"ambos / los dos","ex":"\"Eat well, both of you,\" she says."},{"w":"early / late","es":"temprano / tarde","ex":"Go to bed early tonight."},{"w":"never / always","es":"nunca / siempre","ex":"Never study on the bed."},{"w":"important","es":"importante","ex":"Breakfast is important, especially before long classes."},{"w":"floor","es":"piso","ex":"The floor was broken, and there was no glass in two windows."},{"w":"drink","es":"beber / bebida","ex":"Her grandmother Delia drinks her tea slowly, near the kitchen window."},{"w":"learn","es":"aprender","ex":"The brain learns while you sleep."},{"w":"leave","es":"salir / dejar","ex":"Then you must leave home earlier."},{"w":"help","es":"ayudar / ayuda","ex":"\"Leave it there, we can help!\""}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"The Hour Before School","sTitleEs":"La hora antes de la escuela","dTitle":"Good Mornings and Bad Habits","dTitleEs":"Buenas mañanas y malos hábitos","paras":[[["Ana wakes up at half past six every morning, without an alarm.","Ana se despierta a las seis y media cada mañana, sin despertador."],["Her body simply knows the time, especially on cold school days.","Su cuerpo simplemente sabe la hora, especialmente en los días fríos de escuela."],["There is one full hour before school, and she uses it well.","Hay una hora completa antes de la escuela, y ella la usa bien."],["That quiet hour is her favorite part of the whole day.","Esa hora tranquila es su parte favorita de todo el día."]],[["First, she opens the window and feels the early morning air.","Primero, abre la ventana y siente el aire de la mañana."],["The street below is still quiet, and the sky is gray.","La calle abajo sigue tranquila, y el cielo está gris."],["There are two birds on the wire, singing their usual song.","Hay dos pájaros en el cable, cantando su canción de siempre."],["Ana says good morning to them, because old habits feel good.","Ana les dice buenos días, porque los viejos hábitos se sienten bien."]],[["In the kitchen, her father Ernesto is already making the breakfast.","En la cocina, su papá Ernesto ya está preparando el desayuno."],["\"Put the cups on the table, please,\" he says with a smile.","«Pon las tazas en la mesa, por favor», dice con una sonrisa."],["\"And open the curtains — we need a little light in here.\"","«Y abre las cortinas — necesitamos un poco de luz aquí»."],["Ana helps him every day, and the kitchen slowly wakes up.","Ana lo ayuda cada día, y la cocina despierta lentamente."]],[["There is hot tea, fresh bread, and fruit on the table.","Hay té caliente, pan fresco y fruta en la mesa."],["Some days there are eggs too, if they have extra time.","Algunos días también hay huevos, si tienen tiempo extra."],["They eat together and talk about the plans for the day.","Comen juntos y conversan sobre los planes del día."],["It is a short moment, but it is definitely her favorite.","Es un momento corto, pero definitivamente es su favorito."]],[["Her grandmother Delia drinks her tea slowly, near the kitchen window.","Su abuela Delia toma su té despacio, cerca de la ventana de la cocina."],["She is not a morning person, according to her own words.","No es una persona madrugadora, según sus propias palabras."],["But she never misses breakfast with the family, not one day.","Pero nunca se pierde el desayuno con la familia, ni un día."],["\"Eat well, both of you,\" she says. \"The day is long.\"","«Coman bien, los dos», dice. «El día es largo»."]],[["After breakfast, Ana washes the dishes and dries them fast.","Después del desayuno, Ana lava los platos y los seca rápido."],["Then she checks her bag: books, notebook, pencils, and keys.","Luego revisa su mochila: libros, cuaderno, lápices y llaves."],["There is a small mirror by the door, above the shelf.","Hay un espejo pequeño junto a la puerta, encima de la repisa."],["One last look, one deep breath, and she is ready.","Una última mirada, una respiración profunda, y está lista."]],[["From the door, she can see her neighbor Rodrigo running late.","Desde la puerta, puede ver a su vecino Rodrigo saliendo tarde."],["His breakfast is in one hand, his shoes in the other.","Su desayuno está en una mano, sus zapatos en la otra."],["\"Good morning, Rodrigo! Tie your shoes first!\" Ana calls out.","«¡Buenos días, Rodrigo! ¡Amárrate los zapatos primero!», le grita Ana."],["He laughs, because this happens to him almost every single morning.","Él se ríe, porque esto le pasa casi todas las mañanas."]],[["The walk to school is fairly short, only four long blocks.","La caminata a la escuela es bastante corta, solo cuatro cuadras largas."],["Ana is never in a hurry, and that is the secret.","Ana nunca está apurada, y ese es el secreto."],["There is time to walk, time to think, and time to arrive.","Hay tiempo para caminar, tiempo para pensar y tiempo para llegar."],["The school doors are still open when she walks in, calm.","Las puertas de la escuela siguen abiertas cuando ella entra, tranquila."]],[["One quiet hour changes the whole day — that is her idea.","Una hora tranquila cambia todo el día — esa es su idea."],["It is not magic; it is just a good habit.","No es magia; es solo un buen hábito."],["Wake up early, help at home, eat well, and walk calmly.","Despierta temprano, ayuda en casa, come bien y camina con calma."],["Tomorrow, the little hour will be there for her again.","Mañana, la pequeña hora estará ahí para ella otra vez."]]],"datos":[null,null,"Órdenes amables (imperativo): <span class=\"frase\">Put the cups… · Open the curtains…</span> — el verbo va primero, sin sujeto.",null,"«Según» = <b>according to</b>: <span class=\"frase\">according to her own words.</span>",null,null,"<b>fairly</b> = bastante: <span class=\"frase\">fairly short</span>. <b>never</b> = nunca (va antes del verbo).",null],"dlg":[["Marisol","Ana, how are you so calm at eight in the morning?","Ana, ¿cómo estás tan tranquila a las ocho de la mañana?"],["Ana","Ha! Good morning to you too, Marisol.","¡Ja! Buenos días a ti también, Marisol."],["Marisol","I am serious. What is your secret?","Hablo en serio. ¿Cuál es tu secreto?"],["Ana","I wake up early. That is the whole secret.","Me despierto temprano. Ese es todo el secreto."],["Marisol","Early? How early are we talking about?","¿Temprano? ¿Qué tan temprano estamos hablando?"],["Ana","Half past six, every day, without an alarm.","Seis y media, cada día, sin alarma."],["Marisol","That sounds like a bad dream, honestly.","Eso suena como un mal sueño, honestamente."],["Ana","What time did you wake up today?","¿A qué hora te despertaste hoy?"],["Marisol","At seven forty… and the bus leaves at seven fifty.","A las siete y cuarenta… y el bus sale a las siete y cincuenta."],["Ana","Marisol! What did you eat for breakfast?","¡Marisol! ¿Qué desayunaste?"],["Marisol","Half a banana. I was running to the bus stop.","Medio plátano. Iba corriendo al paradero."],["Ana","And yesterday? What did you eat yesterday?","¿Y ayer? ¿Qué comiste ayer?"],["Marisol","Yesterday… nothing. Okay, I see the problem.","Ayer… nada. Bueno, ya veo el problema."],["Ana","Breakfast is important, especially before long classes.","El desayuno es importante, especialmente antes de clases largas."],["Marisol","My mother says the same thing every morning.","Mi mamá dice lo mismo cada mañana."],["Ana","Then listen to her! Go to bed early tonight.","¡Entonces hazle caso! Acuéstate temprano esta noche."],["Marisol","I always plan that, but then I watch one more video…","Siempre lo planeo, pero luego veo un video más…"],["Ana","Put the phone far from your bed. Problem solved.","Pon el teléfono lejos de tu cama. Problema resuelto."],["Marisol","Far from my bed?! That is a strong idea.","¡¿Lejos de mi cama?! Esa es una idea fuerte."],["Ana","Try it for one week. Your body gets used to it.","Pruébalo una semana. Tu cuerpo se acostumbra."],["Marisol","And if I fail after two days?","¿Y si fallo a los dos días?"],["Ana","Then start again. Habits need practice, not perfection.","Entonces empieza de nuevo. Los hábitos necesitan práctica, no perfección."],["Marisol","Okay, deal. One week of early nights.","Bueno, trato. Una semana de noches tempranas."],["Ana","And a real breakfast every morning!","¡Y un desayuno de verdad cada mañana!"],["Marisol","Yes, teacher Ana. A real breakfast too.","Sí, profesora Ana. Un desayuno de verdad también."],["Ana","Perfect. Tomorrow you will thank me.","Perfecto. Mañana me lo agradecerás."]]},"2":{"sTitle":"The Cookbook","sTitleEs":"El recetario","dTitle":"A Better Way to Study","dTitleEs":"Una mejor forma de estudiar","paras":[[["Last Saturday, Ana was cleaning the high shelf above the stove.","El sábado pasado, Ana estaba limpiando la repisa alta encima de la cocina."],["She was looking for a clean jar when she found something better.","Estaba buscando un frasco limpio cuando encontró algo mejor."],["Behind the old pots, there was a small brown notebook.","Detrás de las ollas viejas, había un cuaderno marrón pequeño."],["On the first page, in blue ink: \"Recipes of Delia\".","En la primera página, con tinta azul: «Recetas de Delia»."]],[["Ana opened it slowly, because the pages were old and soft.","Ana lo abrió despacio, porque las páginas estaban viejas y suaves."],["There were recipes for soups, sweet bread, and Sunday rice.","Había recetas de sopas, pan dulce y arroz de domingo."],["Little notes were dancing in the corners of every page.","Pequeñas notas bailaban en las esquinas de cada página."],["\"Use less salt.\" \"Cook it slowly.\" \"For rainy days.\"","«Usa menos sal». «Cocínalo despacio». «Para días de lluvia»."]],[["While Ana was reading, her grandmother walked into the kitchen.","Mientras Ana estaba leyendo, su abuela entró a la cocina."],["Delia stopped, smiled, and sat down without a single word.","Delia se detuvo, sonrió y se sentó sin decir una palabra."],["\"I was writing that book when your father was a boy.\"","«Yo escribía ese libro cuando tu papá era un niño»."],["\"Every recipe has a story. Choose one, and I will tell it.\"","«Cada receta tiene una historia. Elige una, y te la cuento»."]],[["Ana chose the sweet bread, because the page looked well used.","Ana eligió el pan dulce, porque la página se veía muy usada."],["\"Ah, that one. I was making it when I met your grandfather.\"","«Ah, esa. La estaba haciendo cuando conocí a tu abuelo»."],["\"He was walking by the house and stopped because of the smell.\"","«Él pasaba caminando junto a la casa y se detuvo por el olor»."],["Ana closed the book. \"We are making it today, grandma.\"","Ana cerró el libro. «Lo vamos a hacer hoy, abuela»."]],[["Delia read the steps out loud, like a general with orders.","Delia leyó los pasos en voz alta, como una general con órdenes."],["\"Mix the flour and the sugar. Add the eggs, one by one.\"","«Mezcla la harina y el azúcar. Agrega los huevos, uno por uno»."],["\"Put the bowl near the window. Now wait, and do not touch.\"","«Pon el tazón cerca de la ventana. Ahora espera, y no toques»."],["Waiting was the hard part, especially with that sweet smell.","Esperar era la parte difícil, especialmente con ese olor dulce."]],[["While the bread was growing, Delia told more old stories.","Mientras el pan crecía, Delia contó más historias antiguas."],["She was laughing at one memory when Ernesto came home.","Se estaba riendo de un recuerdo cuando Ernesto llegó a casa."],["\"I know that smell,\" he said from the door, surprised.","«Conozco ese olor», dijo desde la puerta, sorprendido."],["\"Mom, you did not make that bread in fifteen years.\"","«Mamá, no hacías ese pan hace quince años»."]],[["The bread came out of the oven, golden and warm.","El pan salió del horno, dorado y calientito."],["They ate it with tea, and nobody was in a hurry.","Lo comieron con té, y nadie estaba apurado."],["Ernesto closed his eyes with the first bite, like a boy.","Ernesto cerró los ojos con el primer bocado, como un niño."],["\"It is the same bread,\" he said. \"Exactly the same.\"","«Es el mismo pan», dijo. «Exactamente el mismo»."]],[["That night, Ana copied the recipe into her own notebook.","Esa noche, Ana copió la receta en su propio cuaderno."],["She also added a new note in the corner, in green ink.","También agregó una nota nueva en la esquina, con tinta verde."],["\"First made with grandma Delia, on a gray Saturday.\"","«Hecho por primera vez con la abuela Delia, un sábado gris»."],["According to Delia, notes are the secret salt of every recipe.","Según Delia, las notas son la sal secreta de toda receta."]],[["Now they cook together one Saturday every month, without fail.","Ahora cocinan juntas un sábado cada mes, sin falta."],["There is always an old story between the mixing and the waiting.","Siempre hay una historia antigua entre el mezclado y la espera."],["The little brown book lives on a lower shelf now.","El cuadernito marrón ahora vive en una repisa más baja."],["Some treasures must stay close, where the hands can reach them.","Algunos tesoros deben quedarse cerca, donde las manos puedan alcanzarlos."]]],"datos":["Pasado continuo = <b>was/were + -ing</b>: <span class=\"frase\">She was cleaning · notes were dancing.</span>",null,"Continuo + simple juntos: <span class=\"frase\">She was reading when grandma walked in</span> — acción larga interrumpida por una corta.",null,"Las recetas usan imperativo: <span class=\"frase\">Mix… Add… Put… Wait.</span>",null,null,null,null],"dlg":[["Marisol","Ana, I studied four hours yesterday and remember nothing.","Ana, ayer estudié cuatro horas y no recuerdo nada."],["Ana","Four hours! How were you studying, exactly?","¡Cuatro horas! ¿Cómo estabas estudiando, exactamente?"],["Marisol","On my bed, with music, and with my phone near me.","En mi cama, con música, y con mi teléfono cerca."],["Ana","There is your problem. Three problems, actually.","Ahí está tu problema. Tres problemas, en realidad."],["Marisol","The music helps me! Well… I think it helps me.","¡La música me ayuda! Bueno… creo que me ayuda."],["Ana","What were you listening to while you were reading?","¿Qué escuchabas mientras leías?"],["Marisol","My favorite songs. I was singing a little too.","Mis canciones favoritas. También cantaba un poquito."],["Ana","Singing! You were having a concert, not studying.","¡Cantando! Tenías un concierto, no una sesión de estudio."],["Marisol","Okay, okay. Teach me your way, please.","Ya, ya. Enséñame tu método, por favor."],["Ana","First: sit at a table. Never study on the bed.","Primero: siéntate en una mesa. Nunca estudies en la cama."],["Marisol","The bed is so comfortable, though…","Aunque la cama es tan cómoda…"],["Ana","The bed is for sleeping. Your brain knows that.","La cama es para dormir. Tu cerebro lo sabe."],["Ana","Second: put the phone in another room.","Segundo: pon el teléfono en otro cuarto."],["Marisol","You and that idea again! Fine, another room.","¡Tú y esa idea otra vez! Bueno, otro cuarto."],["Ana","Third: study for twenty-five minutes, then rest for five.","Tercero: estudia veinticinco minutos, luego descansa cinco."],["Marisol","Only twenty-five? I could do that, definitely.","¿Solo veinticinco? Podría hacer eso, definitivamente."],["Ana","Short and clear beats long and tired, generally.","Corto y claro le gana a largo y cansado, por lo general."],["Marisol","And what about the night before the exam?","¿Y la noche antes del examen?"],["Ana","You must sleep. A tired brain forgets everything.","Debes dormir. Un cerebro cansado lo olvida todo."],["Marisol","My cousin studies all night with three coffees.","Mi primo estudia toda la noche con tres cafés."],["Ana","And how did his last exam go?","¿Y cómo le fue en su último examen?"],["Marisol","…He fell asleep during the exam.","…Se quedó dormido durante el examen."],["Ana","Exactly. The brain learns while you sleep.","Exacto. El cerebro aprende mientras duermes."],["Marisol","Table, no phone, short blocks, real sleep.","Mesa, sin teléfono, bloques cortos, sueño de verdad."],["Ana","You could add water and a small walk too.","Podrías agregar agua y una caminata corta también."],["Marisol","Deal. Next exam, new Marisol.","Trato. Próximo examen, nueva Marisol."]]},"3":{"sTitle":"The House on Calle Verde","sTitleEs":"La casa de la Calle Verde","dTitle":"Planning the Week","dTitleEs":"Planeando la semana","paras":[[["The house on Calle Verde is not large, but it is honest.","La casa de la Calle Verde no es grande, pero es honesta."],["There are two floors, a small garden, and a blue door.","Hay dos pisos, un jardín pequeño y una puerta azul."],["Ana knows every corner, every stair, and every little sound.","Ana conoce cada rincón, cada escalón y cada pequeño sonido."],["The house knows her too — that is what grandma says.","La casa también la conoce a ella — eso dice la abuela."]],[["Ernesto bought the house twenty years ago, when it was gray.","Ernesto compró la casa hace veinte años, cuando era gris."],["The floor was broken, and there was no glass in two windows.","El piso estaba roto, y no había vidrio en dos ventanas."],["\"Everyone saw an old house; I saw our future,\" he says.","«Todos veían una casa vieja; yo vi nuestro futuro», dice él."],["He was young then, and young eyes see far.","Era joven entonces, y los ojos jóvenes ven lejos."]],[["He was painting the front door when the neighbors came to look.","Estaba pintando la puerta del frente cuando los vecinos vinieron a mirar."],["\"Blue? For a door?\" they asked, with big doubtful eyes.","«¿Azul? ¿Para una puerta?», preguntaron, con ojos grandes y dudosos."],["\"Yes, blue like the sea,\" Ernesto answered, and kept painting.","«Sí, azul como el mar», respondió Ernesto, y siguió pintando."],["Today, half of Calle Verde has doors with happy colors.","Hoy, la mitad de la Calle Verde tiene puertas de colores alegres."]],[["Inside, there is a kitchen that smells like tea and bread.","Adentro, hay una cocina que huele a té y pan."],["There is a living room with a large, tired, beloved sofa.","Hay una sala con un sofá grande, cansado y querido."],["On the walls, there are photos from every year of their life.","En las paredes, hay fotos de cada año de su vida."],["The house is small, but the walls hold many stories.","La casa es pequeña, pero las paredes guardan muchas historias."]],[["Ana's room is above the kitchen, warm in every season.","El cuarto de Ana está encima de la cocina, cálido en toda estación."],["There is a desk by the window, with a view of the street.","Hay un escritorio junto a la ventana, con vista a la calle."],["She was doing homework there when she saw her first storm.","Estaba haciendo tarea ahí cuando vio su primera tormenta."],["The rain was hitting the glass, and she felt safe inside.","La lluvia golpeaba el vidrio, y ella se sentía segura adentro."]],[["Grandma Delia came to live with them five years ago.","La abuela Delia vino a vivir con ellos hace cinco años."],["She was feeling alone in her old town after grandpa died.","Se sentía sola en su antiguo pueblo después de que murió el abuelo."],["The first weeks were quiet; she was missing her old kitchen.","Las primeras semanas fueron calladas; extrañaba su antigua cocina."],["Then one day she cooked, and the house changed forever.","Entonces un día cocinó, y la casa cambió para siempre."]],[["Now there are three plates at the table every single night.","Ahora hay tres platos en la mesa todas las noches."],["There is a garden with tomatoes, thanks to Delia's patient hands.","Hay un jardín con tomates, gracias a las manos pacientes de Delia."],["There is music on Sundays, old songs from her young years.","Hay música los domingos, canciones viejas de sus años jóvenes."],["A house needs people; people make the house a home.","Una casa necesita personas; las personas hacen de la casa un hogar."]],[["Last month, they were eating dinner when the lights went out.","El mes pasado, estaban cenando cuando se fue la luz."],["Ernesto found the candles, and nobody stopped the conversation.","Ernesto encontró las velas, y nadie detuvo la conversación."],["In the soft light, the old walls looked young again.","Con la luz suave, las paredes viejas se veían jóvenes otra vez."],["\"This is my favorite lamp,\" said Delia, and everyone laughed.","«Esta es mi lámpara favorita», dijo Delia, y todos rieron."]],[["Houses on Calle Verde look almost the same from outside.","Las casas de la Calle Verde se ven casi iguales desde afuera."],["But every blue or red door hides a different world.","Pero cada puerta azul o roja esconde un mundo diferente."],["Behind this one, there is tea, music, and patient love.","Detrás de esta, hay té, música y amor paciente."],["That is the true story of the house on Calle Verde.","Esa es la verdadera historia de la casa de la Calle Verde."]]],"datos":[null,"<b>There was / There were</b> = había: <span class=\"frase\">there was no glass in two windows.</span>",null,null,null,"«Hace cinco años» = <b>five years ago</b> (ago va al final).",null,"Continuo interrumpido: <span class=\"frase\">They were eating dinner when the lights went out.</span>",null],"dlg":[["Ernesto","Ana, bring the calendar, please. Sunday planning time.","Ana, trae el calendario, por favor. Hora de planear el domingo."],["Ana","Here it is. Okay, what does this week look like?","Aquí está. A ver, ¿cómo se ve esta semana?"],["Ernesto","Monday I will work until six, maybe seven.","El lunes trabajaré hasta las seis, quizás siete."],["Ana","Then I will cook on Monday. Something easy.","Entonces yo cocino el lunes. Algo fácil."],["Ernesto","Tuesday you have your English class, right?","El martes tienes tu clase de inglés, ¿no?"],["Ana","Yes, until five. I will probably study after dinner too.","Sí, hasta las cinco. Probablemente estudie después de la cena también."],["Ernesto","Wednesday might be complicated. The bus drivers might stop work.","El miércoles puede ser complicado. Los choferes podrían parar."],["Ana","Again? Then you must leave home earlier.","¿Otra vez? Entonces debes salir de casa más temprano."],["Ernesto","Yes, probably at six. I will need strong coffee.","Sí, probablemente a las seis. Necesitaré café fuerte."],["Ana","I will prepare it the night before. No problem.","Lo dejaré listo la noche anterior. No hay problema."],["Ernesto","Thursday is grandma's doctor visit, at ten in the morning.","El jueves es la cita médica de la abuela, a las diez."],["Ana","I have classes… but I could ask for the notes.","Tengo clases… pero podría pedir los apuntes."],["Ernesto","No, no. School first. I will take her myself.","No, no. La escuela primero. Yo la llevo."],["Ana","Okay, but call me after the doctor, please.","Bueno, pero llámame después del doctor, por favor."],["Ernesto","Of course. Friday night is free, I think.","Claro. El viernes por la noche está libre, creo."],["Ana","Marisol might come to study. Exams are close.","Marisol podría venir a estudiar. Los exámenes están cerca."],["Ernesto","Then I will make my famous soup for you two.","Entonces haré mi sopa famosa para ustedes dos."],["Ana","Your ONLY soup, dad. You have one recipe.","Tu ÚNICA sopa, papá. Tienes una receta."],["Ernesto","One perfect recipe! Quality over quantity.","¡Una receta perfecta! Calidad sobre cantidad."],["Ana","Ha! And Saturday? Market in the morning?","¡Ja! ¿Y el sábado? ¿Mercado en la mañana?"],["Ernesto","Yes, early. The good fruit goes fast.","Sí, temprano. La fruta buena se va rápido."],["Ana","And Sunday we rest. That is the law.","Y el domingo descansamos. Esa es la ley."],["Ernesto","Agreed. Well, grandma will probably cook something big.","De acuerdo. Bueno, la abuela probablemente cocine algo grande."],["Ana","Then we will rest… and eat. Perfect Sunday.","Entonces descansaremos… y comeremos. Domingo perfecto."],["Ernesto","Good plan, team. This week does not have any surprises for us.","Buen plan, equipo. Esta semana no tiene ninguna sorpresa para nosotros."],["Ana","Famous last words, dad. Famous last words.","Últimas palabras famosas, papá. Últimas palabras famosas."]]},"4":{"sTitle":"A Day Well Used","sTitleEs":"Un día bien usado","dTitle":"Neighbors in the Afternoon","dTitleEs":"Vecinos por la tarde","paras":[[["Saturday mornings have a special taste in the house on Calle Verde.","Las mañanas de sábado tienen un sabor especial en la casa de la Calle Verde."],["There is no alarm, no uniform, and no fast breakfast.","No hay alarma, ni uniforme, ni desayuno rápido."],["But a free day is not an empty day, says Ernesto.","Pero un día libre no es un día vacío, dice Ernesto."],["\"Use the day well, and the day will pay you back.\"","«Usa bien el día, y el día te lo devolverá»."]],[["This Saturday, the sky was gray and heavy at nine.","Este sábado, el cielo estaba gris y pesado a las nueve."],["\"It will probably rain in the afternoon,\" said grandma Delia.","«Probablemente llueva por la tarde», dijo la abuela Delia."],["\"Then we must do the outside things first,\" Ana answered.","«Entonces debemos hacer lo de afuera primero», respondió Ana."],["Good plans are simple: outside first, inside later.","Los buenos planes son simples: afuera primero, adentro después."]],[["At the market, the fruit was shining in long, bright lines.","En el mercado, la fruta brillaba en filas largas y luminosas."],["Ana chose apples while Ernesto was looking for good tomatoes.","Ana escogía manzanas mientras Ernesto buscaba buenos tomates."],["\"Don Felipe, how much for both bags?\" asked Ernesto, smiling.","«Don Felipe, ¿cuánto por las dos bolsas?», preguntó Ernesto, sonriendo."],["Old friends and fair prices — that is the market on Saturdays.","Viejos amigos y precios justos — así es el mercado los sábados."]],[["On the way home, they saw Doña Carmen at her gate.","De camino a casa, vieron a Doña Carmen en su puerta."],["She was trying to carry a large box of old books.","Estaba intentando cargar una caja grande de libros viejos."],["\"Leave it there, we can help!\" said Ana, crossing the street.","«¡Déjela ahí, podemos ayudar!», dijo Ana, cruzando la calle."],["Ten minutes of help may save a neighbor's whole morning.","Diez minutos de ayuda pueden salvarle toda la mañana a un vecino."]],[["Doña Carmen gave them cold juice and told a quick story.","Doña Carmen les dio jugo frío y contó una historia rápida."],["The books were her husband's; he was a history teacher.","Los libros eran de su esposo; él era profesor de historia."],["\"Take one, Ana. Knowledge must walk, not sleep in boxes.\"","«Llévate uno, Ana. El conocimiento debe caminar, no dormir en cajas»."],["Ana chose a book about old Lima, with yellow pages.","Ana eligió un libro sobre la Lima antigua, de páginas amarillas."]],[["The rain arrived at three, exactly as grandma said.","La lluvia llegó a las tres, exactamente como dijo la abuela."],["Delia was sleeping in her chair, with the radio singing low.","Delia dormía en su silla, con la radio cantando bajito."],["Ana was reading her new old book by the window.","Ana leía su nuevo libro viejo junto a la ventana."],["Ernesto was fixing a kitchen drawer, slowly and happily.","Ernesto arreglaba un cajón de la cocina, despacio y feliz."]],[["At six the rain stopped, and the evening got cool and clean.","A las seis paró la lluvia, y la tarde se puso fresca y limpia."],["\"A short walk?\" asked Ernesto. \"The sky might stay dry.\"","«¿Una caminata corta?», preguntó Ernesto. «El cielo podría seguir seco»."],["They walked to the corner and back, talking about small things.","Caminaron hasta la esquina y de vuelta, hablando de cosas pequeñas."],["Although the street was wet, everything looked new and clean.","Aunque la calle estaba mojada, todo se veía nuevo y limpio."]],[["Dinner was nice and simple: bread, cheese, and market tomatoes.","La cena fue linda y simple: pan, queso y tomates del mercado."],["Nobody was in a hurry; Saturday nights are generous with time.","Nadie estaba apurado; las noches de sábado son generosas con el tiempo."],["They talked about the books, the rain, and next week's plans.","Hablaron de los libros, la lluvia y los planes de la próxima semana."],["Simple days often make the best memories, according to grandma.","Los días simples suelen hacer los mejores recuerdos, según la abuela."]],[["In bed, Ana thought about the whole gray, golden day.","En la cama, Ana pensó en todo el día gris y dorado."],["A market, a kind neighbor, a book, rain, and warm bread.","Un mercado, una vecina amable, un libro, lluvia y pan calientito."],["Tomorrow will bring its own plans, and maybe new surprises.","Mañana traerá sus propios planes, y quizás nuevas sorpresas."],["A day well used is never lost — now she understands it.","Un día bien usado nunca se pierde — ahora lo entiende."]]],"datos":[null,"Futuro y probabilidad: <b>will</b> (seguro) · <b>will probably</b> (probable) · <b>might</b> (quizás): <span class=\"frase\">It will probably rain · The sky might stay dry.</span>",null,"<b>may</b> = puede (posibilidad): <span class=\"frase\">Ten minutes of help may save a morning.</span>","<b>must</b> = deber: <span class=\"frase\">Knowledge must walk.</span>",null,null,null,null],"dlg":[["Doña Carmen","Ana! Come in, come in. I was making tea.","¡Ana! Pasa, pasa. Estaba haciendo té."],["Ana","Thank you, Doña Carmen. I brought your plate back.","Gracias, Doña Carmen. Le traje su plato de vuelta."],["Doña Carmen","Ah, the sweet bread plate! How was it?","¡Ah, el plato del pan dulce! ¿Qué tal estaba?"],["Ana","Perfect. Grandma says you must give her the recipe.","Perfecto. La abuela dice que debe darle la receta."],["Doña Carmen","Ha! Delia and her diplomatic missions.","¡Ja! Delia y sus misiones diplomáticas."],["Ana","What were you doing when I knocked?","¿Qué estaba haciendo cuando toqué?"],["Doña Carmen","I was looking at old photos, actually.","Estaba mirando fotos viejas, en realidad."],["Ana","Can I see them too?","¿Puedo verlas también?"],["Doña Carmen","Of course. Sit here, near the light.","Claro. Siéntate aquí, cerca de la luz."],["Doña Carmen","This one is Calle Verde, forty years ago.","Esta es la Calle Verde, hace cuarenta años."],["Ana","There are no cars! And so many trees!","¡No hay autos! ¡Y cuántos árboles!"],["Doña Carmen","We were planting those trees in this photo, see?","Estábamos plantando esos árboles en esta foto, ¿ves?"],["Ana","Is that young man your husband?","¿Ese joven es su esposo?"],["Doña Carmen","Yes. He was carrying water for everyone that day.","Sí. Ese día él cargaba agua para todos."],["Ana","And who was taking the photo?","¿Y quién tomaba la foto?"],["Doña Carmen","Your grandfather, Ana. He had the only camera.","Tu abuelo, Ana. Él tenía la única cámara."],["Ana","My grandfather?! I never knew that.","¡¿Mi abuelo?! Nunca supe eso."],["Doña Carmen","Our families were always close, like the trees.","Nuestras familias siempre fueron unidas, como los árboles."],["Ana","What was the street like without the market?","¿Cómo era la calle sin el mercado?"],["Doña Carmen","Quiet. Too quiet. The market brought life.","Tranquila. Demasiado tranquila. El mercado trajo vida."],["Ana","These photos must go in an album, Doña Carmen.","Estas fotos deben ir en un álbum, Doña Carmen."],["Doña Carmen","My eyes are old for that little work.","Mis ojos están viejos para ese trabajito."],["Ana","Then I will help you! Next Saturday?","¡Entonces yo la ayudo! ¿El próximo sábado?"],["Doña Carmen","You are your grandfather's family, no doubt.","Eres de la familia de tu abuelo, sin duda."],["Ana","Is that a yes?","¿Eso es un sí?"],["Doña Carmen","It is a yes, with tea and stories included.","Es un sí, con té e historias incluidas."]]}};

  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
<script id="jecback">
window.jecGoBack=function(){ location.href="https://jucum-english-center.netlify.app/"; };
</script>
